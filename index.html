    .contract-subnav{margin:-2px 0 7px 12px;padding-left:10px;border-left:2px solid #dbe3f0}.contract-subnav button{font-size:13px;padding:9px 10px}.contract-subnav button.active{background:#fff0ed;color:#c74f42}.contract-draft{border-top:4px solid #1b2a57}.contract-title,.quote-document-title{text-align:center;font-size:29px;font-weight:900;margin:8px 0 22px}.contract-intro{padding:13px;background:#f6f8fc;border:1px solid #dce4f0;line-height:1.7}.contract-draft h3{margin:26px 0 10px;padding-bottom:8px;border-bottom:2px solid #1b2a57}.contract-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.contract-grid .wide{grid-column:1/-1}.contract-grid textarea{width:100%;min-height:95px;margin-top:5px;padding:10px;border:1px solid #d7dfe9;border-radius:7px;font:inherit;color:#172852}.assignment-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-top:20px}.assignment-card{background:#fff;border:1px solid #dfe6f0;border-radius:12px;padding:16px}.assignment-card h2{font-size:17px;margin:8px 0}.assignment-meta{color:#64718a;font-size:13px;min-height:38px}.assignment-signal{display:flex;align-items:center;gap:10px;margin:13px 0;font-size:15px;font-weight:850;color:#43516a}.traffic-lights{display:flex;align-items:center;gap:6px;padding:6px 7px;background:#fff;border:1px solid #d7dfe9;border-radius:16px;box-shadow:0 1px 3px #17285218}.traffic-lights i{display:block;width:20px;height:20px;border-radius:50%;opacity:.22;box-shadow:inset 0 0 0 2px #0004}.traffic-lights .red{background:#e0524a}.traffic-lights .orange{background:#f29b38}.traffic-lights .green{background:#19a36c}.assignment-signal.red .traffic-lights .red,.assignment-signal.orange .traffic-lights .orange,.assignment-signal.green .traffic-lights .green{opacity:1;box-shadow:0 0 12px currentColor,inset 0 0 0 2px #fff8}.assignment-signal.red .traffic-lights .red{color:#e0524a}.assignment-signal.orange .traffic-lights .orange{color:#f29b38}.assignment-signal.green .traffic-lights .green{color:#19a36c}.assignment-metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:16px 0}.assignment-metrics div{background:#f5f7fb;border-radius:8px;padding:9px;text-align:center;color:#64718a;font-size:11px}.assignment-metrics label{font-size:11px}.assignment-metrics input{padding:5px;text-align:center;margin-top:4px}.assignment-metrics b{display:block;margin-top:4px;color:#172852;font-size:19px}.assignment-metrics .vacancy b{color:#e15b4e}.assignment-workers{border-top:1px solid #e4e8ef;padding-top:12px;font-size:13px;line-height:1.7}.assignment-workers span{display:inline-block;margin:3px 4px 0 0;padding:3px 7px;border-radius:99px;background:#edf1fb;color:#344b80;font-size:12px}@media(max-width:800px){.assignment-grid{grid-template-columns:1fr 1fr}}.document-preview{position:fixed;z-index:20;inset:0;overflow:auto;background:#eef2f8;padding:28px}.preview-toolbar{position:sticky;top:0;z-index:1;max-width:900px;margin:0 auto 18px;background:#172852;color:#fff;border-radius:10px;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px}.preview-toolbar div{display:flex;gap:8px}.preview-toolbar .secondary{padding:8px 12px}.preview-paper{max-width:900px;margin:0 auto;background:#fff;padding:42px;box-shadow:0 6px 28px #17285222}.preview-paper .panel{border:0;padding:0;border-radius:0}.preview-paper .quote-panel,.preview-paper .contract-draft{display:block!important}.preview-value{display:block;min-height:20px;padding:7px 0;border-bottom:1px solid #d7dfe9;white-space:pre-wrap}.preview-paper .quote-table .preview-value{padding:0;border:0;text-align:right}.preview-paper .seal-upload{display:none}@media(max-width:520px){.contract-grid,.assignment-grid{grid-template-columns:1fr}.document-preview{padding:12px}.preview-paper{padding:22px 14px}.preview-toolbar{align-items:flex-start;flex-direction:column}}
    .personnel-list{display:grid;gap:16px;margin-top:20px}.personnel-card{background:#fff;border:1px solid #dfe6f0;border-radius:13px;padding:18px}.personnel-head{display:flex;align-items:center;gap:13px;margin-bottom:15px}.personnel-photo{width:54px;height:54px;border-radius:50%;object-fit:cover;background:#e8eef9;border:1px solid #d5deec}.personnel-avatar{display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:900}.personnel-head h2{font-size:18px;margin:0}.personnel-head p{margin:4px 0 0;color:#64718a;font-size:13px}.personnel-fields{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.personnel-fields .wide{grid-column:span 2}.former-title{margin:36px 0 10px;font-size:19px}.former-card{opacity:.72;background:#f7f8fb}.former-meta{font-size:13px;color:#64718a}.personnel-empty{padding:34px;border:1px dashed #cbd4e1;border-radius:12px;text-align:center;color:#64718a}@media(max-width:800px){.personnel-fields{grid-template-columns:1fr 1fr}}@media(max-width:520px){.personnel-fields{grid-template-columns:1fr}.personnel-fields .wide{grid-column:auto}}
    .personnel-site-title{margin:28px 0 2px;font-size:18px;color:#172852}.personnel-site-title small{margin-left:7px;color:#77849a;font-size:12px}.unassigned-card{border-left:4px solid #f29b38}.assignment-action{display:grid;grid-template-columns:1fr auto;gap:8px;margin-top:14px}.assignment-action select{margin-top:0}
    .attendance-site{margin:24px 0 8px;font-size:18px;color:#172852}.attendance-site small{margin-left:7px;color:#77849a;font-size:12px}.attendance-list{display:grid;gap:10px}.attendance-person{width:100%;border:1px solid #dfe6f0;background:#fff;border-radius:11px;padding:14px 16px;display:flex;align-items:center;justify-content:space-between;text-align:left;color:#172852;font:inherit;cursor:pointer}.attendance-person:hover{border-color:#8298cf;background:#f8faff}.attendance-person p{margin:4px 0 0;color:#64718a;font-size:13px}.attendance-state{display:inline-flex;align-items:center;gap:6px;border-radius:99px;padding:6px 9px;font-size:12px;font-weight:850}.attendance-state.open{background:#fff4e9;color:#b26718}.attendance-state.closed{background:#eaf8f0;color:#18704f}.attendance-calendar-panel{margin-top:20px}.attendance-toolbar{display:flex;align-items:end;justify-content:space-between;gap:12px;margin:16px 0}.attendance-total-table{width:100%;border-collapse:collapse;margin-top:18px;text-align:center}.attendance-total-table th,.attendance-total-table td{border:1px solid #cfd9ed;padding:12px}.attendance-total-table th{background:#eef3ff;color:#50617c;font-size:13px}.attendance-total-table td{background:#fff;color:#172852;font-size:27px;font-weight:900}.attendance-total-table caption{padding:0 0 8px;text-align:left;color:#172852;font-size:16px;font-weight:900}.attendance-total-note{margin:10px 0 0;color:#64718a;font-size:13px}.attendance-calendar{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-top:1px solid #dfe6f0;border-left:1px solid #dfe6f0}.attendance-weekday{padding:10px 6px;text-align:center;background:#f4f7fb;color:#63718a;font-size:12px;font-weight:850;border-right:1px solid #dfe6f0;border-bottom:1px solid #dfe6f0}.attendance-day{min-height:144px;padding:9px;border-right:1px solid #dfe6f0;border-bottom:1px solid #dfe6f0;background:#fff}.attendance-day.weekend{background:#fbfcfe}.attendance-day.empty-day{background:#f7f9fc}.attendance-date{font-weight:850;margin-bottom:8px}.attendance-day.weekend .attendance-date{color:#d65748}.attendance-hours{display:grid;gap:7px}.attendance-hours label{font-size:11px}.attendance-hours input{margin-top:3px;padding:7px}.attendance-closed-note{margin-top:14px;padding:12px 14px;background:#eaf8f0;color:#18704f;border-radius:8px;font-size:13px;font-weight:800}.attendance-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}@media(max-width:800px){.attendance-calendar{grid-template-columns:repeat(2,minmax(0,1fr))}.attendance-weekday{display:none}.attendance-day{min-height:0}.attendance-toolbar{align-items:stretch;flex-direction:column}}@media(max-width:520px){.attendance-calendar{grid-template-columns:1fr}.attendance-day{display:grid;grid-template-columns:48px 1fr;gap:10px}.attendance-hours{grid-template-columns:1fr 1fr}.attendance-total-table th,.attendance-total-table td{padding:10px 5px}.attendance-total-table td{font-size:21px}}

<body>
  <div class="login" id="loginBox">
    <form class="login-card" id="loginForm">
      <div class="eyebrow">ALL HANDS OPERATIONS</div>
      <h1>운영관리 로그인</h1>
      <p>기업회원 또는 관리자 계정으로 로그인해 현장 인력과 근태·급여 내역을 관리합니다.</p>
      <label>접속 구분<select id="role"><option value="company">기업회원</option><option value="admin">관리자</option></select></label>
      <label id="idLabel">기업 이메일 또는 사업자번호<input id="loginId" autocomplete="username" required></label>
      <label>비밀번호<input id="loginPassword" type="password" autocomplete="current-password" required></label>
      <button class="primary" type="submit">로그인</button>
      <div class="error" id="loginError"></div>
    </form>
  </div>
  <header class="top"><div class="brand">all hands <em>운영관리</em></div><div class="user" id="userText">기업·관리자 전용 · 올핸 JOB 연동</div></header>
  <div class="layout"><aside><p class="small">OPERATIONS</p><nav id="sideNav"><button class="active" data-view="dashboard">대시보드</button><button data-view="people">배치현황</button><button data-view="personnel">인력정보</button><button data-view="attendance">근태관리</button><button data-view="payroll">급여·정산</button><button data-view="contracts">견적·계약</button><div id="contractSubnav" class="contract-subnav" style="display:none"><button data-view="quote">견적서 작성</button><button data-view="contract">도급계약서 작성</button><button data-view="dispatch-contract">파견계약서 작성</button></div></nav></aside>
  <main id="app"><div class="loading">로그인 정보를 확인하고 있습니다.</div></main></div>
  <script>
    const $=s=>document.querySelector(s), won=n=>new Intl.NumberFormat('ko-KR').format(Math.round(Number(n)||0))+'원';
    let data=[],selected=0,role='',view='dashboard';const seals={quote:'',contract:'',dispatch:''};
    const parse=v=>{try{return typeof v==='string'?JSON.parse(v):v||{}}catch{return {}}};
    function personName(p){const d=parse(p.worker_data);return d.name||d.applicantName||d.userName||d.fullName||'지원자'}
    function personDetail(p){const d=parse(p.worker_data);return [d.region||d.preferredRegion||'',d.job||d.desiredJob||p.job_title||''].filter(Boolean).join(' · ')||'배정 정보 확인 필요'}
    function operation(p){return parse(parse(p.employer_note).operation)}
    function status(p){const op=operation(p);return op.attendance||p.status||'근태 미확인'}
    function isGood(s){return /정상|출근|합격|interview|hired/i.test(s)}
    function render(){const p=data[selected],op=p?operation(p):{};const gross=(Number(op.dailyRate)||0)*(Number(op.workDays)||0),tax=Math.round(gross*.033),net=gross-tax;$('#app').innerHTML=`
      <div class="heading"><div><div class="eyebrow">SITE OPERATIONS</div><h1>오늘의 현장 운영</h1><p>${role==='admin'?'전체 기업의 ':'내 기업의 '}현장 인력, 근태와 급여를 관리합니다.</p></div><button class="secondary" onclick="loadData()">새로고침</button></div>
      <section class="stats"><article class="stat"><span>연결 공고</span><b>${window.jobsCount||0}</b><small>진행 공고 기준</small></article><article class="stat"><span>투입 인원</span><b>${data.length}명</b><small>지원자·근로자 기준</small></article><article class="stat alert"><span>근태 미확인</span><b>${data.filter(x=>!/정상|출근/.test(status(x))).length}건</b><small>확인 필요</small></article><article class="stat"><span>예상 지급액</span><b>${won(data.reduce((a,x)=>{const o=operation(x);return a+(+o.netPay||(+o.dailyRate||0)*(+o.workDays||0)*.967)},0))}</b><small>입력된 근태 기준</small></article></section>
      <section class="grid"><article class="panel"><h2>현장 인력 현황</h2><p class="muted">인력을 선택하면 근태와 급여 내역을 입력할 수 있습니다.</p><div class="workers">${data.length?data.map((x,i)=>`<button class="worker ${i===selected?'selected':''}" onclick="choose(${i})"><div><b>${personName(x)}</b><p>${personDetail(x)}</p></div><span class="${isGood(status(x))?'ok':'warn'}">${status(x)}</span></button>`).join(''):`<div class="empty">연결된 지원자·근로자 정보가 없습니다.<br>올핸 JOB에서 공고 지원자가 생기면 이곳에 표시됩니다.</div>`}</div></article>
      <article class="panel"><h2>근태·급여 입력</h2>${p?`<p class="muted">선택 인력: <b>${personName(p)}</b></p><div class="fields"><label>근태 상태<select id="attendance"><option ${status(p)==='정상 출근'?'selected':''}>정상 출근</option><option ${status(p)==='결근'?'selected':''}>결근</option><option ${status(p)==='지각'?'selected':''}>지각</option><option ${status(p)==='휴무'?'selected':''}>휴무</option></select></label><label>급여 지급일<input id="payDate" type="date" value="${op.payDate||''}"></label><label>일 단가<input id="rate" type="number" value="${op.dailyRate||''}" oninput="calculate()"></label><label>근무일수<input id="days" type="number" value="${op.workDays||''}" oninput="calculate()"></label></div><div class="calc"><div class="row"><span>지급 전 금액</span><b id="gross">${won(gross)}</b></div><div class="row"><span>예상 공제</span><b id="tax">${won(tax)}</b></div><div class="row total"><span>실지급 예정액</span><b id="net">${won(net)}</b></div></div><button class="primary" style="margin-top:14px;width:100%" onclick="saveOperation()">근태·급여 내역 저장</button><p class="muted" style="font-size:12px">자동 계산은 검토용입니다. 최종 급여와 공제는 노무·세무 검토 후 확정하세요.</p>`:`<div class="empty">왼쪽에서 인력을 선택해 주세요.</div>`}</article></section>`;applyView()}
    const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

    window.renderAttendanceDetail=()=>{const person=data.find(item=>String(item.id)===String(window.attendancePersonId));if(!person)return window.renderAttendanceBoard();const main=$('#app'),heading=main.querySelector('.heading'),month=attendanceMonthKey(),[year,monthNumber]=month.split('-').map(Number),lastDay=new Date(year,monthNumber,0).getDate(),firstDay=new Date(year,monthNumber-1,1).getDay(),calendar=attendanceCalendar(person),monthData=calendar.months?.[month]||{},days=monthData.days||{},closed=Boolean(calendar.closedMonths?.[month]),week=['일','월','화','수','목','금','토'];heading.querySelector('h1').textContent='근태관리';heading.querySelector('p').textContent=`${personnelWorksite(person)} · ${personName(person)}님의 ${monthName(month)} 근태`;Array.from(main.children).forEach(section=>{if(section!==heading)section.remove()});let cells=Array.from({length:firstDay},()=>'<div class="attendance-day empty-day"></div>');for(let day=1;day<=lastDay;day++){const weekday=new Date(year,monthNumber-1,day).getDay(),record=days[day]||{},basic=record.basic!==undefined?record.basic:8,overtime=record.overtime!==undefined?record.overtime:0,disabled=closed?'disabled':'';cells.push(`<div class="attendance-day ${weekday===0||weekday===6?'weekend':''}"><div class="attendance-date">${day}<small> (${week[weekday]})</small></div><div class="attendance-hours"><label>정상 시간<input type="number" min="0" max="24" step="0.5" data-day="${day}" data-kind="basic" value="${esc(basic)}" ${disabled}></label><label>연장 시간<input type="number" min="0" max="24" step="0.5" data-day="${day}" data-kind="overtime" value="${esc(overtime)}" ${disabled}></label></div></div>`)}main.insertAdjacentHTML('beforeend',`<section class="panel attendance-calendar-panel"><div class="attendance-toolbar"><div><button class="secondary" onclick="renderAttendanceBoard()">목록으로</button><h2 style="margin-top:14px">${esc(personName(person))} · ${monthName(month)}</h2><p class="muted">평일과 주말 모두 정상시간 8시간으로 시작하며, 근무하지 않는 날은 0시간으로 변경할 수 있습니다.</p></div><label>대상 월<input type="month" value="${month}" onchange="attendanceMonth=this.value;renderAttendanceDetail()"></label></div><div class="attendance-calendar">${week.map(day=>`<div class="attendance-weekday">${day}</div>`).join('')}${cells.join('')}</div><table class="attendance-total-table"><caption>근태 합계</caption><thead><tr><th>근무일수</th><th>정상시간</th><th>연장시간</th></tr></thead><tbody><tr><td id="workDayTotal">0일</td><td id="basicTotal">0시간</td><td id="overtimeTotal">0시간</td></tr></tbody></table><p class="attendance-total-note">${closed?'이 달은 마감되었습니다.':'마감 전에는 언제든 수정할 수 있습니다.'}</p>${closed?'<div class="attendance-closed-note">마감 완료 · 수정이 잠겨 있습니다.</div>':`<div class="attendance-actions"><button class="secondary" onclick="saveAttendance(false)">저장</button><button class="primary" onclick="saveAttendance(true)">마감</button></div>`}</section>`);main.querySelectorAll('.attendance-hours input').forEach(input=>input.addEventListener('input',window.updateAttendanceTotals));window.updateAttendanceTotals()};
    window.updateAttendanceTotals=()=>{const inputs=Array.from(document.querySelectorAll('[data-kind="basic"]')),basic=inputs.reduce((sum,input)=>sum+(Number(input.value)||0),0),overtime=Array.from(document.querySelectorAll('[data-kind="overtime"]')).reduce((sum,input)=>sum+(Number(input.value)||0),0),workDays=inputs.filter(input=>(Number(input.value)||0)>0).length;const day=$('#workDayTotal'),normal=$('#basicTotal'),extended=$('#overtimeTotal');if(day)day.textContent=workDays+'일';if(normal)normal.textContent=basic+'시간';if(extended)extended.textContent=overtime+'시간'};
    window.saveAttendance=async close=>{try{const person=data.find(item=>String(item.id)===String(window.attendancePersonId));if(!person)throw new Error('인력 정보를 찾지 못했습니다.');if(close&&!confirm(`${monthName(attendanceMonthKey())} 근태를 마감할까요? 마감 후에는 수정할 수 없습니다.`))return;const month=attendanceMonthKey(),calendar=attendanceCalendar(person),months={...(calendar.months||{})},days={};document.querySelectorAll('.attendance-hours input').forEach(input=>{const day=input.dataset.day;days[day]=days[day]||{};days[day][input.dataset.kind]=Math.max(0,Number(input.value)||0)});months[month]={days};const closedMonths={...(calendar.closedMonths||{})};if(close)closedMonths[month]=new Date().toISOString();const op=operation(person),payload={applicationId:person.id,attendance:op.attendance||'',dailyRate:op.dailyRate||'',workDays:op.workDays||'',workHours:op.workHours||'',payDate:op.payDate||'',grossPay:op.grossPay||'',netPay:op.netPay||'',assignmentDate:op.assignmentDate||'',resignationDate:op.resignationDate||'',bankName:op.bankName||'',accountNumber:op.accountNumber||'',accountHolder:op.accountHolder||'',assignedJobId:op.assignedJobId||'',attendanceCalendar:{months,closedMonths}};const res=await fetch('/api/operations',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)}),out=await res.json();if(!res.ok)throw new Error(out.error||'근태를 저장하지 못했습니다.');alert(close?'근태를 마감했습니다.':'근태를 저장했습니다.');await loadData();window.openAttendance(person.id)}catch(error){alert(error.message)}};
    const operationsSetView=window.setView;window.setView=next=>{if(next==='personnel'){operationsSetView('dashboard');window.renderPersonnelInfo();return}if(next==='attendance'){operationsSetView('dashboard');window.renderAttendanceBoard();return}operationsSetView(next);if(next==='people')window.renderAssignmentBoard()};
    window.loadData=async()=>{const res=await fetch('/api/operations'),out=await res.json();if(!res.ok){$('#loginBox').classList.remove('hidden');$('#loginError').textContent=out.error||'다시 로그인해 주세요.';return}data=out.people||[];window.operationJobs=out.jobs||[];window.assignmentTO={};(out.documents||[]).filter(d=>d.document_type==='assignment-to').forEach(d=>{const item=parse(d.data),id=item.jobId;if(id&&window.assignmentTO[id]===undefined)window.assignmentTO[id]=item.to});window.jobsCount=window.operationJobs.length;role=out.role||'';const companyName=String(out.companyName||'기업').trim();$('#userText').textContent=role==='admin'?'안녕하세요. 관리자님':'안녕하세요. '+companyName+'님';$('#loginBox').classList.add('hidden');selected=0;render()};
    $('#role').onchange=e=>$('#idLabel').firstChild.textContent=e.target.value==='admin'?'관리자 이메일':'기업 이메일 또는 사업자번호';
    $('#loginForm').onsubmit=async e=>{e.preventDefault();$('#loginError').textContent='로그인 중입니다.';const res=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({role:$('#role').value,id:$('#loginId').value,password:$('#loginPassword').value})}),out=await res.json();if(!res.ok){$('#loginError').textContent=out.error||'로그인하지 못했습니다.';return}$('#loginError').textContent='';loadData()};
    $('#sideNav').onclick=e=>{const button=e.target.closest('[data-view]');if(button)window.setView(button.dataset.view)};
    loadData();
  </script>
