<body>
  <div class="login" id="loginBox">
    <form class="login-card" id="loginForm">
      <div class="eyebrow">ALL HANDS OPERATIONS</div>
      <h1>운영관리 로그인</h1>
      <p>기업회원 또는 관리자 계정으로 로그인해 현장 인력과 근태·급여 내역을 관리합니다.</p>
      <label>접속 구분<select id="role"><option value="company">기업회원</option><option value="admin">관리자</option></select></label>
      <label id="idLabel">기업 이메일 또는 사업자번호<input id="loginId" autocomplete="username" required></label>
      <label>비밀번호<input id="loginPassword" type="password" autocomplete="current-password" required></label>
      <button class="primary" type="submit">로그인</button>
      <div class="error" id="loginError"></div>
    </form>
  </div>

  <script>
    const $=s=>document.querySelector(s), won=n=>new Intl.NumberFormat('ko-KR').format(Math.round(Number(n)||0))+'원';
    let data=[],selected=0,role='',view='dashboard';const seals={quote:'',contract:'',dispatch:'',invoice:''};
    const parse=v=>{try{return typeof v==='string'?JSON.parse(v):v||{}}catch{return {}}};
    function personName(p){const d=parse(p.worker_data);return d.name||d.applicantName||d.userName||d.fullName||'지원자'}
    function personDetail(p){const d=parse(p.worker_data);return [d.region||d.preferredRegion||'',d.job||d.desiredJob||p.job_title||''].filter(Boolean).join(' · ')||'배정 정보 확인 필요'}
    function operation(p){return parse(parse(p.employer_note).operation)}
    function workerAttendance(p){const rows=parse(p.employer_note).workerAttendance;return Array.isArray(rows)?rows.slice().sort((a,b)=>String(b?.workDate||'').localeCompare(String(a?.workDate||''))):[]}
    function latestWorkerAttendance(p){return workerAttendance(p)[0]||null}
    function workerAttendanceText(p){const row=latestWorkerAttendance(p);return row?`${row.workDate} · 본인 ${row.attendance}${row.memo?` (${row.memo})`:''}`:'본인 등록 없음'}
    function status(p){const op=operation(p),self=latestWorkerAttendance(p);return op.attendance||(self?`본인 ${self.attendance}`:p.status||'근태 미확인')}
    function isGood(s){return /정상|출근|합격|interview|hired/i.test(s)}
    function render(){const p=data[selected],op=p?operation(p):{};const gross=(Number(op.dailyRate)||0)*(Number(op.workDays)||0),tax=Math.round(gross*.033),net=gross-tax;$('#app').innerHTML=`
      <div class="heading"><div><div class="eyebrow">SITE OPERATIONS</div><h1>오늘의 현장 운영</h1><p>${role==='admin'?'전체 기업의 ':'내 기업의 '}현장 인력, 근태와 급여를 관리합니다.</p></div><button class="secondary" onclick="loadData()">새로고침</button></div>
      <section class="stats"><article class="stat"><span>연결 공고</span><b>${window.jobsCount||0}</b><small>진행 공고 기준</small></article><article class="stat"><span>투입 인원</span><b>${data.length}명</b><small>지원자·근로자 기준</small></article><article class="stat alert"><span>근태 미확인</span><b>${data.filter(x=>!/정상|출근/.test(status(x))).length}건</b><small>확인 필요</small></article><article class="stat"><span>구직자 직접 등록</span><b>${data.filter(x=>latestWorkerAttendance(x)).length}건</b><small>최신 근태 기준</small></article></section>
      <section class="grid"><article class="panel"><h2>현장 인력 현황</h2><p class="muted">구직자가 직접 입력한 출근 여부를 함께 확인하고, 필요 시 운영 근태로 확정하세요.</p><div class="workers">${data.length?data.map((x,i)=>`<button class="worker ${i===selected?'selected':''}" onclick="choose(${i})"><div><b>${personName(x)}</b><p>${personDetail(x)}<br>구직자 직접 등록: ${workerAttendanceText(x)}</p></div><span class="${isGood(status(x))?'ok':'warn'}">${status(x)}</span></button>`).join(''):`<div class="empty">연결된 지원자·근로자 정보가 없습니다.<br>올핸 JOB에서 공고 지원자가 생기면 이곳에 표시됩니다.</div>`}</div></article>
      <article class="panel"><h2>근태·급여 입력</h2>${p?`<p class="muted">선택 인력: <b>${personName(p)}</b></p><div class="calc"><div class="row"><span>구직자 직접 등록</span><b>${workerAttendanceText(p)}</b></div><p class="muted" style="font-size:12px;margin:8px 0 0">구직자 입력값은 현장 확인 전 참고용입니다. 확인 후 아래 운영 근태로 확정해 주세요.</p></div><div class="fields"><label>근태 상태<select id="attendance"><option ${operation(p).attendance==='정상 출근'?'selected':''}>정상 출근</option><option ${operation(p).attendance==='결근'?'selected':''}>결근</option><option ${operation(p).attendance==='지각'?'selected':''}>지각</option><option ${operation(p).attendance==='휴무'?'selected':''}>휴무</option></select></label><label>급여 지급일<input id="payDate" type="date" value="${op.payDate||''}"></label><label>일 단가<input id="rate" type="number" value="${op.dailyRate||''}" oninput="calculate()"></label><label>근무일수<input id="days" type="number" value="${op.workDays||''}" oninput="calculate()"></label></div><div class="calc"><div class="row"><span>지급 전 금액</span><b id="gross">${won(gross)}</b></div><div class="row"><span>예상 공제</span><b id="tax">${won(tax)}</b></div><div class="row total"><span>실지급 예정액</span><b id="net">${won(net)}</b></div></div><button class="primary" style="margin-top:14px;width:100%" onclick="saveOperation()">근태·급여 내역 저장</button><p class="muted" style="font-size:12px">자동 계산은 검토용입니다. 최종 급여와 공제는 노무·세무 검토 후 확정하세요.</p>`:`<div class="empty">왼쪽에서 인력을 선택해 주세요.</div>`}</article></section>`;applyView()}
    const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    function applyView(){document.querySelectorAll('#sideNav [data-view]').forEach(button=>button.classList.toggle('active',button.dataset.view===view));if(view==='dashboard')return;const main=$('#app'),titles={people:['현장·인력','현장별 인력 배정과 지원자 현황을 확인합니다.'],attendance:['근태 관리','근태 상태를 확인하고 대상 인력을 선택해 수정합니다.'],payroll:['급여·정산','입력된 근태 기준의 급여·정산 내역입니다.'],contracts:['계약관리','도급단가 견적서와 계약 진행 현황을 관리합니다.']}[view];main.querySelector('.heading h1').textContent=titles[0];main.querySelector('.heading p').textContent=titles[1];main.querySelector('.stats').style.display='none';main.querySelector('.grid').style.display='none';let content='';if(view==='people')content=data.length?data.map((p,i)=>`<button class="worker" onclick="choose(${i})"><div><b>${esc(personName(p))}</b><p>${esc(personDetail(p))}</p></div><span class="${isGood(status(p))?'ok':'warn'}">${esc(status(p))}</span></button>`).join(''):'<div class="empty">연결된 인력이 없습니다.</div>';if(view==='attendance')content=data.length?data.map((p,i)=>`<button class="worker" onclick="setView('dashboard');choose(${i})"><div><b>${esc(personName(p))}</b><p>${esc(personDetail(p))}</p></div><span class="${isGood(status(p))?'ok':'warn'}">${esc(status(p))} · 수정하기</span></button>`).join(''):'<div class="empty">근태를 등록할 인력이 없습니다.</div>';if(view==='payroll')content=data.length?data.map(p=>{const o=operation(p),amount=+o.netPay||(+o.dailyRate||0)*(+o.workDays||0)*.967;return `<div class="worker" style="cursor:default"><div><b>${esc(personName(p))}</b><p>${esc(o.payDate||'지급일 미정')} · ${esc(o.workDays||'0')}일 근무</p></div><b>${won(amount)}</b></div>`}).join(''):'<div class="empty">정산 내역이 없습니다.</div>';if(view==='contracts')content=`<div class="quote-head"><label>견적서명<input id="quoteTitle" value="견적서"></label><label>거래처·현장<input id="quoteClient" placeholder="거래처 또는 현장명"></label><label>Agency fee<input id="quoteFeeRate" type="number" value="6" min="0" step=".1" oninput="quoteCalculator()">%</label></div><div style="overflow:auto"><table class="quote-table"><thead><tr><th>구분</th><th>산정 항목</th><th>적용 요율</th><th>직무</th><th>인원</th><th>금액</th></tr></thead><tbody><tr class="group"><td rowspan="10">직접비</td><td colspan="5">1. 급여</td></tr><tr><td>기본급</td><td>-</td><td><input id="qJob" value="생산직"></td><td><input id="qPeople" type="number" value="1" min="1" oninput="quoteCalculator()"></td><td><input id="qBase" type="number" value="0" oninput="quoteCalculator()"></td></tr><tr><td>업무수당</td><td>-</td><td colspan="2"></td><td><input id="qDuty" type="number" value="0" oninput="quoteCalculator()"></td></tr><tr><td>시간외근로수당</td><td>-</td><td colspan="2"></td><td><input id="qOvertime" type="number" value="0" oninput="quoteCalculator()"></td></tr><tr><td>휴일근무수당</td><td>-</td><td colspan="2"></td><td><input id="qHoliday" type="number" value="0" oninput="quoteCalculator()"></td></tr><tr><td>식대(보조)</td><td>비과세</td><td colspan="2"></td><td><input id="qMeal" type="number" value="0" oninput="quoteCalculator()"></td></tr><tr><td>차량유지비</td><td>비과세</td><td colspan="2"></td><td><input id="qVehicle" type="number" value="0" oninput="quoteCalculator()"></td></tr><tr class="subtotal"><td>(1) 월통상급여</td><td></td><td colspan="2"></td><td id="qOrdinary">0원</td></tr><tr class="subtotal"><td>(3) 과세급여</td><td></td><td colspan="2"></td><td id="qTaxable">0원</td></tr><tr class="group"><td colspan="5">2. 법적부담금</td></tr><tr><td rowspan="8">법적부담금</td><td>국민연금료</td><td>4.50%</td><td colspan="2"></td><td id="qPension">0원</td></tr><tr><td>건강보험료</td><td>3.495%</td><td colspan="2"></td><td id="qHealth">0원</td></tr><tr><td>노인장기요양보험</td><td>건강보험의 12.27%</td><td colspan="2"></td><td id="qCare">0원</td></tr><tr><td>고용보험료</td><td>1.35%</td><td colspan="2"></td><td id="qEmployment">0원</td></tr><tr><td>산재보험료</td><td>1.463%</td><td colspan="2"></td><td id="qAccident">0원</td></tr><tr><td>장애인고용부담금</td><td>3.30%</td><td colspan="2"></td><td id="qDisability">0원</td></tr><tr><td>사업소세</td><td>0.50%</td><td colspan="2"></td><td id="qLocal">0원</td></tr><tr class="subtotal"><td>(4) 법적부담금 소계</td><td></td><td colspan="2"></td><td id="qLegal">0원</td></tr><tr><td rowspan="2">기타경비</td><td>잡비 등</td><td>-</td><td colspan="2"></td><td><input id="qOther" type="number" value="50000" oninput="quoteCalculator()"></td></tr><tr class="subtotal"><td>(5) 기타경비 소계</td><td></td><td colspan="2"></td><td id="qOtherTotal">0원</td></tr><tr class="total"><td colspan="5">직접비 지급 총액</td><td id="qDirect">0원</td></tr><tr><td>간접비</td><td>Agency fee</td><td id="qFeeLabel">6.0%</td><td colspan="2"></td><td id="qFee">0원</td></tr><tr class="total"><td colspan="5">계약단가 총액</td><td id="qContract">0원</td></tr><tr class="grand"><td colspan="5">총액 (인원 반영)</td><td id="qGrand">0원</td></tr></tbody></table></div><div class="quote-note"><b>견적조건</b><br>관리자 기준 주 40시간제이며, 추가 연장·야간근로는 별도 산정합니다. 부가가치세는 별도입니다. 퇴직금은 발생 시 별도 청구 조건으로 검토합니다.</div><button class="primary" style="margin-top:16px" onclick="window.print()">견적서 인쇄하기</button>`;main.insertAdjacentHTML('beforeend',`<section class="panel quote-panel" style="margin-top:20px"><h2 class="${view==='contracts'?'quote-document-title':''}">${view==='contracts'?'견적서':titles[0]}</h2>${content}</section>`);if(view==='contracts')quoteCalculator()}
    window.showContractDraft=()=>{let draft=document.getElementById('contractDraft');if(!draft){draft=document.createElement('section');draft.id='contractDraft';draft.className='panel contract-draft';draft.style.marginTop='20px';draft.innerHTML='<div class="contract-title">도급계약서</div><p class="contract-intro">아래 계약 당사자는 도급 업무에 관한 계약을 체결하고 성실히 이행합니다.</p><div class="contract-grid"><label>계약명<input placeholder="도급 업무명"></label><label>계약기간<input placeholder="YYYY.MM.DD ~ YYYY.MM.DD"></label><label>계약금액<input placeholder="견적서 계약단가 기준"></label><label>대금 지급조건<input placeholder="예: 월별 정산 후 익월 지급"></label><label>납기 및 검수<input placeholder="업무수행계획서 및 정산 기준에 따름"></label><label>계약이행보증금<input placeholder="해당 시 입력"></label></div><h3>계약 당사자</h3><div class="contract-grid"><label>도급인(갑) 상호<input placeholder="회사명"></label><label>도급인 대표자<input placeholder="대표자 성명"></label><label>도급인 주소<input placeholder="주소"></label><label>수급인(을) 상호<input placeholder="회사명"></label><label>수급인 대표자<input placeholder="대표자 성명"></label><label>수급인 주소<input placeholder="주소"></label></div><h3>첨부 1. 과업 수행계획서</h3><div class="contract-grid"><label>과업명<input placeholder="과업명"></label><label>주관부서·책임자<input placeholder="부서 / 성명"></label><label>참여인원<input placeholder="인원"></label><label class="wide">과업의 목적<textarea placeholder="과업 목적을 입력하세요."></textarea></label><label class="wide">과업의 범위<textarea placeholder="업무 범위와 수행 기준을 입력하세요."></textarea></label><label class="wide">세부 과업 수행내용<textarea placeholder="계획의 개요, 수행내용, 예정공정표를 입력하세요."></textarea></label><label>소요예산<input placeholder="견적서 총액 기준"></label><label>성과물 제출조건<input placeholder="제출물 및 검수 기준"></label></div><div class="quote-note"><b>계약 특약사항</b><br>추가 연장·야간근로, 현장 조건 변경, 부가가치세, 퇴직금 및 정산 기준은 계약 체결 전 별도 검토·확정합니다. 특정 업체명과 대표자 정보는 모두 빈칸으로 유지됩니다.</div><button class="primary" style="margin-top:16px" onclick="window.print()">도급계약서 인쇄하기</button>';document.getElementById('app').append(draft)}draft.style.display=draft.style.display==='none'?'block':'none';draft.scrollIntoView({behavior:'smooth',block:'start'})};

<script>

      document.getElementById('aiMessageButton').onclick = async () => {

        button.disabled = true; button.textContent = '작성 중…';

          const output = await response.json().catch(() => ({}));

<script>
(() => {
  const approvalStyle = document.createElement('style');
  approvalStyle.textContent = '.external-approval{margin-top:16px;padding:16px;border:1px solid #dbe4f1;border-radius:12px;background:#f8faff}.external-approval h3{margin:0 0 6px}.approval-fields{display:grid;grid-template-columns:1fr 1.25fr;gap:10px;margin-top:12px}.approval-fields label{font-size:13px;font-weight:800}.approval-fields input{display:block;width:100%;box-sizing:border-box;margin-top:5px}.approval-record{margin-top:12px;padding-top:12px;border-top:1px solid #dfe6f0;font-size:13px;color:#53627d}.approval-record b{color:#172852}.approval-link{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.approval-link input{flex:1;min-width:220px}@media(max-width:650px){.approval-fields{grid-template-columns:1fr}}';
  document.head.append(approvalStyle);

  const baseLoadForExternalApproval = window.loadData;
  window.loadData = async () => {
    await baseLoadForExternalApproval();
    try {
      const response = await fetch('/api/operations');
      const output = await response.json();
      if (response.ok) {
        window.externalApprovals = output.externalApprovals || [];
        window.invoiceDocuments = (output.documents || []).filter(item => item.document_type === 'invoice').map(item => ({ ...(item.data || {}), documentId: item.id }));
      }
    } catch { window.externalApprovals = window.externalApprovals || []; }
  };

  const previousRenderInvoiceDraft = window.renderInvoiceDraft;
  window.renderInvoiceDraft = () => {
    previousRenderInvoiceDraft();
    const draft = document.getElementById('invoiceDraft');
    const actions = draft?.querySelector('.invoice-actions');
    if (!draft || !actions || document.getElementById('externalApprovalPanel')) return;
    const saved = (window.invoiceDocuments || []).find(item => item && item.invoiceMonth === document.getElementById('invoiceMonth')?.value && item.invoiceClient === document.getElementById('invoiceClient')?.value);
    const records = (window.externalApprovals || []).filter(item => String(item.document_id) === String(saved?.documentId));
    const statusText = { pending: '검토 대기', opened: '열람 완료', approved: '승인 완료', rejected: '반려', 'revision-requested': '수정 요청' };
    const panel = document.createElement('section');
    panel.id = 'externalApprovalPanel'; panel.className = 'external-approval';
    panel.innerHTML = `<h3>거래처 검토 요청</h3><p class="muted">저장한 청구서를 고객사에 이메일로 보내고, 로그인 없는 검토 링크에서 승인·반려·수정 요청 이력을 관리합니다.</p><div class="approval-fields"><label>검토 담당자 성함<input id="externalApprovalRecipient" placeholder="예: 홍길동"></label><label>검토 담당자 이메일<input id="externalApprovalEmail" type="email" placeholder="example@company.com"></label></div><div class="approval-link"><button class="secondary" onclick="openRecipientInvoicePreview()">고객사 미리보기</button><button class="primary" onclick="createInvoiceApprovalLink()">고객사 메일 보내기</button></div><div id="externalApprovalResult"></div>${records.map(item => `<div class="approval-record"><b>${statusText[item.status] || item.status}</b> · ${item.recipient_name} (${item.recipient_email}) · ${String(item.created_at || '').slice(0,10)}${item.responded_at ? ' · 회신 '+String(item.responded_at).slice(0,10) : ''}</div>`).join('')}`;
    actions.parentElement.insertBefore(panel, actions);
  };

  window.createInvoiceApprovalLink = async () => {
    try {
      const saved = (window.invoiceDocuments || []).find(item => item && item.invoiceMonth === document.getElementById('invoiceMonth')?.value && item.invoiceClient === document.getElementById('invoiceClient')?.value);
      const recipientName = document.getElementById('externalApprovalRecipient')?.value.trim() || '';
      const recipientEmail = document.getElementById('externalApprovalEmail')?.value.trim() || '';
      if (!saved?.documentId) throw new Error('먼저 청구서를 저장해 주세요.');
      if (!recipientName || !recipientEmail) throw new Error('검토 담당자 성함과 이메일을 입력해 주세요.');
      const response = await fetch('/api/operations', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({ action:'external-approval-create', documentId:saved.documentId, recipientName, recipientEmail }) });
      const output = await response.json();
      if (!response.ok) throw new Error(output.error || '검토 링크를 만들지 못했습니다.');
      const subject = `[올핸즈] ${document.getElementById('invoiceMonth')?.value || ''} 청구서 검토 요청`;
      const body = `${recipientName} 담당자님,\n\n청구서 검토를 부탁드립니다. 아래 링크에서 로그인 없이 승인, 반려 또는 수정 요청을 남길 수 있습니다.\n\n${output.approvalUrl}\n\n링크 유효기간: ${String(output.expiresAt || '').slice(0,10)}까지\n\n감사합니다.`;
      const result = document.getElementById('externalApprovalResult');
      result.innerHTML = '<p class="muted">고객사 메일 작성창을 열었습니다. 수신자와 내용을 확인한 뒤 발송해 주세요.</p>';
      location.href = `mailto:${encodeURIComponent(recipientEmail)}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
      const listResponse = await fetch('/api/operations'); const list = await listResponse.json(); if (listResponse.ok) window.externalApprovals = list.externalApprovals || [];
    } catch (error) { alert(error.message); }
  };

  const previousSaveInvoice = window.saveInvoice;
  window.saveInvoice = async () => { await previousSaveInvoice(); await window.loadData(); window.renderInvoiceDraft(); };
})();
</script>
