    .attendance-site{margin:24px 0 8px;font-size:18px;color:#172852}.attendance-site small{margin-left:7px;color:#77849a;font-size:12px}.attendance-list{display:grid;gap:10px}.attendance-person{width:100%;border:1px solid #dfe6f0;background:#fff;border-radius:11px;padding:14px 16px;display:flex;align-items:center;justify-content:space-between;text-align:left;color:#172852;font:inherit;cursor:pointer}.attendance-person:hover{border-color:#8298cf;background:#f8faff}.attendance-person p{margin:4px 0 0;color:#64718a;font-size:13px}.attendance-state{display:inline-flex;align-items:center;gap:6px;border-radius:99px;padding:6px 9px;font-size:12px;font-weight:850}.attendance-state.open{background:#fff4e9;color:#b26718}.attendance-state.closed{background:#eaf8f0;color:#18704f}.attendance-calendar-panel{margin-top:20px}.attendance-toolbar{display:flex;align-items:end;justify-content:space-between;gap:12px;margin:16px 0}.attendance-total-table{width:100%;border-collapse:collapse;margin-top:18px;text-align:center}.attendance-total-table th,.attendance-total-table td{border:1px solid #cfd9ed;padding:12px}.attendance-total-table th{background:#eef3ff;color:#50617c;font-size:13px}.attendance-total-table td{background:#fff;color:#172852;font-size:20px;font-weight:850}.attendance-total-table caption{padding:0 0 8px;text-align:left;color:#172852;font-size:16px;font-weight:900}.attendance-total-note{margin:10px 0 0;color:#64718a;font-size:13px}.attendance-calendar{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-top:1px solid #dfe6f0;border-left:1px solid #dfe6f0}.attendance-weekday{padding:10px 6px;text-align:center;background:#f4f7fb;color:#63718a;font-size:12px;font-weight:850;border-right:1px solid #dfe6f0;border-bottom:1px solid #dfe6f0}.attendance-day{min-height:168px;padding:9px;border-right:1px solid #dfe6f0;border-bottom:1px solid #dfe6f0;background:#fff}.attendance-day.weekend{background:#fbfcfe}.attendance-day.empty-day{background:#f7f9fc}.attendance-date{font-weight:850;margin-bottom:8px}.attendance-day.weekend .attendance-date{color:#d65748}.attendance-hours{display:grid;gap:7px}.attendance-hours label{font-size:11px}.attendance-hours input{margin-top:3px;padding:7px}.attendance-closed-note{margin-top:14px;padding:12px 14px;background:#eaf8f0;color:#18704f;border-radius:8px;font-size:13px;font-weight:800}.attendance-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}@media(max-width:800px){.attendance-calendar{grid-template-columns:repeat(2,minmax(0,1fr))}.attendance-weekday{display:none}.attendance-day{min-height:0}.attendance-toolbar{align-items:stretch;flex-direction:column}}@media(max-width:520px){.attendance-calendar{grid-template-columns:1fr}.attendance-day{display:grid;grid-template-columns:48px 1fr;gap:10px}.attendance-hours{grid-template-columns:1fr 1fr}.attendance-total-table th,.attendance-total-table td{padding:10px 5px}.attendance-total-table td{font-size:17px}}

<body>
  <div class="login" id="loginBox">
    <form class="login-card" id="loginForm">
      <div class="eyebrow">ALL HANDS OPERATIONS</div>
      <h1>운영관리 로그인</h1>
      <p>기업회원 또는 관리자 계정으로 로그인해 현장 인력과 근태·급여 내역을 관리합니다.</p>
      <label>접속 구분<select id="role"><option value="company">기업회원</option><option value="admin">관리자</option></select></label>
      <label id="idLabel">기업 이메일 또는 사업자번호<input id="loginId" autocomplete="username" required></label>
      <label>비밀번호<input id="loginPassword" type="password" autocomplete="current-password" required></label>
      <button class="primary" type="submit">로그인</button>
      <div class="error" id="loginError"></div>
    </form>
  </div>
  <header class="top"><div class="brand">all hands <em>운영관리</em></div><div class="user" id="userText">기업·관리자 전용 · 올핸 JOB 연동</div></header>
  <div class="layout"><aside><p class="small">OPERATIONS</p><nav id="sideNav"><button class="active" data-view="dashboard">대시보드</button><button data-view="people">배치현황</button><button data-view="clients">거래처 관리</button><button data-view="personnel">인력정보</button><button data-view="attendance">근태관리</button><button data-view="payroll">급여·정산</button><div id="payrollSubnav" class="payroll-subnav" style="display:none"><button data-view="invoice">청구서 작성</button></div><button data-view="contracts">견적·계약</button><div id="contractSubnav" class="contract-subnav" style="display:none"><button data-view="quote">견적서 작성</button><button data-view="contract">도급계약서 작성</button><button data-view="dispatch-contract">파견계약서 작성</button></div></nav></aside>
  <main id="app"><div class="loading">로그인 정보를 확인하고 있습니다.</div></main></div>
  <script>
    const $=s=>document.querySelector(s), won=n=>new Intl.NumberFormat('ko-KR').format(Math.round(Number(n)||0))+'원';
    let data=[],selected=0,role='',view='dashboard';const seals={quote:'',contract:'',dispatch:'',invoice:''};
    const parse=v=>{try{return typeof v==='string'?JSON.parse(v):v||{}}catch{return {}}};
    function personName(p){const d=parse(p.worker_data);return d.name||d.applicantName||d.userName||d.fullName||'지원자'}
    function personDetail(p){const d=parse(p.worker_data);return [d.region||d.preferredRegion||'',d.job||d.desiredJob||p.job_title||''].filter(Boolean).join(' · ')||'배정 정보 확인 필요'}
    function operation(p){return parse(parse(p.employer_note).operation)}
    function status(p){const op=operation(p);return op.attendance||p.status||'근태 미확인'}
    function isGood(s){return /정상|출근|합격|interview|hired/i.test(s)}
    function render(){const p=data[selected],op=p?operation(p):{};const gross=(Number(op.dailyRate)||0)*(Number(op.workDays)||0),tax=Math.round(gross*.033),net=gross-tax;$('#app').innerHTML=`
      <div class="heading"><div><div class="eyebrow">SITE OPERATIONS</div><h1>오늘의 현장 운영</h1><p>${role==='admin'?'전체 기업의 ':'내 기업의 '}현장 인력, 근태와 급여를 관리합니다.</p></div><button class="secondary" onclick="loadData()">새로고침</button></div>
      <section class="stats"><article class="stat"><span>연결 공고</span><b>${window.jobsCount||0}</b><small>진행 공고 기준</small></article><article class="stat"><span>투입 인원</span><b>${data.length}명</b><small>지원자·근로자 기준</small></article><article class="stat alert"><span>근태 미확인</span><b>${data.filter(x=>!/정상|출근/.test(status(x))).length}건</b><small>확인 필요</small></article><article class="stat"><span>예상 지급액</span><b>${won(data.reduce((a,x)=>{const o=operation(x);return a+(+o.netPay||(+o.dailyRate||0)*(+o.workDays||0)*.967)},0))}</b><small>입력된 근태 기준</small></article></section>
      <section class="grid"><article class="panel"><h2>현장 인력 현황</h2><p class="muted">인력을 선택하면 근태와 급여 내역을 입력할 수 있습니다.</p><div class="workers">${data.length?data.map((x,i)=>`<button class="worker ${i===selected?'selected':''}" onclick="choose(${i})"><div><b>${personName(x)}</b><p>${personDetail(x)}</p></div><span class="${isGood(status(x))?'ok':'warn'}">${status(x)}</span></button>`).join(''):`<div class="empty">연결된 지원자·근로자 정보가 없습니다.<br>올핸 JOB에서 공고 지원자가 생기면 이곳에 표시됩니다.</div>`}</div></article>
      <article class="panel"><h2>근태·급여 입력</h2>${p?`<p class="muted">선택 인력: <b>${personName(p)}</b></p><div class="fields"><label>근태 상태<select id="attendance"><option ${status(p)==='정상 출근'?'selected':''}>정상 출근</option><option ${status(p)==='결근'?'selected':''}>결근</option><option ${status(p)==='지각'?'selected':''}>지각</option><option ${status(p)==='휴무'?'selected':''}>휴무</option></select></label><label>급여 지급일<input id="payDate" type="date" value="${op.payDate||''}"></label><label>일 단가<input id="rate" type="number" value="${op.dailyRate||''}" oninput="calculate()"></label><label>근무일수<input id="days" type="number" value="${op.workDays||''}" oninput="calculate()"></label></div><div class="calc"><div class="row"><span>지급 전 금액</span><b id="gross">${won(gross)}</b></div><div class="row"><span>예상 공제</span><b id="tax">${won(tax)}</b></div><div class="row total"><span>실지급 예정액</span><b id="net">${won(net)}</b></div></div><button class="primary" style="margin-top:14px;width:100%" onclick="saveOperation()">근태·급여 내역 저장</button><p class="muted" style="font-size:12px">자동 계산은 검토용입니다. 최종 급여와 공제는 노무·세무 검토 후 확정하세요.</p>`:`<div class="empty">왼쪽에서 인력을 선택해 주세요.</div>`}</article></section>`;applyView()}

    window.recordPayslipDelivery=async(id,month,payDate)=>{if(!confirm('근로자에게 임금명세서를 실제로 교부했음을 기록할까요?'))return;try{const out=await saveDocument('payslip-delivery-save',{applicationId:id,month,payDate,deliveryMethod:'전자문서·출력',deliveredAt:new Date().toISOString()});alert('임금명세서 교부완료를 기록했습니다. 문서번호: '+out.id);document.getElementById('documentPreview')?.remove();window.renderPayrollCalculation()}catch(error){alert(error.message)}};
    window.sendPayslipMessage=async id=>{try{window.payrollCalculate();const person=data.find(item=>String(item.id)===String(id));if(!person)throw new Error('대상 인력을 찾지 못했습니다.');const worker=parse(person.worker_data),op=operation(person),hours=payrollHours(person),rate=Number(op.hourlyRate)||10320,month=invoiceMonthKey(),payDate=op.payDate||new Date().toISOString().slice(0,10),value=key=>payslipValue(id,key),add1=Number(document.getElementById(`pc-${id}-add1`)?.value)||0,add2=Number(document.getElementById(`pc-${id}-add2`)?.value)||0,deduct1=Number(document.getElementById(`pc-${id}-deduct1`)?.value)||0,deduct2=Number(document.getElementById(`pc-${id}-deduct2`)?.value)||0,body=`[임금명세서]\n\n성명: ${personName(person)}\n급여 산정기간: ${monthName(month)}\n임금지급일: ${payDate}\n거래처·근무지: ${personnelWorksite(person)}\n근무형태: ${op.workType||'주간'}\n\n[지급 내역]\n기본급: ${won(value('basic'))} (시급 ${won(rate)} × 정상 ${hours.normal}시간)\n연장근로수당: ${won(value('over'))} (시급 ${won(rate)} × 연장 ${hours.overtime}시간 × 1.5)\n휴일근로수당: ${won(value('holiday'))} (시급 ${won(rate)} × 휴일 ${hours.holiday}시간 × 1.5)\n추가급여 1: ${won(add1)}\n추가급여 2: ${won(add2)}\n총지급액: ${won(value('total'))}\n\n[공제 내역]\n소득세: ${won(value('tax'))} (2026 간이세액표·본인 1명·총지급액 기준)\n지방소득세: ${won(value('local'))} (소득세 × 10%)\n국민연금: ${won(value('pension'))} (시급 × 209시간 × 4.75%)\n건강보험: ${won(value('health'))} (시급 × 209시간 × 4.0674%)\n고용보험: ${won(value('employment'))} (시급 × 209시간 × 0.9%)\n기본공제 1: ${won(deduct1)}\n기본공제 2: ${won(deduct2)}\n공제금액 합계: ${won(value('deducttotal'))}\n\n차인지급액: ${won(value('net'))}\n\n본 쪽지는 임금 구성항목, 계산방법 및 공제내역을 포함한 임금명세서입니다.`;if(!confirm(`${personName(person)}님에게 플랫폼 쪽지로 임금명세서를 보낼까요?`))return;const out=await saveDocument('payslip-message-send',{applicationId:id,month,payDate,subject:`${monthName(month)} 임금명세서`,body});alert('플랫폼 쪽지로 임금명세서를 보냈습니다. 쪽지번호: '+out.messageId);document.getElementById('documentPreview')?.remove();window.renderPayrollCalculation()}catch(error){alert(error.message)}};
    const baseShowPayslip=window.showPayslip;window.showPayslip=async id=>{await baseShowPayslip(id);const modal=document.getElementById('documentPreview'),actions=modal?.querySelector('.payslip-actions');if(!actions||actions.querySelector('.payslip-message-send'))return;const button=document.createElement('button');button.type='button';button.className='secondary payslip-message-send';button.textContent='쪽지 발송';button.onclick=()=>window.sendPayslipMessage(id);actions.prepend(button)};
    const payslipRenderer=window.renderPayrollCalculation;window.renderPayrollCalculation=async()=>{await payslipRenderer();let deliveries=[];try{const result=await fetch('/api/operations').then(response=>response.json());deliveries=(result.documents||[]).filter(doc=>doc.document_type==='payslip-delivery').map(doc=>parse(doc.data))}catch{}const header=document.querySelector('.payroll-ledger thead tr');if(header&&!header.querySelector('.payslip-column')){const column=document.createElement('th');column.className='payslip-column';column.textContent='임금명세서';header.append(column);document.querySelectorAll('.payroll-ledger tr[data-payroll-id]').forEach(row=>{const id=row.dataset.payrollId,delivered=deliveries.find(item=>String(item.applicationId)===String(id)&&item.month===invoiceMonthKey()),cell=document.createElement('td');cell.innerHTML=`<button class="secondary" onclick="showPayslip(${id})">명세서 보기</button><br><small class="${delivered?'ok':'warn'}">${delivered?'교부완료':'교부대기'}</small>`;row.append(cell)})}};
    if(payrollSubnav&&!payrollSubnav.querySelector('[data-view="payslip-delivery"]')){const button=document.createElement('button');button.dataset.view='payslip-delivery';button.textContent='명세서 발송';payrollSubnav.append(button)};
    window.renderPayslipDelivery=async()=>{const main=$('#app'),heading=main.querySelector('.heading');if(!heading)return;heading.querySelector('h1').textContent='명세서 발송';heading.querySelector('p').textContent='거래처별 임금명세서의 발송대기·교부완료 상태를 관리합니다.';Array.from(main.children).forEach(section=>{if(section!==heading)section.remove()});let deliveries=[];try{const result=await fetch('/api/operations').then(response=>response.json());deliveries=(result.documents||[]).filter(doc=>doc.document_type==='payslip-delivery').map(doc=>parse(doc.data))}catch{}const month=invoiceMonthKey(),people=data.filter(person=>isAcceptedPerson(person)&&personnelAssignedJob(person)&&!formerWorker(person)),groups=people.reduce((all,person)=>{const client=personnelWorksite(person);(all[client]??=[]).push(person);return all},{}),content=Object.entries(groups).map(([client,members])=>{const done=members.filter(person=>deliveries.some(item=>String(item.applicationId)===String(person.id)&&item.month===month)).length;return `<section class="panel" style="margin-top:18px"><div class="attendance-toolbar"><div><h2>${esc(client)}</h2><p class="muted">${monthName(month)} · 교부완료 ${done}/${members.length}명</p></div><span class="attendance-state ${done===members.length&&members.length?'closed':'open'}">${done===members.length&&members.length?'발송 완료':'발송대기'}</span></div><div class="workers">${members.map(person=>{const delivered=deliveries.find(item=>String(item.applicationId)===String(person.id)&&item.month===month);return `<div class="worker" style="cursor:default"><div><b>${esc(personName(person))}</b><p>${esc(person.job_title||'배치 인력')} · ${delivered?'교부일 '+String(delivered.deliveredAt||'').slice(0,10):'명세서 교부 필요'}</p></div><div><span class="${delivered?'ok':'warn'}">${delivered?'교부완료':'발송대기'}</span> <button class="secondary" onclick="showPayslip(${person.id})">명세서 보기</button></div></div>`}).join('')}</div></section>`}).join('');main.insertAdjacentHTML('beforeend',content||'<section class="panel"><div class="empty">명세서 발송 대상 인력이 없습니다.</div></section>')};
    const payslipDeliveryNavigation=window.setView;window.setView=next=>{if(next==='payslip-delivery'){payslipDeliveryNavigation('payroll');setTimeout(()=>{document.querySelectorAll('#payrollSubnav [data-view]').forEach(button=>button.classList.toggle('active',button.dataset.view==='payslip-delivery'));window.renderPayslipDelivery()},0);return}payslipDeliveryNavigation(next)};
    const basePayslipDeliveryRenderer=window.renderPayslipDelivery;window.renderPayslipDelivery=async()=>{await basePayslipDeliveryRenderer();try{const result=await fetch('/api/operations').then(response=>response.json()),deliveries=(result.documents||[]).filter(doc=>doc.document_type==='payslip-delivery').map(doc=>parse(doc.data)),messages=result.messages||[],month=invoiceMonthKey();document.querySelectorAll('#app .worker').forEach(card=>{const name=card.querySelector('b')?.textContent?.trim(),person=data.find(item=>personName(item)===name),delivery=person&&deliveries.find(item=>String(item.applicationId)===String(person.id)&&item.month===month),state=card.querySelector('.ok,.warn');if(!delivery||!state)return;const message=messages.find(item=>String(item.id)===String(delivery.messageId));if(delivery.deliveryMethod==='플랫폼 쪽지'){state.className=message?.read_at?'ok':'warn';state.textContent=message?.read_at?'수신확인':'쪽지 발송완료'}else{state.className='ok';state.textContent='교부완료'}})}catch{}};
    const payrollSummaryForDelivery=window.renderPayrollSummary;window.renderPayrollSummary=async()=>{if(window.__operationsRequestedView==='payslip-delivery')return;return payrollSummaryForDelivery()};
    const finalOperationsSetView=window.setView;window.setView=next=>{window.__operationsRequestedView=next;return finalOperationsSetView(next)};
    loadData();
  </script>
