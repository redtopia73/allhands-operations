<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>all hands 운영관리</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#f5f7fb;color:#172852;font:15px system-ui,sans-serif}.top{height:68px;background:#fff;border-bottom:1px solid #e4e8ef;display:flex;align-items:center;justify-content:space-between;padding:0 max(20px,calc((100% - 1320px)/2));font-weight:850}.brand em,.eyebrow{color:#ff5e4e;font-style:normal}.user{color:#66738a;font-size:13px}.layout{max-width:1320px;margin:auto;display:grid;grid-template-columns:220px 1fr;min-height:calc(100vh - 68px)}aside{background:#fff;border-right:1px solid #e4e8ef;padding:22px 13px}.small{font-size:11px;font-weight:850;color:#8a95a8;letter-spacing:.08em;margin:0 10px 10px}nav button{display:block;width:100%;border:0;background:transparent;text-align:left;padding:12px 11px;border-radius:8px;color:#63718a;font:inherit;font-weight:800;cursor:pointer}nav button.active{background:#edf1fb;color:#172852}main{padding:36px}.heading{display:flex;justify-content:space-between;align-items:end;gap:16px}.heading h1{font-size:32px;margin:4px 0}.heading p{color:#64718a;margin:0}.primary{border:0;border-radius:8px;background:#1b2a57;color:#fff;padding:12px 15px;font:inherit;font-weight:850;cursor:pointer}.secondary{border:1px solid #cbd4e1;border-radius:8px;background:#fff;color:#172852;padding:11px 14px;font:inherit;font-weight:800;cursor:pointer}.stats,.grid{display:grid;gap:14px}.stats{grid-template-columns:repeat(4,1fr);margin:25px 0}.stat,.panel{background:#fff;border:1px solid #e1e6ee;border-radius:13px;padding:18px}.stat span{font-size:13px;color:#66738a}.stat b{display:block;margin:7px 0 3px;font-size:25px}.stat small{color:#8a95a8}.alert b{color:#d65748}.grid{grid-template-columns:1.25fr .9fr}.panel h2{margin:0;font-size:19px}.muted{color:#64718a;line-height:1.6}.workers{display:grid;gap:10px;margin-top:16px}.worker{background:#fff;border:1px solid #e1e6ee;border-radius:10px;padding:14px;display:flex;justify-content:space-between;text-align:left;color:#172852;font:inherit;cursor:pointer}.worker.selected{border-color:#8298cf;background:#f4f7ff}.worker p{margin:5px 0 0;color:#64718a;font-size:13px}.ok{color:#16835b}.warn{color:#d65748}.fields{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:15px}label{font-size:12px;font-weight:850;color:#63718a}input,select{display:block;width:100%;border:1px solid #d7dfe9;border-radius:7px;padding:10px;margin-top:5px;font:inherit;color:#172852}.calc{background:#f4f6fb;padding:14px;border-radius:10px;margin-top:15px}.row{display:flex;justify-content:space-between;padding:6px 0;color:#63718a}.row.total{border-top:1px solid #dce3ed;color:#172852;font-weight:850;margin-top:6px;padding-top:12px}.empty{border:1px dashed #cbd4e1;border-radius:10px;padding:28px;text-align:center;color:#64718a}.login{position:fixed;z-index:5;inset:0;background:rgba(19,34,72,.55);display:flex;align-items:center;justify-content:center;padding:20px}.login.hidden{display:none}.login-card{width:min(430px,100%);background:#fff;border-radius:16px;padding:28px;box-shadow:0 20px 50px #15255055}.login-card h1{margin:7px 0}.login-card p{color:#64718a;line-height:1.6}.login-card .primary{width:100%;margin-top:18px}.error{min-height:20px;color:#d65748;font-size:13px;margin:12px 0 0}.loading{display:flex;align-items:center;justify-content:center;min-height:300px;color:#64718a}@media(max-width:800px){.layout{grid-template-columns:1fr}aside{border-right:0;border-bottom:1px solid #e4e8ef;display:flex;gap:4px;overflow:auto;padding:10px}.small{display:none}nav{display:flex}nav button{white-space:nowrap}.top{padding:0 16px}main{padding:25px 16px}.stats,.grid{grid-template-columns:1fr 1fr}.heading{align-items:start;flex-direction:column}}@media(max-width:520px){.stats,.grid,.fields{grid-template-columns:1fr}.user{display:none}}
  </style>
</head>
<body>
  <div class="login" id="loginBox">
    <form class="login-card" id="loginForm">
      <div class="eyebrow">ALL HANDS OPERATIONS</div>
      <h1>운영관리 로그인</h1>
      <p>기업회원 또는 관리자 계정으로 로그인해 현장 인력과 근태·급여 내역을 관리합니다.</p>
      <label>접속 구분<select id="role"><option value="company">기업회원</option><option value="admin">관리자</option></select></label>
      <label id="idLabel">기업 이메일 또는 사업자번호<input id="loginId" autocomplete="username" required></label>
      <label>비밀번호<input id="loginPassword" type="password" autocomplete="current-password" required></label>
      <button class="primary" type="submit">로그인</button>
      <div class="error" id="loginError"></div>
    </form>
  </div>
  <header class="top"><div class="brand">all hands <em>운영관리</em></div><div class="user" id="userText">기업·관리자 전용 · 올핸 JOB 연동</div></header>
  <div class="layout"><aside><p class="small">OPERATIONS</p><nav id="sideNav"><button class="active" data-view="dashboard">대시보드</button><button data-view="people">현장·인력</button><button data-view="attendance">근태 관리</button><button data-view="payroll">급여·정산</button><button data-view="contracts">견적·계약</button></nav></aside>
  <main id="app"><div class="loading">로그인 정보를 확인하고 있습니다.</div></main></div>
  <script>
    const $=s=>document.querySelector(s), won=n=>new Intl.NumberFormat('ko-KR').format(Math.round(Number(n)||0))+'원';
    let data=[],selected=0,role='',view='dashboard';
    const parse=v=>{try{return typeof v==='string'?JSON.parse(v):v||{}}catch{return {}}};
    function personName(p){const d=parse(p.worker_data);return d.name||d.applicantName||d.userName||d.fullName||'지원자'}
    function personDetail(p){const d=parse(p.worker_data);return [d.region||d.preferredRegion||'',d.job||d.desiredJob||p.job_title||''].filter(Boolean).join(' · ')||'배정 정보 확인 필요'}
    function operation(p){return parse(parse(p.employer_note).operation)}
    function status(p){const op=operation(p);return op.attendance||p.status||'근태 미확인'}
    function isGood(s){return /정상|출근|합격|interview|hired/i.test(s)}
    function render(){const p=data[selected],op=p?operation(p):{};const gross=(Number(op.dailyRate)||0)*(Number(op.workDays)||0),tax=Math.round(gross*.033),net=gross-tax;$('#app').innerHTML=`
      <div class="heading"><div><div class="eyebrow">SITE OPERATIONS</div><h1>오늘의 현장 운영</h1><p>${role==='admin'?'전체 기업의 ':'내 기업의 '}현장 인력, 근태와 급여를 관리합니다.</p></div><button class="secondary" onclick="loadData()">새로고침</button></div>
      <section class="stats"><article class="stat"><span>연결 공고</span><b>${window.jobsCount||0}</b><small>진행 공고 기준</small></article><article class="stat"><span>투입 인원</span><b>${data.length}명</b><small>지원자·근로자 기준</small></article><article class="stat alert"><span>근태 미확인</span><b>${data.filter(x=>!/정상|출근/.test(status(x))).length}건</b><small>확인 필요</small></article><article class="stat"><span>예상 지급액</span><b>${won(data.reduce((a,x)=>{const o=operation(x);return a+(+o.netPay||(+o.dailyRate||0)*(+o.workDays||0)*.967)},0))}</b><small>입력된 근태 기준</small></article></section>
      <section class="grid"><article class="panel"><h2>현장 인력 현황</h2><p class="muted">인력을 선택하면 근태와 급여 내역을 입력할 수 있습니다.</p><div class="workers">${data.length?data.map((x,i)=>`<button class="worker ${i===selected?'selected':''}" onclick="choose(${i})"><div><b>${personName(x)}</b><p>${personDetail(x)}</p></div><span class="${isGood(status(x))?'ok':'warn'}">${status(x)}</span></button>`).join(''):`<div class="empty">연결된 지원자·근로자 정보가 없습니다.<br>올핸 JOB에서 공고 지원자가 생기면 이곳에 표시됩니다.</div>`}</div></article>
      <article class="panel"><h2>근태·급여 입력</h2>${p?`<p class="muted">선택 인력: <b>${personName(p)}</b></p><div class="fields"><label>근태 상태<select id="attendance"><option ${status(p)==='정상 출근'?'selected':''}>정상 출근</option><option ${status(p)==='결근'?'selected':''}>결근</option><option ${status(p)==='지각'?'selected':''}>지각</option><option ${status(p)==='휴무'?'selected':''}>휴무</option></select></label><label>급여 지급일<input id="payDate" type="date" value="${op.payDate||''}"></label><label>일 단가<input id="rate" type="number" value="${op.dailyRate||''}" oninput="calculate()"></label><label>근무일수<input id="days" type="number" value="${op.workDays||''}" oninput="calculate()"></label></div><div class="calc"><div class="row"><span>지급 전 금액</span><b id="gross">${won(gross)}</b></div><div class="row"><span>예상 공제</span><b id="tax">${won(tax)}</b></div><div class="row total"><span>실지급 예정액</span><b id="net">${won(net)}</b></div></div><button class="primary" style="margin-top:14px;width:100%" onclick="saveOperation()">근태·급여 내역 저장</button><p class="muted" style="font-size:12px">자동 계산은 검토용입니다. 최종 급여와 공제는 노무·세무 검토 후 확정하세요.</p>`:`<div class="empty">왼쪽에서 인력을 선택해 주세요.</div>`}</article></section>`;applyView()}
    const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    function applyView(){document.querySelectorAll('#sideNav [data-view]').forEach(button=>button.classList.toggle('active',button.dataset.view===view));if(view==='dashboard')return;const main=$('#app'),titles={people:['현장·인력','현장별 인력 배정과 지원자 현황을 확인합니다.'],attendance:['근태 관리','근태 상태를 확인하고 대상 인력을 선택해 수정합니다.'],payroll:['급여·정산','입력된 근태 기준의 급여·정산 내역입니다.'],contracts:['견적·계약','견적 요청과 계약 진행 현황을 관리합니다.']}[view];main.querySelector('.heading h1').textContent=titles[0];main.querySelector('.heading p').textContent=titles[1];main.querySelector('.stats').style.display='none';main.querySelector('.grid').style.display='none';let content='';if(view==='people')content=data.length?data.map((p,i)=>`<button class="worker" onclick="choose(${i})"><div><b>${esc(personName(p))}</b><p>${esc(personDetail(p))}</p></div><span class="${isGood(status(p))?'ok':'warn'}">${esc(status(p))}</span></button>`).join(''):'<div class="empty">연결된 인력이 없습니다.</div>';if(view==='attendance')content=data.length?data.map((p,i)=>`<button class="worker" onclick="setView('dashboard');choose(${i})"><div><b>${esc(personName(p))}</b><p>${esc(personDetail(p))}</p></div><span class="${isGood(status(p))?'ok':'warn'}">${esc(status(p))} · 수정하기</span></button>`).join(''):'<div class="empty">근태를 등록할 인력이 없습니다.</div>';if(view==='payroll')content=data.length?data.map(p=>{const o=operation(p),amount=+o.netPay||(+o.dailyRate||0)*(+o.workDays||0)*.967;return `<div class="worker" style="cursor:default"><div><b>${esc(personName(p))}</b><p>${esc(o.payDate||'지급일 미정')} · ${esc(o.workDays||'0')}일 근무</p></div><b>${won(amount)}</b></div>`}).join(''):'<div class="empty">정산 내역이 없습니다.</div>';if(view==='contracts')content='<div class="empty">견적·계약 기능은 올핸 JOB의 상담·견적 요청과 연결됩니다.<br><br>기업의 요청 내용을 확인한 뒤 견적서와 계약서를 등록·관리할 수 있도록 다음 단계에서 연결합니다.</div>';main.insertAdjacentHTML('beforeend',`<section class="panel" style="margin-top:20px"><h2>${titles[0]}</h2><div class="workers">${content}</div></section>`)}
    window.choose=i=>{selected=i;render()};
    window.setView=next=>{view=next;render()};
    window.calculate=()=>{const gross=(+$('#rate').value||0)*(+$('#days').value||0),tax=Math.round(gross*.033);$('#gross').textContent=won(gross);$('#tax').textContent=won(tax);$('#net').textContent=won(gross-tax)};
    window.saveOperation=async()=>{const p=data[selected],gross=(+$('#rate').value||0)*(+$('#days').value||0),tax=Math.round(gross*.033);const res=await fetch('/api/operations',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({applicationId:p.id,attendance:$('#attendance').value,dailyRate:$('#rate').value,workDays:$('#days').value,workHours:'',payDate:$('#payDate').value,grossPay:gross,netPay:gross-tax})});const out=await res.json();if(out.ok){alert('근태·급여 내역을 저장했습니다.');loadData()}else alert(out.error||'저장하지 못했습니다.')};
    window.loadData=async()=>{const res=await fetch('/api/operations'),out=await res.json();if(!res.ok){$('#loginBox').classList.remove('hidden');$('#loginError').textContent=out.error||'다시 로그인해 주세요.';return}data=out.people||[];window.jobsCount=(out.jobs||[]).length;role=out.role||'';$('#userText').textContent=role==='admin'?'관리자 · 전체 기업 운영관리':'기업회원 · 내 기업 운영관리';$('#loginBox').classList.add('hidden');selected=0;render()};
    $('#role').onchange=e=>$('#idLabel').firstChild.textContent=e.target.value==='admin'?'관리자 이메일':'기업 이메일 또는 사업자번호';
    $('#loginForm').onsubmit=async e=>{e.preventDefault();$('#loginError').textContent='로그인 중입니다.';const res=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({role:$('#role').value,id:$('#loginId').value,password:$('#loginPassword').value})}),out=await res.json();if(!res.ok){$('#loginError').textContent=out.error||'로그인하지 못했습니다.';return}$('#loginError').textContent='';loadData()};
    $('#sideNav').onclick=e=>{const button=e.target.closest('[data-view]');if(!button)return;view=button.dataset.view;render()};
    loadData();
  </script>
</body>
</html>
