<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>all hands 운영관리</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#f5f7fb;color:#172852;font:15px system-ui,sans-serif}.top{height:68px;background:#fff;border-bottom:1px solid #e4e8ef;display:flex;align-items:center;justify-content:space-between;padding:0 max(20px,calc((100% - 1320px)/2));font-weight:850}.brand em,.eyebrow{color:#ff5e4e;font-style:normal}.user{color:#66738a;font-size:13px}.layout{max-width:1320px;margin:auto;display:grid;grid-template-columns:220px 1fr;min-height:calc(100vh - 68px)}aside{background:#fff;border-right:1px solid #e4e8ef;padding:22px 13px}.small{font-size:11px;font-weight:850;color:#8a95a8;letter-spacing:.08em;margin:0 10px 10px}nav button{display:block;width:100%;border:0;background:transparent;text-align:left;padding:12px 11px;border-radius:8px;color:#63718a;font:inherit;font-weight:800;cursor:pointer}nav button.active{background:#edf1fb;color:#172852}main{padding:36px}.heading{display:flex;justify-content:space-between;align-items:end;gap:16px}.heading h1{font-size:32px;margin:4px 0}.heading p{color:#64718a;margin:0}.primary{border:0;border-radius:8px;background:#1b2a57;color:#fff;padding:12px 15px;font:inherit;font-weight:850;cursor:pointer}.secondary{border:1px solid #cbd4e1;border-radius:8px;background:#fff;color:#172852;padding:11px 14px;font:inherit;font-weight:800;cursor:pointer}.stats,.grid{display:grid;gap:14px}.stats{grid-template-columns:repeat(4,1fr);margin:25px 0}.stat,.panel{background:#fff;border:1px solid #e1e6ee;border-radius:13px;padding:18px}.stat span{font-size:13px;color:#66738a}.stat b{display:block;margin:7px 0 3px;font-size:25px}.stat small{color:#8a95a8}.alert b{color:#d65748}.grid{grid-template-columns:1.25fr .9fr}.panel h2{margin:0;font-size:19px}.muted{color:#64718a;line-height:1.6}.workers{display:grid;gap:10px;margin-top:16px}.worker{background:#fff;border:1px solid #e1e6ee;border-radius:10px;padding:14px;display:flex;justify-content:space-between;text-align:left;color:#172852;font:inherit;cursor:pointer}.worker.selected{border-color:#8298cf;background:#f4f7ff}.worker p{margin:5px 0 0;color:#64718a;font-size:13px}.ok{color:#16835b}.warn{color:#d65748}.fields{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:15px}label{font-size:12px;font-weight:850;color:#63718a}input,select{display:block;width:100%;border:1px solid #d7dfe9;border-radius:7px;padding:10px;margin-top:5px;font:inherit;color:#172852}.calc{background:#f4f6fb;padding:14px;border-radius:10px;margin-top:15px}.row{display:flex;justify-content:space-between;padding:6px 0;color:#63718a}.row.total{border-top:1px solid #dce3ed;color:#172852;font-weight:850;margin-top:6px;padding-top:12px}.empty{border:1px dashed #cbd4e1;border-radius:10px;padding:28px;text-align:center;color:#64718a}.quote-head{display:grid;grid-template-columns:2fr 2fr 1fr;gap:10px;margin:14px 0}.quote-table{width:100%;border-collapse:collapse;margin-top:10px;font-size:13px}.quote-table th,.quote-table td{border:1px solid #d9e0eb;padding:8px;text-align:center}.quote-table th{background:#edf1fb}.quote-table input{min-width:82px;padding:6px;margin:0}.quote-table .group td,.quote-table tr.group td{background:#f6f8fc;font-weight:850}.quote-table .subtotal td{background:#fafbfd;font-weight:800}.quote-table .total td{background:#eef3ff;font-weight:850}.quote-table .grand td{background:#1b2a57;color:#fff;font-size:15px;font-weight:850}.quote-note{margin-top:14px;padding:13px;background:#fff7f4;border-radius:9px;color:#6b574f;line-height:1.7;font-size:13px}.login{position:fixed;z-index:5;inset:0;background:rgba(19,34,72,.55);display:flex;align-items:center;justify-content:center;padding:20px}.login.hidden{display:none}.login-card{width:min(430px,100%);background:#fff;border-radius:16px;padding:28px;box-shadow:0 20px 50px #15255055}.login-card h1{margin:7px 0}.login-card p{color:#64718a;line-height:1.6}.login-card .primary{width:100%;margin-top:18px}.error{min-height:20px;color:#d65748;font-size:13px;margin:12px 0 0}.loading{display:flex;align-items:center;justify-content:center;min-height:300px;color:#64718a}@media(max-width:800px){.layout{grid-template-columns:1fr}aside{border-right:0;border-bottom:1px solid #e4e8ef;display:flex;gap:4px;overflow:auto;padding:10px}.small{display:none}nav{display:flex}nav button{white-space:nowrap}.top{padding:0 16px}main{padding:25px 16px}.stats,.grid,.quote-head{grid-template-columns:1fr 1fr}.heading{align-items:start;flex-direction:column}}@media(max-width:520px){.stats,.grid,.fields,.quote-head{grid-template-columns:1fr}.user{display:none}}
    .contract-subnav{margin:-2px 0 7px 12px;padding-left:10px;border-left:2px solid #dbe3f0}.contract-subnav button{font-size:13px;padding:9px 10px}.contract-subnav button.active{background:#fff0ed;color:#c74f42}.contract-draft{border-top:4px solid #1b2a57}.contract-title,.quote-document-title{text-align:center;font-size:29px;font-weight:900;margin:8px 0 22px}.contract-intro{padding:13px;background:#f6f8fc;border:1px solid #dce4f0;line-height:1.7}.contract-draft h3{margin:26px 0 10px;padding-bottom:8px;border-bottom:2px solid #1b2a57}.contract-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.contract-grid .wide{grid-column:1/-1}.contract-grid textarea{width:100%;min-height:95px;margin-top:5px;padding:10px;border:1px solid #d7dfe9;border-radius:7px;font:inherit;color:#172852}.document-preview{position:fixed;z-index:20;inset:0;overflow:auto;background:#eef2f8;padding:28px}.preview-toolbar{position:sticky;top:0;z-index:1;max-width:900px;margin:0 auto 18px;background:#172852;color:#fff;border-radius:10px;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px}.preview-toolbar div{display:flex;gap:8px}.preview-toolbar .secondary{padding:8px 12px}.preview-paper{max-width:900px;margin:0 auto;background:#fff;padding:42px;box-shadow:0 6px 28px #17285222}.preview-paper .panel{border:0;padding:0;border-radius:0}.preview-paper .quote-panel,.preview-paper .contract-draft{display:block!important}.preview-value{display:block;min-height:20px;padding:7px 0;border-bottom:1px solid #d7dfe9;white-space:pre-wrap}.preview-paper .quote-table .preview-value{padding:0;border:0;text-align:right}.preview-paper .seal-upload{display:none}@media(max-width:520px){.contract-grid{grid-template-columns:1fr}.document-preview{padding:12px}.preview-paper{padding:22px 14px}.preview-toolbar{align-items:flex-start;flex-direction:column}}
  </style>
</head>
<body>
  <div class="login" id="loginBox">
    <form class="login-card" id="loginForm">
      <div class="eyebrow">ALL HANDS OPERATIONS</div>
      <h1>운영관리 로그인</h1>
      <p>기업회원 또는 관리자 계정으로 로그인해 현장 인력과 근태·급여 내역을 관리합니다.</p>
      <label>접속 구분<select id="role"><option value="company">기업회원</option><option value="admin">관리자</option></select></label>
      <label id="idLabel">기업 이메일 또는 사업자번호<input id="loginId" autocomplete="username" required></label>
      <label>비밀번호<input id="loginPassword" type="password" autocomplete="current-password" required></label>
      <button class="primary" type="submit">로그인</button>
      <div class="error" id="loginError"></div>
    </form>
  </div>
  <header class="top"><div class="brand">all hands <em>운영관리</em></div><div class="user" id="userText">기업·관리자 전용 · 올핸 JOB 연동</div></header>
  <div class="layout"><aside><p class="small">OPERATIONS</p><nav id="sideNav"><button class="active" data-view="dashboard">대시보드</button><button data-view="people">현장·인력</button><button data-view="attendance">근태 관리</button><button data-view="payroll">급여·정산</button><button data-view="contracts">견적·계약</button><div id="contractSubnav" class="contract-subnav" style="display:none"><button data-view="quote">견적서 작성</button><button data-view="contract">도급계약서 작성</button><button data-view="dispatch-contract">파견계약서 작성</button></div></nav></aside>
  <main id="app"><div class="loading">로그인 정보를 확인하고 있습니다.</div></main></div>
  <script>
    const $=s=>document.querySelector(s), won=n=>new Intl.NumberFormat('ko-KR').format(Math.round(Number(n)||0))+'원';
    let data=[],selected=0,role='',view='dashboard';const seals={quote:'',contract:'',dispatch:''};
    const parse=v=>{try{return typeof v==='string'?JSON.parse(v):v||{}}catch{return {}}};
    function personName(p){const d=parse(p.worker_data);return d.name||d.applicantName||d.userName||d.fullName||'지원자'}
    function personDetail(p){const d=parse(p.worker_data);return [d.region||d.preferredRegion||'',d.job||d.desiredJob||p.job_title||''].filter(Boolean).join(' · ')||'배정 정보 확인 필요'}
    function operation(p){return parse(parse(p.employer_note).operation)}
    function status(p){const op=operation(p);return op.attendance||p.status||'근태 미확인'}
    function isGood(s){return /정상|출근|합격|interview|hired/i.test(s)}
    function render(){const p=data[selected],op=p?operation(p):{};const gross=(Number(op.dailyRate)||0)*(Number(op.workDays)||0),tax=Math.round(gross*.033),net=gross-tax;$('#app').innerHTML=`
      <div class="heading"><div><div class="eyebrow">SITE OPERATIONS</div><h1>오늘의 현장 운영</h1><p>${role==='admin'?'전체 기업의 ':'내 기업의 '}현장 인력, 근태와 급여를 관리합니다.</p></div><button class="secondary" onclick="loadData()">새로고침</button></div>
      <section class="stats"><article class="stat"><span>연결 공고</span><b>${window.jobsCount||0}</b><small>진행 공고 기준</small></article><article class="stat"><span>투입 인원</span><b>${data.length}명</b><small>지원자·근로자 기준</small></article><article class="stat alert"><span>근태 미확인</span><b>${data.filter(x=>!/정상|출근/.test(status(x))).length}건</b><small>확인 필요</small></article><article class="stat"><span>예상 지급액</span><b>${won(data.reduce((a,x)=>{const o=operation(x);return a+(+o.netPay||(+o.dailyRate||0)*(+o.workDays||0)*.967)},0))}</b><small>입력된 근태 기준</small></article></section>
      <section class="grid"><article class="panel"><h2>현장 인력 현황</h2><p class="muted">인력을 선택하면 근태와 급여 내역을 입력할 수 있습니다.</p><div class="workers">${data.length?data.map((x,i)=>`<button class="worker ${i===selected?'selected':''}" onclick="choose(${i})"><div><b>${personName(x)}</b><p>${personDetail(x)}</p></div><span class="${isGood(status(x))?'ok':'warn'}">${status(x)}</span></button>`).join(''):`<div class="empty">연결된 지원자·근로자 정보가 없습니다.<br>올핸 JOB에서 공고 지원자가 생기면 이곳에 표시됩니다.</div>`}</div></article>
      <article class="panel"><h2>근태·급여 입력</h2>${p?`<p class="muted">선택 인력: <b>${personName(p)}</b></p><div class="fields"><label>근태 상태<select id="attendance"><option ${status(p)==='정상 출근'?'selected':''}>정상 출근</option><option ${status(p)==='결근'?'selected':''}>결근</option><option ${status(p)==='지각'?'selected':''}>지각</option><option ${status(p)==='휴무'?'selected':''}>휴무</option></select></label><label>급여 지급일<input id="payDate" type="date" value="${op.payDate||''}"></label><label>일 단가<input id="rate" type="number" value="${op.dailyRate||''}" oninput="calculate()"></label><label>근무일수<input id="days" type="number" value="${op.workDays||''}" oninput="calculate()"></label></div><div class="calc"><div class="row"><span>지급 전 금액</span><b id="gross">${won(gross)}</b></div><div class="row"><span>예상 공제</span><b id="tax">${won(tax)}</b></div><div class="row total"><span>실지급 예정액</span><b id="net">${won(net)}</b></div></div><button class="primary" style="margin-top:14px;width:100%" onclick="saveOperation()">근태·급여 내역 저장</button><p class="muted" style="font-size:12px">자동 계산은 검토용입니다. 최종 급여와 공제는 노무·세무 검토 후 확정하세요.</p>`:`<div class="empty">왼쪽에서 인력을 선택해 주세요.</div>`}</article></section>`;applyView()}
    const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    function applyView(){document.querySelectorAll('#sideNav [data-view]').forEach(button=>button.classList.toggle('active',button.dataset.view===view));if(view==='dashboard')return;const main=$('#app'),titles={people:['현장·인력','현장별 인력 배정과 지원자 현황을 확인합니다.'],attendance:['근태 관리','근태 상태를 확인하고 대상 인력을 선택해 수정합니다.'],payroll:['급여·정산','입력된 근태 기준의 급여·정산 내역입니다.'],contracts:['견적·계약','도급단가 견적서와 계약 진행 현황을 관리합니다.']}[view];main.querySelector('.heading h1').textContent=titles[0];main.querySelector('.heading p').textContent=titles[1];main.querySelector('.stats').style.display='none';main.querySelector('.grid').style.display='none';let content='';if(view==='people')content=data.length?data.map((p,i)=>`<button class="worker" onclick="choose(${i})"><div><b>${esc(personName(p))}</b><p>${esc(personDetail(p))}</p></div><span class="${isGood(status(p))?'ok':'warn'}">${esc(status(p))}</span></button>`).join(''):'<div class="empty">연결된 인력이 없습니다.</div>';if(view==='attendance')content=data.length?data.map((p,i)=>`<button class="worker" onclick="setView('dashboard');choose(${i})"><div><b>${esc(personName(p))}</b><p>${esc(personDetail(p))}</p></div><span class="${isGood(status(p))?'ok':'warn'}">${esc(status(p))} · 수정하기</span></button>`).join(''):'<div class="empty">근태를 등록할 인력이 없습니다.</div>';if(view==='payroll')content=data.length?data.map(p=>{const o=operation(p),amount=+o.netPay||(+o.dailyRate||0)*(+o.workDays||0)*.967;return `<div class="worker" style="cursor:default"><div><b>${esc(personName(p))}</b><p>${esc(o.payDate||'지급일 미정')} · ${esc(o.workDays||'0')}일 근무</p></div><b>${won(amount)}</b></div>`}).join(''):'<div class="empty">정산 내역이 없습니다.</div>';if(view==='contracts')content=`<div class="quote-document-title">견적서</div><div class="quote-head"><label>견적서명<input id="quoteTitle" value="견적서"></label><label>거래처·현장<input id="quoteClient" placeholder="거래처 또는 현장명"></label><label>Agency fee<input id="quoteFeeRate" type="number" value="6" min="0" step=".1" oninput="quoteCalculator()">%</label></div><div style="overflow:auto"><table class="quote-table"><thead><tr><th>구분</th><th>산정 항목</th><th>적용 요율</th><th>직무</th><th>인원</th><th>금액</th></tr></thead><tbody><tr class="group"><td rowspan="10">직접비</td><td colspan="5">1. 급여</td></tr><tr><td>기본급</td><td>-</td><td><input id="qJob" value="생산직"></td><td><input id="qPeople" type="number" value="1" min="1" oninput="quoteCalculator()"></td><td><input id="qBase" type="number" value="0" oninput="quoteCalculator()"></td></tr><tr><td>업무수당</td><td>-</td><td colspan="2"></td><td><input id="qDuty" type="number" value="0" oninput="quoteCalculator()"></td></tr><tr><td>시간외근로수당</td><td>-</td><td colspan="2"></td><td><input id="qOvertime" type="number" value="0" oninput="quoteCalculator()"></td></tr><tr><td>휴일근무수당</td><td>-</td><td colspan="2"></td><td><input id="qHoliday" type="number" value="0" oninput="quoteCalculator()"></td></tr><tr><td>식대(보조)</td><td>비과세</td><td colspan="2"></td><td><input id="qMeal" type="number" value="0" oninput="quoteCalculator()"></td></tr><tr><td>차량유지비</td><td>비과세</td><td colspan="2"></td><td><input id="qVehicle" type="number" value="0" oninput="quoteCalculator()"></td></tr><tr class="subtotal"><td>(1) 월통상급여</td><td></td><td colspan="2"></td><td id="qOrdinary">0원</td></tr><tr class="subtotal"><td>(3) 과세급여</td><td></td><td colspan="2"></td><td id="qTaxable">0원</td></tr><tr class="group"><td colspan="5">2. 법적부담금</td></tr><tr><td rowspan="8">법적부담금</td><td>국민연금료</td><td>4.50%</td><td colspan="2"></td><td id="qPension">0원</td></tr><tr><td>건강보험료</td><td>3.495%</td><td colspan="2"></td><td id="qHealth">0원</td></tr><tr><td>노인장기요양보험</td><td>건강보험의 12.27%</td><td colspan="2"></td><td id="qCare">0원</td></tr><tr><td>고용보험료</td><td>1.35%</td><td colspan="2"></td><td id="qEmployment">0원</td></tr><tr><td>산재보험료</td><td>1.463%</td><td colspan="2"></td><td id="qAccident">0원</td></tr><tr><td>장애인고용부담금</td><td>3.30%</td><td colspan="2"></td><td id="qDisability">0원</td></tr><tr><td>사업소세</td><td>0.50%</td><td colspan="2"></td><td id="qLocal">0원</td></tr><tr class="subtotal"><td>(4) 법적부담금 소계</td><td></td><td colspan="2"></td><td id="qLegal">0원</td></tr><tr><td rowspan="2">기타경비</td><td>잡비 등</td><td>-</td><td colspan="2"></td><td><input id="qOther" type="number" value="50000" oninput="quoteCalculator()"></td></tr><tr class="subtotal"><td>(5) 기타경비 소계</td><td></td><td colspan="2"></td><td id="qOtherTotal">0원</td></tr><tr class="total"><td colspan="5">직접비 지급 총액</td><td id="qDirect">0원</td></tr><tr><td>간접비</td><td>Agency fee</td><td id="qFeeLabel">6.0%</td><td colspan="2"></td><td id="qFee">0원</td></tr><tr class="total"><td colspan="5">계약단가 총액</td><td id="qContract">0원</td></tr><tr class="grand"><td colspan="5">총액 (인원 반영)</td><td id="qGrand">0원</td></tr></tbody></table></div><div class="quote-note"><b>견적조건</b><br>관리자 기준 주 40시간제이며, 추가 연장·야간근로는 별도 산정합니다. 부가가치세는 별도입니다. 퇴직금은 발생 시 별도 청구 조건으로 검토합니다.</div><button class="primary" style="margin-top:16px" onclick="window.print()">견적서 인쇄하기</button>`;main.insertAdjacentHTML('beforeend',`<section class="panel quote-panel" style="margin-top:20px"><h2>${titles[0]}</h2>${content}</section>`);if(view==='contracts')quoteCalculator()}

    window.quoteCalculator=()=>{const number=id=>Number(document.getElementById(id)?.value)||0,set=(id,value)=>{const el=document.getElementById(id);if(el)el.textContent=won(value)};const base=number('qBase'),duty=number('qDuty'),overtime=number('qOvertime'),holiday=number('qHoliday'),meal=number('qMeal'),vehicle=number('qVehicle'),other=number('qOther'),people=Math.max(1,number('qPeople'));const ordinary=base+duty+overtime+holiday+meal+vehicle,taxable=ordinary-meal-vehicle,pension=Math.round(taxable*.045),health=Math.round(taxable*.03495),care=Math.round(health*.1227),employment=Math.round(taxable*.0135),accident=Math.round(taxable*.01463),disability=Math.round(taxable*.033),local=Math.round(taxable*.005),legal=pension+health+care+employment+accident+disability+local,direct=ordinary+legal+other,rate=number('quoteFeeRate')/100,fee=Math.round(direct*rate),contract=direct+fee;set('qOrdinary',ordinary);set('qTaxable',taxable);set('qPension',pension);set('qHealth',health);set('qCare',care);set('qEmployment',employment);set('qAccident',accident);set('qDisability',disability);set('qLocal',local);set('qLegal',legal);set('qOtherTotal',other);set('qDirect',direct);set('qFee',fee);set('qContract',contract);set('qGrand',contract*people);const label=document.getElementById('qFeeLabel');if(label)label.textContent=(rate*100).toFixed(1)+'%'};

    window.openPreview=type=>{const source=type==='quote'?document.querySelector('.quote-panel'):type==='dispatch-contract'?document.getElementById('dispatchContractDraft'):document.getElementById('contractDraft');if(!source)return;document.getElementById('documentPreview')?.remove();const copy=source.cloneNode(true);copy.querySelectorAll('button,.seal-upload label').forEach(node=>node.remove());copy.querySelectorAll('input,textarea,select').forEach(field=>{const value=document.createElement('span');value.className='preview-value';value.textContent=field.value||'-';field.replaceWith(value)});const modal=document.createElement('div');modal.id='documentPreview';modal.className='document-preview';const title=type==='quote'?'견적서':type==='dispatch-contract'?'파견계약서':'도급계약서';modal.innerHTML='<div class="preview-toolbar"><b>'+title+' 미리보기</b><div><button class="secondary" id="previewPrint">출력하기</button><button class="secondary" id="previewClose">닫기</button></div></div><div class="preview-paper"></div>';modal.querySelector('.preview-paper').append(copy);document.body.append(modal);modal.querySelector('#previewClose').onclick=()=>modal.remove();modal.querySelector('#previewPrint').onclick=()=>window.printPreview();};
    window.printPreview=()=>{let style=document.getElementById('previewPrintStyle');if(!style){style=document.createElement('style');style.id='previewPrintStyle';style.textContent='@media print{body>*:not(#documentPreview){display:none!important}#documentPreview{position:static!important;display:block!important;background:#fff!important;padding:0!important}.preview-toolbar{display:none!important}.preview-paper{box-shadow:none!important;margin:0!important;width:auto!important}.preview-paper .panel{border:0!important;box-shadow:none!important;padding:0!important}.preview-value{display:block;min-height:20px;padding:7px 0;border-bottom:1px solid #d7dfe9}.quote-table input{display:none!important}}';document.head.append(style)};window.print();};
    window.calculate=()=>{const gross=(+$('#rate').value||0)*(+$('#days').value||0),tax=Math.round(gross*.033);$('#gross').textContent=won(gross);$('#tax').textContent=won(tax);$('#net').textContent=won(gross-tax)};
    window.saveOperation=async()=>{const p=data[selected],gross=(+$('#rate').value||0)*(+$('#days').value||0),tax=Math.round(gross*.033);const res=await fetch('/api/operations',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({applicationId:p.id,attendance:$('#attendance').value,dailyRate:$('#rate').value,workDays:$('#days').value,workHours:'',payDate:$('#payDate').value,grossPay:gross,netPay:gross-tax})});const out=await res.json();if(out.ok){alert('근태·급여 내역을 저장했습니다.');loadData()}else alert(out.error||'저장하지 못했습니다.')};
    window.loadData=async()=>{const res=await fetch('/api/operations'),out=await res.json();if(!res.ok){$('#loginBox').classList.remove('hidden');$('#loginError').textContent=out.error||'다시 로그인해 주세요.';return}data=out.people||[];window.jobsCount=(out.jobs||[]).length;role=out.role||'';$('#userText').textContent=role==='admin'?'관리자 · 전체 기업 운영관리':'기업회원 · 내 기업 운영관리';$('#loginBox').classList.add('hidden');selected=0;render()};
    $('#role').onchange=e=>$('#idLabel').firstChild.textContent=e.target.value==='admin'?'관리자 이메일':'기업 이메일 또는 사업자번호';
    $('#loginForm').onsubmit=async e=>{e.preventDefault();$('#loginError').textContent='로그인 중입니다.';const res=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({role:$('#role').value,id:$('#loginId').value,password:$('#loginPassword').value})}),out=await res.json();if(!res.ok){$('#loginError').textContent=out.error||'로그인하지 못했습니다.';return}$('#loginError').textContent='';loadData()};
    $('#sideNav').onclick=e=>{const button=e.target.closest('[data-view]');if(button)window.setView(button.dataset.view)};
    loadData();
  </script>
</body>
</html>
