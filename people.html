  const pages={"records":{"styles":"*{box-sizing:border-box}\n#hr{margin:auto;padding-top:28px;padding-bottom:48px;font-size:15px;line-height:1.55}\n#hr h1{font-size:29px;margin:0;letter-spacing:-.05em}\n#hr h2,#hrDialog h2{font-size:19px;margin:0;letter-spacing:-.035em}\n#hr h3{font-size:15px;margin:0}\n#hr p,#hrDialog p{margin:5px 0;color:#53647a}\n.hr-line,.hr-actions,.hr-filter,.hr-tabs{display:flex;align-items:center;gap:10px;flex-wrap:wrap}\n.hr-line{justify-content:space-between;margin-bottom:16px}\n.hr-tabs{gap:4px;border-bottom:1px solid #dce4ee;margin:20px 0}\n#hr button,#hrDialog button{appearance:none;font:inherit;font-weight:650;font-size:14px;cursor:pointer;color:#283c56;background:white;border:1px solid #d6dfea;border-radius:7px;padding:8px 12px}\n#hr .hr-tabs button{border:0;border-bottom:3px solid transparent;border-radius:0;background:transparent;color:#637187}\n#hr .hr-tabs .current{border-color:#6b54a2;color:#483574}\n#hr .action,#hrDialog .action{background:#233957;border-color:#233957;color:white}\n#hr .link{color:#49367a;border:0;background:#f0edf8;padding:4px 9px}\n#hr .hr-panel,#hr .hr-stat{background:white;border:1px solid #dee5ef;border-radius:10px;padding:18px;margin-bottom:16px}\n.hr-stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}\n.hr-stat small,.hr-field,.hr-filter{font-size:14px;color:#52617a}\n.hr-stat b{display:block;font-size:25px;color:#233956}\n#hr .hr-filter,#hrDialog .hr-form{margin:12px 0}\n#hr input,#hr select,#hrDialog input,#hrDialog select,#hrDialog textarea{font:inherit;background:white;border:1px solid #c7d2e1;color:#233957;border-radius:6px;padding:8px;max-width:100%}\n.hr-field{display:grid;gap:5px}.hr-form,.hr-details{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}\n.hr-table{overflow-x:auto}#hr table,#hrDialog table{width:100%;border-collapse:collapse;font-size:14px;white-space:nowrap}\n#hr th,#hr td,#hrDialog th,#hrDialog td{padding:9px 10px;text-align:left;border-bottom:1px solid #e5eaf1}\n#hr th,#hrDialog th{background:#f5f7fb;color:#54647b}#hr .hr-pill{color:#3b4d65;background:#edf1f7;border-radius:4px;padding:2px 6px}\n.hr-tree{border-left:2px solid #d4c9ea;margin:12px 0 0 12px;padding-left:18px}\n.hr-tree section{padding:10px 0;border-bottom:1px solid #edf0f5}.hr-tree button{margin:5px 5px 0 0}\n#hrDialog{font:15px/1.55 Inter,\"Malgun Gothic\",sans-serif;width:min(680px,94vw);border:1px solid #ccd7e3;border-radius:12px;padding:22px;color:#233957;max-height:90vh}\n#hrDialog::backdrop{background:#172a4566}#hrDialog .hr-actions{justify-content:flex-end;margin-top:16px}\n#hrDialog [role=alert]{color:#9b3145}.hr-details div{padding:9px;background:#f5f7fb;border-radius:6px}\n.hr-details small{display:block;color:#566980}#hr .empty{text-align:center;padding:22px;color:#586982}\n#printSheet{display:none}.hr-paper{background:white;color:#192c45;padding:25px;border:1px solid #dce3ec}.hr-paper h2{text-align:center;letter-spacing:.12em;margin:16px}.hr-paper dl{display:grid;grid-template-columns:auto 1fr}.hr-paper dt,.hr-paper dd{border-bottom:1px solid #dce3ec;padding:9px;margin:0}.hr-paper .issuer{text-align:right;margin-top:30px}\n@media(max-width:700px){.hr-stats{grid-template-columns:repeat(2,1fr);gap:7px}#hr .hr-stat{padding:10px;margin:0}.hr-stats{margin-bottom:14px}.hr-form{grid-template-columns:1fr}.hr-tabs{gap:0}#hr .hr-tabs button{font-size:13px;padding:6px}.hr-filter label{display:flex;gap:4px;align-items:center}#hr{padding-top:18px}}\n@media print{body[data-module=records].printing>*:not(#printSheet){display:none!important}body.printing #printSheet{display:block}body.printing .hr-paper{padding:18mm;border:0}body.printing dialog::backdrop{display:none}}\n","body":"\u003cmain id=\"hr\">\u003c/main>\u003cdialog id=\"hrDialog\">\u003c/dialog>\u003cdiv id=\"printSheet\">\u003c/div>","scripts":["(() => {\nconst HR_KEY = 'public-demo-allhands.people.personnel.v1';\nconst today = () => new Intl.DateTimeFormat('sv-SE',{timeZone:'Asia/Seoul'}).format(new Date());\nconst clock = () => new Intl.DateTimeFormat('en-GB',{timeZone:'Asia/Seoul',hour:'2-digit',minute:'2-digit'}).format(new Date());\nconst uid = () => crypto.randomUUID();\nconst addDays = (d,n) => new Date(Date.parse(d+'T12:00:00Z')+86400000*n).toISOString().slice(0,10);\nconst validDate = d => /^\\d{4}-\\d{2}-\\d{2}$/.test(d) && Number.isFinite(Date.parse(d+'T12:00:00Z')) && addDays(d,0)===d;\nconst monthEnd = m => {const [y,n]=m.split('-').map(Number);return new Date(Date.UTC(y,n,0,12)).toISOString().slice(0,10)};\nfunction *dates(from,to){for(let d=from;d\u003c=to;d=addDays(d,1))yield d}\nconst byDate=(a,b)=>a.date.localeCompare(b.date);\nconst eventTypes=['입사','부서이동','휴직','복직','퇴직'];\nconst esc = v => String(v??'').replace(/[&\u003c>\"']/g,c=>({'&':'&amp;','\u003c':'&lt;','>':'&gt;','\"':'&quot;',\"'\":'&#39;'}[c]));\nfunction requireThat(ok,message){if(!ok)throw Error(message)}\nfunction position(person,date){\n let state={status:'입사 전',dept:'',rank:'',hired:'',last:''};\n for(const e of person.events.slice().sort(byDate)){\n  if(e.date>date)break;\n  if(e.type==='입사'){state={status:'근무',dept:e.dept,rank:e.rank,hired:e.date,last:''}}\n  if(e.type==='부서이동'){state.dept=e.dept;state.rank=e.rank||state.rank}\n  if(e.type==='휴직')state.status='휴직';\n  if(e.type==='복직')state.status='근무';\n  if(e.type==='퇴직'){state.status='퇴직';state.last=e.date}\n }\n return state;\n}\nfunction checkEvents(person){\n let status='입사 전',prev='';\n for(const e of person.events.slice().sort(byDate)){\n  requireThat(validDate(e.date)&&eventTypes.includes(e.type),'발령일과 구분을 확인하세요.');\n  requireThat(prev!==e.date,'같은 직원은 하루에 한 건의 발령을 기록합니다.');\n  const allowed={'입사 전':['입사'],'근무':['부서이동','휴직','퇴직'],'휴직':['부서이동','복직','퇴직'],'퇴직':['입사']};\n  requireThat(allowed[status].includes(e.type),e.date+'의 '+e.type+' 발령을 적용할 수 없습니다. 전후 발령 순서를 확인하세요.');\n  if(['입사','부서이동'].includes(e.type))requireThat(e.dept.trim(),'소속 부서를 입력하세요.');\n  if(e.type!=='부서이동')status=({'입사':'근무','휴직':'휴직','복직':'근무','퇴직':'퇴직'})[e.type];\n  prev=e.date;\n }\n}\nfunction seed(){\n const people=[['AH001','직원 B','채용운영팀','팀장'],['AH002','직원 I','기업지원팀','매니저'],['AH003','직원 F','인사팀','매니저'],['AH004','직원 J','채용운영팀','매니저']].map(([id,name,dept,rank],i)=>({\n  id,name,mail:'',end:i===1?addDays(today(),20):'',events:[{type:'입사',date:'2025-03-04',dept,rank,note:''}],logs:[]\n }));\n people[1].events.push({type:'부서이동',date:'2026-06-01',dept:'채용운영팀',rank:'매니저',note:'예시 이동'});\n people[2].events.push({type:'휴직',date:'2026-10-01',dept:'',rank:'',note:''},{type:'복직',date:'2026-11-02',dept:'',rank:'',note:''});\n people[3].events.push({type:'퇴직',date:'2026-10-16',dept:'',rank:'',note:''});\n const db={rev:0,people,attendance:{},calendar:{},leaves:[],grants:[],certs:[]};\n for(const p of people.slice(0,3))db.grants.push({id:uid(),emp:p.id,type:'연차',date:today().slice(0,4)+'-01-01',qty:8,note:'시범 부여량'});\n let day=addDays(today(),-1);while([0,6].includes(new Date(day+'T12:00:00Z').getUTCDay()))day=addDays(day,-1);\n db.attendance[people[0].id+'|'+day]={arrival:'09:00',departure:'18:00',start:'09:00',end:'18:00',note:''};\n db.attendance[people[1].id+'|'+day]={arrival:'09:18',departure:'18:00',start:'09:00',end:'18:00',note:''};\n return db;\n}\nfunction readDB(){const raw=localStorage.getItem(HR_KEY);return raw?JSON.parse(raw):null}\nfunction currentEmployee(db,id){const p=db.people.find(p=>p.id===id);requireThat(p,'직원을 찾을 수 없습니다.');return p}\nfunction included(s){return s.status==='근무'||s.status==='휴직'}\nfunction workday(db,date){\n if(Object.hasOwn(db.calendar,date))return db.calendar[date].work;\n return ![0,6].includes(new Date(date+'T12:00:00Z').getUTCDay());\n}\nfunction balance(db,emp,type,asof){\n const given=db.grants.filter(g=>g.emp===emp&&g.type===type&&g.date\u003c=asof).reduce((a,g)=>a+g.qty,0);\n const used=db.leaves.filter(l=>l.emp===emp&&l.type===type&&l.status==='승인').reduce((a,l)=>a+l.days.filter(d=>d\u003c=asof).length*l.unit,0);\n return {given,used,left:given-used};\n}\nfunction validateLeave(db,leave){\n const p=currentEmployee(db,leave.emp);\n for(const d of leave.days){\n  requireThat(position(p,d).status==='근무'&&workday(db,d),'근무 예정일에만 휴가를 승인할 수 있습니다.');\n  const same=db.leaves.filter(l=>l.id!==leave.id&&l.emp===p.id&&l.status==='승인'&&l.days.includes(d));\n  requireThat(!same.some(l=>l.part==='종일'||leave.part==='종일'||l.part===leave.part),'이미 승인한 휴가와 시간이 겹칩니다.');\n }\n for(const date of new Set(db.leaves.filter(l=>l.emp===p.id&&l.type===leave.type&&l.status==='승인').flatMap(l=>l.days))){\n  requireThat(balance(db,p.id,leave.type,date).left>=0,date+' 기준 휴가 잔액이 부족합니다.');\n }\n}\nconst mins=t=>{const [h,m]=t.split(':').map(Number);return h*60+m};\nfunction attendanceDay(db,p,date,nowDay=today(),nowTime=clock()){\n const state=position(p,date),r=db.attendance[p.id+'|'+date]||{},issues=[];\n const row={name:p.name,id:p.id,dept:state.dept,date,r,issues,plan:0,worked:0,annual:0,comp:0,status:state.status};\n if(state.status!=='근무')return row;\n const ls=db.leaves.filter(l=>l.emp===p.id&&l.status==='승인'&&l.days.includes(date));\n for(const l of ls)row[l.type==='연차'?'annual':'comp']+=l.unit;\n if(!workday(db,date)){row.status='휴무';if(r.arrival&&r.departure)row.worked=1;return row}\n row.plan=1;\n const parts=ls.map(l=>l.part);\n if(row.annual+row.comp>=1){row.status='휴가';return row}\n const start=r.start||'09:00',end=r.end||'18:00';\n const noonPoint=Math.round((mins(start)+mins(end))/2);\n const cutIn=parts.includes('오전')?noonPoint:mins(start),cutOut=parts.includes('오후')?noonPoint:mins(end);\n const past=date\u003cnowDay,active=date===nowDay;\n if(past||active){\n  if(!r.arrival&&(past||mins(nowTime)>cutIn))issues.push('출근 누락');\n  if(!r.departure&&r.arrival&&(past||mins(nowTime)>cutOut))issues.push('퇴근 누락');\n  if(r.arrival&&mins(r.arrival)>cutIn)issues.push('지각');\n  if(r.departure&&mins(r.departure)\u003ccutOut)issues.push('조퇴');\n }\n row.worked=r.arrival&&r.departure?1:0;\n row.status=issues.length?issues.join(' · '):date>nowDay e if(action==='grant'){\n  openForm('휴가 부여',select('직원','emp',employees())+select('휴가 종류','type',['연차','대체휴가'])+field('부여일','date',asof,'date')+field('부여 일수','qty',1,'number',true,'min=\"0.5\" step=\"0.5\"')+field('부여 사유','note'),(next,v)=>{\n   requireThat(included(position(currentEmployee(next,v.emp),v.date)),'부여일 기준 재직 직원을 선택하세요.');\n   const qty=Number(v.qty);requireThat(qty>0&&Number.isInteger(qty*2),'0.5일 단위의 양수를 입력하세요.');\n   next.grants.push({...v,qty,id:uid()});\n  },'확정된 연차 또는 대체휴가 일수를 등록합니다.');\n }else if(action==='request'){\n  openForm('휴가 신청',select('직원','emp',employees())+select('휴가 종류','type',['연차','대체휴가'])+field('시작일','from',asof,'date')+field('종료일','to',asof,'date')+select('사용 구분','part',['종일','오전','오후'])+field('메모','note','','text',false),(next,v)=>{\n   requireThat(v.from\u003c=v.to&&v.to\u003c=addDays(v.from,366),'시작일부터 1년 이내의 종료일을 선택하세요.');\n   const p=currentEmployee(next,v.emp),days=[...dates(v.from,v.to)].filter(d=>workday(next,d));\n   requireThat(days.length&&days.every(d=>position(p,d).status==='근무'),'기간 중 근무 가능한 날짜를 선택하세요.');\n   next.leaves.push({...v,id:uid(),status:'신청',days,unit:v.part==='종일'?1:.5});\n  },'근무일만 차감하며, 반일은 0.5일입니다. 오전·오후는 해당 직원의 예정 근무시간을 절반으로 나눠 판정합니다.');\n }else if(['approve','reject','cancel'].includes(action)){\n  const l=db.leaves.find(l=>l.id===id);\n  const state=action==='approve'?'승인':action==='reject'?'반려':'승인 취소';\n  openForm('휴가 '+state,'\u003cp>'+esc(currentEmployee(db,l.emp).name+' · '+l.type+' · '+l.from+' ~ '+l.to+' · '+l.days.length*l.unit+'일')+'\u003c/p>',next=>{\n   const req=next.leaves.find(l=>l.id===id);\n   requireThat(req.status===(action==='cancel'?'승인':'신청'),'이미 처리된 신청입니다.');\n   req.status=state;\n   if(action==='approve'){\n    requireThat([...dates(req.from,req.to)].filter(d=>workday(next,d)).join()===req.days.join(),'신청 후 근무 달력이 변경됐습니다. 반려 후 다시 신청하세요.');\n    validateLeave(next,req);\n   }\n  },'',state);\n }\n}\n\nstart();\n})();"]},"attendance":{"styles":"*{box-sizing:border-box}\n#hr{mar ormat('en-GB',{timeZone:'Asia/Seoul',hour:'2-digit',minute:'2-digit'}).format(new Date());\nconst uid = () => crypto.randomUUID();\nconst addDays = (d,n) => new Date(Date.parse(d+'T12:00:00Z')+86400000*n).toISOString().slice(0,10);\nconst validDate = d => /^\\d{4}-\\d{2}-\\d{2}$/.test(d) && Number.isFinite(Date.parse(d+'T12:00:00Z')) && addDays(d,0)===d;\nconst monthEnd = m => {const [y,n]=m.split('-').map(Number);return new Date(Date.UTC(y,n,0,12)).toISOString().slice(0,10)};\nfunction *dates(from,to){for(let d=from;d\u003c=to;d=addDays(d,1))yield d}\nconst byDate=(a,b)=>a.date.localeCompare(b.date);\nconst eventTypes=['입사','부서이동','휴직','복직','퇴직'];\nconst esc = v => String(v??'').replace(/[&\u003c>\"']/g,c=>({'&':'&amp;','\u003c':'&lt;','>':'&gt;','\"':'&quot;',\"'\":'&#39;'}[c]));\nfunction requireThat(ok,message){if(!ok)throw Error(message)}\nfunction position(person,date){\n let state={status:'입사 전',dept:'',rank:'',hired:'',last:''};\n for(const e of person.events.slice().sort(byDate)){\n  if(e.date>date)break;\n  if(e.type==='입사'){state={status:'근무',dept:e.dept,rank:e.rank,hired:e.date,last:''}}\n  if(e.type==='부서이동'){state.dept=e.dept;state.rank=e.rank||state.rank}\n  if(e.type==='휴직')state.status='휴직';\n  if(e.type==='복직')state.status='근무';\n  if(e.type==='퇴직'){state.status='퇴직';state.last=e.date}\n }\n return state;\n}\nfunction checkEvents(person){\n let status='입사 전',prev='';\n for(const e of person.events.slice().sort(byDate)){\n  requireThat(validDate(e.date)&&eventTypes.includes(e.type),'발령일과 구분을 확인하세요.');\n  requireThat(prev!==e.date,'같은 직원은 하루에 한 건의 발령을 기록합니다.');\n  const allowed={'입사 전':['입사'],'근무':['부서이동','휴직','퇴직'],'휴직':['부서이동','복직','퇴직'],'퇴직':['입사']};\n  requireThat(allowed[status].includes(e.type),e.date+'의 '+e.type+' 발령을 적용할 수 없습니다. 전후 발령 순서를 확인하세요.');\n  if(['입사','부서이동'].includes(e.type))requireThat(e.dept.trim(),'소속 부서를 입력하세요.');\n  if(e.type!=='부서이동')status=({'입사':'근무','휴직':'휴직','복직':'근무','퇴직':'퇴직'})[e.type];\n  prev=e.date;\n }\n}\nfunction s 적응성\",\n      \"협상 및 교섭력\"\n    ]\n  },\n  \"안전관리\": {\n    \"context\": \"위험성평가·작업허가·안전점검·위험 보고·개선조치\",\n    \"competencies\": [\n      \"규정 및 업무지식\",\n      \"예측력\",\n      \"의사소통\",\n      \"공정지식\"\n    ]\n  },\n  \"공무\": {\n    \"context\": \"설비 진단·예방보전·유틸리티·정비 외주\",\n    \"competencies\": [\n      \"규정 및 업무지식\",\n      \"외주관리\",\n      \"전문지식/기술\",\n      \"공정지식\"\n    ]\n  },\n  \"법무\": {\n    \"context\": \"장비공급·외주 계약, 채권·분쟁 및 준법 검토\",\n    \"competencies\": [\n      \"분석적사고\",\n      \"협상 및 교섭력\",\n      \"이익중심사고\",\n      \"전략적 기획\"\n    ]\n  },\n  \"회계관리\": {\n    \"context\": \"회계처리·결산·세무·프로젝트 원가 및 증빙\",\n    \"competencies\": [\n      \"규정 및 업무지식\",\n      \"문제해결능력\",\n      \"신의성실\",\n      \"전문지식/기술\"\n    ]\n  },\n  \"자금관리\": {\n    \"context\": \"자금수지·지급·회수·환위험 및 유동성\",\n    \"competencies\": [\n      \"규정 및 업무지식\",\n      \"문제해결능력\",\n      \"신의성실\",\n      \"정보수집 및 분석\"\n    ]\n  },\n  \"구매\": {\n    \"context\": \"도면·구매사양·견적비교·공급업체 선정·구매조건\",\n    \"competencies\": [\n      \"신의성실\",\n      \"협상 및 교섭력\",\n      \"이익중심사고\",\n      \"제품지식\"\n    ]\n  },\n  \"조달\": {\n    \"context\": \"프로젝트 부품 소요·외주 제작 진도·납기·공급 차질\",\n    \"competencies\": [\n      \"외주관리\",\n      \"협상 및 교섭력\",\n      \"전략적 기획\",\n      \"공정지식\"\n    ]\n  },\n  \"자재관리\": {\n    \"context\": \"입출고·재고·식별·보존·추적성·부족자재\",\n    \"competencies\": [\n      \"규정 및 업무지식\",\n      \"신의성실\",\n      \"외주관리\",\n      \"제품지식\"\n    ]\n  },\n  \"영업기획\": {\n    \"context\": \"배터리·믹싱 장비 시장·수주 전망·경쟁정보\",\n    \"competencies\": [\n      \"경영환경의 이해\",\n      \"문제해결능력\",\n      \"분석적사고\",\n      \"시장의 이해\"\n    ]\n  },\n  \"영업관리\": {\n    \"context\": \"수주·계약·변경·고객 요청·출하·매출·채권\",\n    \"competencies\": [\n      \"고객관리\",\n      \"규정 및 업무지식\",\n      \"외국어능력\",\n      \"외주관리\"\n    ]\n  },\n  \"영업\": {\n    \"context\": \"고객 공정 요구·장비 제안·견적·기술 및 계약 협의\",\n    \"competencies\": [\n      \"경영환경의 이해\",\n      \"고객관리\",\n      \"시장의 이해\",\n      \"예측력\"\n    ]\n  },\n  \"Project Management\": {\n    \"context\": \"설치 프로젝트의 일정·원가·범위·변경·위험·고객 조율\",\n    \"competencies\": [\n      \"고객관리\",\n      \"규정 및 업무지식\",\n      \"문제해결능력\",\n      \"의사소통\",\n      \"전문지식/기술\"\n    ]\n  },\n  \"Construction Management\": {\n    \"context\": \"장비 반입·설치 공정·협력업체·안전·시운전·검수·인계\",\n    \"competencies\": [\n      \"신의성실\",\n      \"의사소통\",\n      \"공정지식\",\n      \"제품지식\"\n    ]\n  },\n  \"도비\": {\n    \"context\": \"중량·무게중심·반입 경로·양중계획·달기구·안착\",\n    \"competencies\": [\n      \"문제해결능력\",\n      \"신의성실\",\n      \"공정지식\",\n      \"제품지식\"\n    ]\n  },\n  \"프로그래밍\": {\n    \"context\": \"PLC·HMI·인터록·통신·백업·시운전 및 오류 진단\",\n    \"competencies\": [\n      \"문제해결능력\",\n      \"업무수준관리\",\n      \"전문지식/기술\",\n      \"공정지식\"\n    ]\n  },\n  \"전장설계·설치\": {\n    \"context\": \"전기도면·부품 용량·제어반·배선·결선·전기 점검; 실제 담당 범위를 사전 지정\",\n    \"competencies\": [\n      \"외주관리\",\n      \"의사소통\",\n      \"전문지식/기술\",\n      \"공정지식\"\n    ]\n  },\n  \"기계설계\": {\n    \"context\": \"기구·구조·공차·제작성·BOM·설계변경\",\n    \"competencies\": [\n      \"분석적사고\",\n      \"전문지식/기술\",\n      \"정보수집 및 분석\",\n      \"공정지식\",\n      \"제품지식\"\n    ]\n  },\n  \"Process Design\": {\n    \"context\": \"믹싱 공정 요구·공정도·용량·장비 사양·성능 검증\",\n    \"competencies\": [\n      \"문제해결능력\",\n      \"외국어능력\",\n      \"의사소통\",\n      \"공정지식\"\n    ]\n  },\n  \"공정관리\": {\n    \"context\": \"제작·조립 일정·부하·진도·병목·공정 간 인수인계\",\n    \"competencies\": [\n      \"규정 및 업무지식\",\n      \"외주관리\",\n      \"공정지식\",\n      \"제품지식\"\n    ]\n  },\n  \"출하관리\": {\n    \"context\": \"완성도 점검·포장·보존·상차·운송·출하서류\",\n    \"competencies\": [\n      \"규정 및 업무지식\",\n      \"업무수준관리\",\n      \"공정지식\",\n      \"제품지식\"\n    ]\n  },\n  \"생산지원\": {\n    \"context\": \"작업 준비·공구·치공구·자재 공급·현장 지원\",\n    \"competencies\": [\n      \"규정 및 업무지식\",\n      \"업무수준관리\",\n      \"전문지식/기술\",\n      \"공정지식\"\n    ]\n  },\n  \"조립\": {\n    \"context\": \"도면·공차·정렬·체결·측정·자주검사\",\n    \"competencies\": [\n      \"규정 및 업무지식\",\n      \"문제해결능력\",\n      \"전문지식/기술\",\n      \"제품지식\"\n    ]\n  },\n  \"용접\": {\n    \"context\": \"도면·용접절차·조건·변형·결함 예방·검사 및 보수\",\n    \"competencies\": [\n      \"규정 및 업무지식\",\n      \"문제해결능력\",\n      \"전문지식/기술\",\n      \"제품지식\"\n    ]\n  },\n  \"제관\": {\n    \"context\": \"전개·취부·치수·형상·변형 교정·제작 순서\",\n    \"competencies\": [\n      \"규정 및 업무지식\",\n      \"문제해결능력\",\n      \"전문지식/기술\",\n      \"제품지식\"\n    ]\n  },\n  \"선반\": {\n    \"context\": \"도면·공차·공구·가공조건·치수·표면품질\",\n    \"competencies\": [\n      \"규정 및 업무지식\",\n      \"문제해결능력\",\n      \"전문지식/기술\",\n      \"제품지식\"\n    ]\n  },\n  \"품질보증\": {\n    \"context\": \"품질체계·심사·고객 요구·시정조치·추적성\",\n    \"competencies\": [\n      \"규정 및 업무지식\",\n      \"분석적사고\",\n      \"전문지식/기술\",\n      \"제품지식\"\n    ]\n  },\n  \"품질관리·검사\": {\n    \"context\": \"검사기준·측정기·검사·부적합 판정·검사기록\",\n    \"competencies\": [\n      \"규정 및 업무지식\",\n      \"분석적사고\",\n      \"전문지식/기술\",\n      \"제품지식\"\n    ]\n  }\n};\nfunction probationCriteria(role, level) {\n  const model = probationRoles[role];\n  const tasks = {\n    '조립': ['작업표준서와 도면에 따라 배정된 공정을 수행한다.', '작업 전 안전사항과 작업 후 검사 항목을 확인하고 이상을 보고한다.'],\n    '기계설계': ['요구사항과 검토 의견을 반영해 담당 도면을 수정한다.', '치수·공차·부품 간 간섭을 점검하고 수정 이력을 남긴다.'],\n    'Construction Management': ['담당 설치 구간의 일정과 협력사 작업 현황을 관리한다.', '공정 지연과 현장 변경을 파악해 영향과 필요한 조치를 보고한다.']\n  };\n  const work = tasks[role] || [model.context+' 업무에서 배정된 과업을 수행하고 결과를 제출한다.', model.context+' 업무의 기준과 결과물을 대조하고, 발견한 오류와 위험에 대응한다.'];\n  const scope = {L1:'정해진 절차와 검토 의견에 따라 수행한다.', L2:'담당 과업을 독립적으로 수행하고 예외 상황을 보고한다.', L3:'담당 범위의 변경 영향을 검토하고 관련 부서와 조율한다.', L4:'여러 과업의 기준을 정하고 구성원의 수행 결과를 검증한다.'}[level];\n  return [\n    ['업무 이해와 실행','목적·기한·완료 기준을 확인하고 합의한 범위의 업무를 기한에 맞춰 수행한다.'],\n    ['협업과 보고','진행 상황을 공유하고 지연이나 오류가 예상되면 조치할 수 있는 시점에 알린다.'],\n    ['피드백 반영','지도받은 내용을 다음 업무에 적용하고 이전 문제가 개선됐는지 확인한다.'],\n    ['핵심과업 수행',work[0]+' '+scope], ['품질·위험 관리',work[1]+' '+scope]\n  ].map(([name,behavior],i)=>({name,behavior,group:i\u003c3?'공통':'직무'}));\n}\n\nconst probationRatings=['기대 이상','기대 충족','개선 필요','관찰 기회 없음'];\nconst probationLevels={L1:'사원',L2:'선임',L3: '면담 기록 없음'),count,missed};\n}\n\nconst supportSurvey=['편하게 질문하거나 고민을 이야기할 수 있었는지','Buddy가 내 이야기를 듣고 필요한 지원을 해 주었는지','동료와 관계를 맺고 팀에 적응하는 데 도움이 됐는지'];\nconst earlierMentorSurvey=['질문하기 편했는지','답변이 도움이 됐는지','요청 후 필요한 지원을 받았는지'];\n\nconst openingAgenda=[\n ['company','회사 안내','인사팀','회사와 조직, 근무 안내와 첫날 일정을 안내합니다.'],\n ['safety','안전관리·채용 시 안전보건교육','인사팀','교육을 진행하고 실시일, 교육자, 교육시간과 내용을 기록합니다.'],\n ['handoff','소속팀 인계','인사팀·소속팀','인사팀이 입사자를 소속팀에 인계하고 인수 담당자를 확인합니다.'],\n ['team','팀원 소개','소속팀','함께 일할 팀원과 각자의 역할을 소개합니다.'],\n ['career','Leader 커리어 면담','Leader','입사자의 경험과 관심 업무, 앞으로의 성장 방향을 이야기합니다.'],\n ['cross','타팀 인사','소속팀','업무상 자주 협업할 팀을 방문해 인사하고 연락 창구를 확인합니다.']\n];\nfunction ojtWeek(start,day){return Math.floor((Date.parse(day)-Date.parse(start))/604800000)+1}\nfunction weekDay(start,week,offset=0){const d=new Date(start+'T00:00:00Z');d.setUTCDate(d.getUTCDate()+7*(week-1)+offset);return d.toISOString().slice(0,10)}\nfunction officialScheduleTable(){\n return '\u003cdiv class=\"tablewrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>순서\u003c/th>\u003cth>공식 일정\u003c/th>\u003cth>주관\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>'+openingAgenda.map(([,title,owner],i)=>'\u003ctr>\u003ctd>'+(i+1)+'\u003c/td>\u003ctd>'+title+'\u003c/td>\u003ctd>'+owner+'\u003c/td>\u003c/tr>').join('')+'\u003c/tbody>\u003c/table>\u003c/div>';\n}\n\nfunction programOverview(){\n return '\u003csection class=\"panel\">\u003ch2>입사 첫날 공식 일정\u003c/h2>'+officialScheduleTable()+'\u003c/section>\u003csection class=\"panel\">\u003ch2>주차별 OJT 계획\u003c/h2>\u003cp class=\"sub\">입사일부터 7일 단위로 학습 목표를 정하고, 교육 항목별로 예정일과 담당자를 지정합니다.\u003c/p>\u003cdl class=\"milestones\">'+[1,2,3,4].map(w=>'\u003cdiv>\u003cdt>'+w+'주차\u003c/dt>\u003cdd>입사 '+((w-1)*7+1)+'~'+(w*7)+'일차\u003c/dd>\u003c/div>').join('')+'\u003c/dl>\u003c/section>';\n}\n\nfunction scheduleEvents(r){\n const events=[];\n const add=(when,title,owner,status,tab,group,time='')=>{\n  if(when)events.push({day:when.slice(0,10),time:time||when.slice(11,16),title,owner,status,tab,group});\n };\n for(const t of r.prep||[])add(weekDay(r.start,1,-t.offset),t.title,t.assignee,t.status,'prep','준비');\n const limited=r.roles?.every(k=>['prep','trainer'].includes(k));\n if(!limited){\n  for(const [key,title,owner] of openingAgenda){\n   const item=key==='team'?r.intro:key==='safety'?r.hireSafety:r.openingRecords?.[key];\n   add(item?.when||item?.day||r.start,title,item?.by||item?.trainer||(key==='career'?r.lead:owner),\n    item?.status||(key==='safety'&&item?'진행 완료':'예정'),key==='safety'?'safety':'guide','첫날');\n  }\n }\n if(!limited){\n  const weeks=new Set([1,2,3,4,...Object.keys(r.weekGoals||{}).map(Number)]);\n  for(const week of weeks)add(weekDay(r.start,week),week+'주차 OJT 계획',r.lead,r.weekGoals?.[week]?'목표 등록':'주차 시작','ojt','OJT');\n }\n if(r.mentoringGoal?.day)add(r.mentoringGoal.day,'Buddy 활동 목표',r.mentor,r.mentoringGoal.state||'목표일','journey','Buddy');\n for(const task of r.mentoringProjects||[])if(task.agreedBy)add(task.due,task.title,r.mentor,'과제 기한','project','Buddy');\n for(const p of r.plans||[])add(p.day,p.task,p.trainer,p.state==='미입력'?'예정':p.state,'ojt','OJT');\n for(const m of r.mentorPast||[])add(m.held,'Buddy 정기 면담',m.mentor||r.mentor,'진행 완료','mentorMeet','면담');\n for(const m of r.meetings||[])add(m.day,'Leader 정기 면담',m.lead||r.lead,'진행 완료','meet','면담',m.day===m.scheduled?m.time:'');\n if(!r.closed){\n  if(r.mentorRound)add(r.mentorRound.day,'Buddy 정기 면담',r.mentor,'예정','mentorMeet','면담',r.mentorRound.time);\n  if(r.schedule)add(r.schedule.day,'Leader 정기 면담',r.lead,'예정','meet','면담',r.schedule.time);\n }\n if(!limited&&(!r.roles||r.roles.some(k=>['employee','lead','admin'].includes(k)))){\n  const p=r.probation;\n  add(monthShift(r.start,1),'집중 온보딩 종료 목표',r.name,r.focusFinished?'완료':'목표일','journey','온보딩');\n  if(p){\n   add(p.midDue,'수습 중간면담 기한',r.lead,p.mid?'완료':'기한','probation','평가');\n   add(p.due,'Leader 수습평가 기한',r.lead,p.ratings?'완료':'기한','probation','평가');\n  }\n  add(p?.end||monthShift(r.start,3),'수습 종료'+(p?'':' 목표'),'인사담당자',p?.decision?'완료':p?'종료일':'목표일','probation','평가');\n }\n return events;\n}\n\nfunction calendarTabs(roles){const has=k=>roles.includes(k);const ids=roles.every(k=>['prep','trainer'].includes(k))?[...(has('prep')?['prep']:[]),...(has('trainer')?['ojt']:[])]:['journey','guide','safety','ojt','q'];if((has('admin')||has('prep'))&&!ids.includes('prep'))ids.splice(1,0,'prep');if(has('employee')||has('admin'))ids.push('hrTalk');if(has('mentor')||has('employee'))ids.push('mentorMeet','project');if(has('employee')||has('lead'))ids.push('meet');if(has('employee'))ids.push('review','docs');if(has('lead')||has('employee')||has('admin'))ids.push('probation');if(has('admin'))ids.push('manage');return ['agenda',...ids]}\n\nfunction journeyDates(r){\n const dates=probationDates(r.probation?.end||monthShift(r.start,3));\n return panel('입사 후 일정','\u003cdl class=\"milestones\">'+[\n ['집중 온보딩 · 1개월',monthShift(r.start,1)+(r.focusFinished?' · 완료':' · 목표일')],\n ['수습 중간면담',dates.midDue],['수습평가 기한',dates.due],['수습 종료 예정',dates.end]\n ].map(([label,value])=>'\u003cdiv>\u003cdt>'+e(label)+'\u003c/dt>\u003cdd>'+e(value)+'\u003c/dd>\u003c/div>').join('')+'\u003c/dl>');\n}\nlet linkedPlan='';\nconst jump=(id,label,extra='')=>`\u003cbutton type=\"button\" data-cmd=\"tab\" data-id=\"${id}\" ${extra}>${e(label)}\u003c/button>`;\nfunction journey(){const r=record,goal=r.mentoringGoal,canMentor=role('mentor')||role('employee');const pending=r.questions.filter(q=>q.status!=='조치 완료'),done=r.plans.filter(p=>p.state==='실시').length;const next=r.plans.filter(p=>p.state!=='실시').sort((a,b)=>a.day.localeCompare(b.day))[0];const last=r.meetings?.[0];return pathways(r,canMentor)+journeyDates(r)+`\u003cdiv class=\"grid\">${panel('함께하는 사람',`\u003cdiv class=\"row\">\u003cb>${e(r.mentor)} Buddy\u003c/b>\u003cp class=\"sub\">첫 달의 고민을 듣고 동료와 관계를 맺도록 지원\u003c/p>\u003c/div>\u003cdiv class=\"row\">\u003cb>${e(r.lead)} Leader\u003c/b>\u003cp class=\"sub\">업무 우선순위와 정기 면담\u003c/p>\u003c/div>\u003cdiv class=\"actions\">${jump('q','질문·요청 '+pending.length+'건 확인')}${role('employee')?jump('hrTalk','인사담당자와 대화'):''}\u003c/div>`)}${panel('이번 온보딩 일정',`\u003cdiv class=\"row\">\u003cb>다음 OJT\u003c/b>\u003cp>${next?e(next.day)+' · '+e(next.task):'예정된 교육 없음'}\u003c/p>\u003csmall>실시 완료 ${done} / ${r.plans.length}건\u003c/small>\u003c/div>\u003cdiv class=\"row\">\u003cb>Leader 정기 미팅\u003c/b>\u003cp>${r.schedule?e(r.schedule.day)+' · '+e(r.schedule.time):'공유된 일정 없음'}\u003c/p>\u003c/div>\u003cdiv class=\"actions\">${jump('ojt','OJT 보기')}${(role('lead')||role('employee'))?jump('meet','미팅 보기'):''}\u003c/div>`)}\u003c/div>`\n+(canMentor?panel('Buddy와 함께 정한 목표',(goal?`\u003cdiv class=\"mutedbox\">\u003cb>${e(goal.goal)}\u003c/b>\u003cp>${e(goal.progress)}\u003c/p>\u003csmall>다음 확인일 ${e(goal.day)} · ${e(goal.state)}\u003c/small>\u003c/div>`:quiet('첫 달에 어떤 도움을 받고 싶은지 이야기하고 다음 확인일을 정해 주세요.'))+(open()?details(goal?'목표·진행 기록 수정':'Buddy 활동 목표 등록',form('mentorGoal',area('적응 목표','goal',goal?.goal)+field('다음 확인일','day','date',goal?.day||today())+select('상태','state',['진행 중','달성'],goal?.state)+area('함께 해 본 일·다음 지원 (선택)','progress',goal?.progress,false),'저장')):'')):'')\n+(canMentor?panel('Buddy 정기 면담',quiet(r.mentorRound?e(r.mentorRound.day+' · '+r.mentorRound.time+' · '+r.mentorRound.freq):'일정 미정')+jump('mentorMeet','면담 일정·기록 보기')):'')+panel('진행 중인 질문·요청',pending.length?pending.slice(0,6).map(q=>`\u003cdiv class=\"row\">\u003cb>${e(q.body)}\u003c/b>\u003cp class=\"sub\">${nameRole(q.to)} ${e(r[q.to])} · ${e(q.status)}${q.plan?' · '+e(r.plans.find(p=>p.id===q.plan)?.task||''):''}\u003c/p>\u003c/div>`).join('')+jump('q','조치 내역 보기'):quiet('남은 질문·요청이 없습니다.'))+(last?.follow?panel('지난 Leader 미팅에서 약속한 일',`\u003cp class=\"note\">${e(last.follow)}\u003c/p>`):'')}\nfunction ojtLinks(p){const list=record.questions.filter(q=>q.plan===p.id);return (list.length?`\u003cdiv class=\"mutedbox\">\u003cb>연결된 질문·요청\u003c/b>${list.map(q=>`\u003cp>${e(q.body)} · ${e(q.status)}${q.history.length?' · '+e(q.history.at(-1).note):''}\u003c/p> in(''))}\n\n\nfunction firstDayProgram(r){\n return '\u003ch3 class=\"day-one\">입사 첫날 공식 일정\u003c/h3>\u003col class=\"opening-agenda\">'+openingAgenda.map(([key,title,owner,description])=>{\n  const v=key==='team'?r.intro:r.openingRecords?.[key],safety=key==='safety';\n  const status=safety?(r.hireSafety?'진행 완료':'예정'):(v?.status||'예정');\n  const meta=v?[v.when?.replace('T',' '),v.by,v.receiver&&'인수 '+v.receiver,v.note].filter(Boolean).map(e).join(' · '):'';\n  const canEdit=open()&&(role('admin')||role('lead'));\n  const edit=safety?jump('safety','안전보건교육 기록'):key==='team'?introPanel(r):canEdit?details('일정·실시 기록',form('openingRecord',hide('stage',key)+select('진행 여부','status',introStates,status)+field('예정 또는 실제 일시','when','datetime-local',v?.when,false)+field('진행자','by','text',v?.by,false)+(key==='handoff'?field('인수 담당자','receiver','text',v?.receiver,false):'')+area('내용 (선택)','note',v?.note,false),'저장')):'';\n  return '\u003cli>\u003cstrong>'+e(title)+'\u003c/strong> '+chip(status,status==='진행 완료')+'\u003cp class=\"sub\">'+e(owner)+' · '+e(description)+'\u003c/p>'+(meta&&key!=='team'?'\u003cp>'+meta+'\u003c/p>':'')+edit+'\u003c/li>';\n }).join('')+'\u003c/ol>';\n}\nfunction firstDayPlanForm(r){\n const missing=firstDayCourses.filter(c=>!r.plans.some(t=>t.firstDay===c.key||t.task===c.title&&t.day===r.start));\n if(!missing.length)return quiet('회사 소개 교육이 OJT 계획에 있습니다.');\n return details('회사 소개 교육을 OJT 계획에 담기',form('firstDayPlan',missing.map(c=>field(c.title+' 담당자',c.key)).join(''),'입사일 교육 계획 등록'));\n}\nfunction guideSearchItems(items){const cases=items.map(item=>['우수 멘토링 사례','우수 버디 활동 사례'].includes(item.category)?{...item,category:'우수 Buddy 활동 사례',body:item.body.replace(/\\n\\n(?:멘토링|버디) 활동\\n/,'\\n\\nBuddy 활동\\n')}:item);return [...cases,...(globalThis.mentorHandbook||[])]}\nlet guideData,guideQuery='',guideCategory='',guideEdit='',guideBusy=false;\nconst guideCategories=['우수 Buddy 활동 사례','회사 소개','첫 출근','인사·복지','근무·휴가','식사·교통','업무 안내','기타'];\nfunction guideForm(item={ :'2-digit',minute:'2-digit'});\nlet record,people=[],tab='agenda',overview='agenda',query='',year=today().slice(0,4),timer;\nconst chip=(s,ok=false)=>`\u003cspan class=\"pill ${ok?'complete':''}\">${e(s)}\u003c/span>`;\nfunction msg(s){const m=document.querySelector('#message');m.textContent=s;m.hidden=false;clearTimeout(timer);timer=setTimeout(()=>m.hidden=true,5200)}\nasync function api(path,options){const r=await fetch(path,options);let d;try{d=await r.json()}catch{throw Error('서버에 연결하지 못했습니다. 새로고침해 주세요.')}if(!r.ok)throw Object.assign(Error(d.message||'요청을 처리하지 못했습니다.'),{status:r.status});return d}\nconst request=(method,data)=>({method,headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});\nconst role=k=>record.roles.includes(k),open=()=>!record.closed;\nconst nameRole=k=>({mentor:'Buddy',lead:'Leader',admin:'인사담당자'})[k];\nconst field=(title,name,type='text',val='',required=true)=>`\u003clabel>${title}\u003cinput type=\"${type}\" name=\"${name}\" value=\"${e(val)}\" ${required?'required':''}>\u003c/label>`;\nconst area=(title,name,val='',required=true)=>`\u003clabel class=\"wide\">${title}\u003ctextarea name=\"${name}\" ${required?'required':''}>${e(val)}\u003c/textarea>\u003c/label>`;\nconst select=(title,name,opts,current='')=>`\u003clabel>${title}\u003cselect required name=\"${name}\">${opts.map(v=>{const [key,text]=Array.isArray(v)?v:[v,v];return `\u003coption value=\"${e(key)}\" ${key===current?'selected':''}>${e(text)}\u003c/option>`}).join('')}\u003c/select>\u003c/label>`;\nconst hide=(name,v)=>`\u003cinput type=\"hidden\" name=\"${name}\" value=\"${e(v)}\">`;\nconst form=(act,fields,button)=>`\u003cform data-action=\"${act}\">\u003cdiv class=\"gridform\">${fields}\u003c/div>\u003cbutton class=\"primary\">${button}\u003c/button>\u003c/form>`;\nconst panel=(title,contents)=>`\u003csection class=\"panel\">\u003ch2>${title}\u003c/h2>${contents}\u003c/section>`;\nconst btn=(cmd,title,cls='')=>`\u003cbutton type=\"button\" class=\"${cls}\" da ass=\"actions\">\u003cbutton type=\"button\" data-idea=\"generate\">기기 AI로 후보 만들기\u003c/button>\u003cbutton type=\"button\" data-idea=\"prompt\">ChatGPT용 질문 만들기\u003c/button>\u003c/div>\u003cdiv id=\"idea-result\" aria-live=\"polite\">\u003c/div>\u003c/details>';\n}\nfunction ideaPrompt(box){\n return '신입사원과 Buddy가 첫 달에 함께 실천할 정서적 지원 활동 3개를 한국어로 제안해 주세요. 소속감, 관계 형성, 편하게 질문하기, 조직 적응에 초점을 두세요. 직무교육과 업무성과 평가는 제외하세요. 각 후보에 활동명, 두 사람이 확인할 수 있는 간단한 실천 기준, 선택적으로 남길 활동 자료를 제시하세요. 사적인 고민의 공개는 요구하지 마세요. 회사 지원비가 필요한지는 선택 사항입니다. 적응 주제: '+box.querySelector('[name=ideaContext]').value+'. 원하는 지원: '+box.querySelector('[name=ideaGoal]').value;\n}\ndocument.addEventListener('click',async ev=>{\n const pick=ev.target.closest('[data-starter]');if(pick){const choice=starterIdeas[Number(pick.dataset.starter)],f=app.querySelector('form[data-action=\"projectPropose\"]');if(f&&choice){f.elements.title.value=choice[0];f.elements.criterion.value=choice[1];f.elements.title.focus()}return}\n const btn=ev.target.closest('[data-idea]');if(!btn)return;\n const box=btn.closest('#idea-panel'),out=box.querySelector('#idea-result'),prompt=ideaPrompt(box);\n const handoff=()=>{out.innerHTML='\u003clabel>ChatGPT에 입력할 질문\u003ctextarea readonly>'+e(prompt)+'\u003c/textarea>\u003c/label>\u003cdiv class=\"actions\">\u003cbutton type=\"button\" data-idea=\"copy\">질문 복사\u003c/button>\u003ca class=\"button\" href=\"https://chatgpt.com/\" target=\"_blank\" rel=\"noopener noreferrer\">ChatGPT 열기\u003c/a>\u003c/div>\u003cp class=\"sub\">마음에 드는 후보를 아래 제안란에 적어 상대와 검토하세요.\u003c/p>'};\n if(btn.dataset.idea==='copy'){try{await navigator.clipboard.writeText(out.querySelector('textarea').value);msg('질문을 복사했습니다.')}catch{out.querySelector('textarea').select()}return}\n if(btn.dataset.idea==='prompt'){handoff();return}\n const model=globalThis.LanguageModel,opts={expectedInputs:[{type:'text',languages:['ko']}],expectedOutputs:[{type:'text',languages:['ko']}]};\n let session;btn.disabled=true;out.textContent='과제 후보를 준비하고 있습 ,'monitor','journey'],\n ['Buddy 활동','Buddy 과제와 회사 지원비는 어떻게 신청하나요?','Buddy 과제·지원비에서 후보를 제안하고 상대가 선정합니다. 과제별 결과와 자료를 제출하고 회사 지원비를 신청할 수 있습니다.','AI 과제 달성 결과물 비용 승인 신청 증빙','monitor','project'],\n ['Buddy 활동','Buddy와 정기 면담한 내용은 어디에 남기나요?','Buddy 정기 면담에서 반복 일정을 정하고 입사자와 Buddy가 같은 회차에 각자 기록을 남깁니다. 지난 회차의 기록도 이어서 확인할 수 있습니다.','Buddy 상담 미팅 회의록 면담일지 정기면담','monitor','mentorMeet'],\n ['입사자 인사','소속팀에서 입사자 인사를 진행했나요?','개인별 첫 출근 안내장에서 인사 진행 여부, 일시와 진행자를 확인하세요. 인사담당자와 Leader가 기록할 수 있습니다.','신입사원 소개 팀인사 미진행 진행자 담당자 일시','monitor','guide'],\n ['법정교육','채용 시 안전보건교육은 어디에 기록하나요?','입사자별 법정 안전보건교육에서 실시일, 교육자, 실제 교육시간과 교육 내용을 기록합니다.','안전교육 채용시 법정의무 교육 이수 산업안전','monitor','safety'],\n ['첫 출근','입사 첫날에는 무엇을 하나요?','첫 출근 안내장에서 회사 안내와 채용 시 안전보건교육을 받고 소속팀으로 인계됩니다. 팀원 소개, Leader 커리어 면담, 타팀 인사 순서로 진행합니다.','입사당일 첫날 오리엔테이션 안전교육 회사교육 팀소개','guide','guide'],\n ['수습평가','최종 수습평가는 어디에서 하나요?','입사자 화면에서 최종 수습평가를 여세요. 중간면담 후 입사자가 항목별 실적을 제출하고 평가자가 최종 평가를 완료합니다.','수습 종료 실적 제출 최종평가 크루 CREW 연장 중간면담','monitor','probation'],\n ['전체 진행 현황','기한이 지난 입사자는 어떻게 보나요?','전체 진행 현황에서 조회 조건을 ‘기한 경과’로 선택하세요. 입사자별 다음 할 일과 담당자를 확인하고 해당 항목을 누르면 상세 화면이 열립니다.','지연 마감 지난 지났 모니터링 일괄 현황','monitor',''],\n ['입사 준비','입사일이 정해지면 누구에게 알림이 가나요?','인사담당자가 준비 설정에 항목, 담당자 이메일, 기한을 등록합니다. 새 입사자의 입사일을 저장하면 담당자의 내 입사 일정에 준비 항목이 표시됩니다.','입사예정일 통보 알림 체크리스트 준비물 출입증 전산 장비','status','prep'],\n ['OJT','OJT 결과는 어디에 입력하나요?','입사자 상세의 OJT 계획·결과에서 교육 항목을 열고 ‘실시 여부·내용·결과 입력’을 선택합니다. 교육을 못 한 경우에는 미실시 사유를 남깁니다.','교육 훈련 실습 실시여부 실시여부와 실적 결과 작성 등록','monitor','ojt'],\n ['OJT','입사자의 OJT 계획은 누가 제출하나요?','Leader가 입사일 기준 주차별 학습 목표를 정하고 해당 주차에 교육 항목, 예정일과 담당자를 등록합니다. 교육이 끝나면 같은 항목에 실제 실시 내용과 결과를 기록합니다.','교육계획서 직무교육 일정 계획 제출','monitor','ojt'],\n ['Buddy 활동','Buddy나 Leader에게 요청한 일의 처리 상태는 어디서 보나요?','질문·요청에서 받을 사람을 지정합니다. 입사자는 답변과 조치 기록을 확인하고, 완료된 건도 추가 지원이 필요하면 다시 요청할 수 있습니다.','질의 문의 도움 답변 미처리 재요청 Buddy 활동','monitor','q'],\n ['Leader 미팅','정기 면담 일정을 어떻게 잡나요?','Leader 미팅에서 첫 미팅일, 시간, 반복 주기를 정합니다. 면담 내용과 다음에 할 일을 기록하면 다음 회차가 생성됩니다.','정기미팅 정기면담 주간 격주 매월 회의','monitor','meet'],\n [' journey'});\n  const allowed=record?record.roles.includes('admin')||record.roles.includes('prep'):true;\n  if(allowed)for(const t of p.prep||[])items.push({kind:'입사 준비',title:p.name+' · '+t.title,body:[t.assignee,t.status,t.due].filter(Boolean).join(' · '),person:p.id,tab:'prep'});\n }\n if(record){\n  for(const t of record.plans||[])items.push({kind:'OJT 기록',title:t.task,body:[t.trainer,t.day,t.state,t.actual,t.outcome].filter(Boolean).join(' · '),person:record.id,tab:'ojt'});\n  for(const t of record.questions||[])items.push({kind:'질문·조치 기록',title:t.body,body:[t.status,...t.history.map(h=>h.note)].join(' · '),person:record.id,tab:t.to==='admin'?'hrTalk':'q'});\n  for(const t of record.meetings||[])items.push({kind:'면담 기록',title:t.day+' Leader 미팅',body:[t.note,t.follow].filter(Boolean).join(' · '),person:record.id,tab:'meet'});\n }\n return items;\n}\nlet displayedSearchItems=[];\nfunction renderSearch(){\n const value=searchBox.value.trim(),terms=searchTokens(value);\n if(!value){searchHits.hidden=true;return}\n displayedSearchItems=searchItems().map(i=>({i,score:relevance(i,terms)})).filter(x=>x.score>0).sort((a,b)=>b.score-a.score).map(x=>x.i);\n const content=displayedSearchItems.map((item,index)=>{\n  const direct=item.person||item.doc||(!record&&(item.home==='guide'||item.home==='award'||item.home==='status'||!item.tab))||(record&&item.tab&&document.querySelector('button[data-cmd=\"tab\"][data-id=\"'+item.tab+'\"]'));\n  const label=item.doc?'자료 보기':item.person?'상세 보기':direct?'관련 화면 열기':'입사자 선택';\n  const canNavigate=direct||!record&&people.length;\n  return '\u003carticle class=\"row\">'+chip(item.kind)+'\u003ch3>'+e(item.title)+'\u003c/h3>\u003cp>'+e(item.body)+'\u003c/p>'+(canNavigate?'\u003cbutton type=\"button\" data-search-hit=\"'+index+'\">'+label+'\u003c/button>':'')+'\u003c/article>';\n }).join('');\n searchHits.hidden=false;searchHits.innerHTML='\u003cdiv class=\"line\">\u003cb>검색 결과 '+displayedSearchItems.length+'건\u003c/b>\u003cbutton type=\"butto ata-search-hit]');if(b)goToHit(displayedSearchItems[Number(b.dataset.searchHit)])});\n\nasync function refreshInbox(){if(record||document.hidden||!document.querySelector('.work-menu'))return;try{const current=await api('/api/inbox');if(JSON.stringify(current)===JSON.stringify(inbox))return;const before=inbox.filter(a=>!a.seen).length;inbox=current;if(overview==='agenda')calendarRefresh();const count=inbox.filter(a=>!a.seen).length;const button=document.querySelector('button[data-id=\"mine\"]');if(button)button.textContent='내 입사 일정 · 알림 '+count;if(overview==='mine'&&document.querySelector('#scheduleList'))document.querySelector('#scheduleList').innerHTML=scheduleList(false);if(count>before)msg('새 입사 준비 알림이 도착했습니다.')}catch{}}\nsetInterval(refreshInbox,30000);window.addEventListener('focus',refreshInbox);\n\n\nfunction openLiveChannel(){try{return new BroadcastChannel('mentor-record-updates')}catch{return null}}\nconst liveChannel=openLiveChannel();\nfunction announceDetailChange(){liveChannel?.postMessage(record.id)}\nfunction liveTab(){return !!record&&['q','hrTalk','mentorMeet'].includes(tab)}\nconst formKey=f=>[f.dataset.action,f.elements.item?.value||''].join(':');\nfunction renderLiveDetail(sent){\n const saved=new Map();\n for(const f of app.querySelectorAll('form[data-action]')){\n  if(f===sent)continue;\n  const fields=Array.from(f.elements).filter(el=>el.name&&el.type!=='hidden').map(el=>[el.name,el.value]);\n  const active=f.contains(document.activeElement)?document.activeElement:null;\n  saved.set(formKey(f),{fields,expanded:f.closest('details')?.open,active:active?.name,pos:active?.tagName==='TEXTAREA'?active.selectionStart:null});\n }\n const y=window.scrollY;detail();\n for(const f of app.querySelectorAll('form[data-action]')){\n  const state=saved.get(formKey(f));if(!state)continue;\n  if(state.expanded&&f.closest('details'))f.closest('details').open=true;\n  for(const [name,value] of state.fields)if(f.elements[name])f.elements[name].value=value;\n  con ions.flatMap(([d],q)=>d===i?[q]:[]));\nconst allCore=questions.slice(0,54).map((_,q)=>q);\nfunction parseCSV(text){\n  text=text.replace(/^\\uFEFF/,'').replace(/\\r\\n/g,'\\n');\n  let rows=[],row=[],field='',quoted=false;\n  for(let i=0;i\u003ctext.length;i++){\n    const c=text[i];\n    if(c==='\"'){if(quoted&&text[i+1]==='\"'){field+='\"';i++;}else quoted=!quoted;}\n    else if(c===','&&!quoted){row.push(field.trim());field='';}\n    else if((c==='\\n'||c==='\\r')&&!quoted){row.push(field.trim());if(row.some(Boolean))rows.push(row);row=[];field='';}\n    else field+=c;\n  }\n  if(quoted)throw Error('따옴표가 닫히지 않은 CSV입니다.');\n  row.push(field.trim());if(row.some(Boolean))rows.push(row);return rows;\n}\nfunction importForm(text){\n  const [head,...lines]=parseCSV(text);\n  if(!head||!lines.length)throw Error('응답이 들어 있는 구글폼 CSV를 선택해 주세요.');\n  const cols=Array(59).fill(-1);\n  head.forEach((s,i)=>{const m=s.match(/^(\\d{1,2})\\s*[.)．]/);if(m&&+m[1]>=1&&+m[1]\u003c=59){const k=+m[1]-1;if(cols[k]!==-1)throw Error('중복된 문항 번호가 있습니다.');cols[k]=i;}});\n  if(cols.includes(-1))throw Error('원본 설문의 1~59번 문항 제목을 모두 포함한 CSV가 필요합니다.');\n  return lines.map((r,j)=>{\n    const answers=cols.slice(0,55).map((col,q)=>{\n      const s=(r[col]??'').trim();\n      if(q===45&&s.replace(/\\s/g,'')==='옵션7')return 0;\n      const n=scale.indexOf(s);\n      if(n\u003c0)throw Error((j+2)+'행 '+(q+1)+'번 응답을 확인해 주세요.');\n      return n;\n    });\n    const meta=cols.slice(55).map((c,k)=>{let s=r[c]||'미응답';if(k===1&&s.includes('본부장'))s=groups[1][2];if(k===3){const n=['1년미만','3년미만','5년미만','7년미만','7년이상'].indexOf(s.replace(/\\s/g,''));if(n>=0)s=groups[3][n];}return s;});\n    return {answers,meta};\n  });\n}\n","const interventions=[\n  [[7,19,20],'경영 방향 공유','경영진이 이번 분기 우선순위 세 가지와 결정 이유를 한 장으로 공유하고, 월례회의에서 미해결 질문에 답합니다.','경영진·기획팀','월례회의 후 미답변 질문 수'],\n  [[8,14],'경영진과의 대화','월 1회 익명 질문을 받고 10영업일 안에 답변과 후속 조치를 사내 게시판에 공개합니다.','경영진','기한 내 답변 비율'],\n  [[21,25,26],'업무 배분과 위임','팀별 주요 업무의 결정권자와 담당자를 정리하고, 매주 한 번 업무량과 승인 병목을 조정합니다.','팀장','담당·권한을 합의한 주요 업무 비율'],\n  [[32,35,48],'약속과 원칙의 이행','경영진이 밝힌 약속의 담당자·기한·이행 결과를 월 1회 공유하고, 변경한 약속은 그 이유를 설명합니다.','경영진','기한 내 이행한 약속 비율'],\n  [[41],'고용 관련 소통','인력 운영 원칙과 변경 시 설명 절차를 문서화하고 익명 질의 시간을 마련합니다.','인사책임자','고용 관련 질의 답변 소요일'],\n  [[44],'업무 추진 과정','지연된 주요 과제 두 건을 선정해 의사결정 과정과 지원이 필요했던 지점을 검토하고 다음 결정을 맡을 사람을 명확히 합니다.','경영진·기획팀','주요 의사결정 소요일'],\n  [[2,3,36],'업무환경 개선','구성원이 불편을 접수할 창구를 정하고, 비품·시설·안전 이슈를 담당자와 처리 기한별로 관리합니다.','총무·현장책임자','기한 내 개선 완료 비율'],\n  [[9,46],'성장 기회와 혜택','직무별 교육·경력 기회와 신청 기준을 공개하고, 이용이 적은 팀에서 장애 요인을 확인합니다.','인사팀','희망자 중 기회를 제공받은 비율'],\n  [[10,15],'인정과 피드백','팀장이 월 1회 구체적인 기여를 피드백하고, 실수가 발생한 사례 한 건에서 개선할 절차를 함께 정합니다.','팀장','피드백 면담 실시율'],\n  [[16,22],'의사결정 참여','업무 절차를 바꾸기 전에 영향을 받는 구성원에게 초안을 공유하고, 제안의 반영 여부와 이유를 회신합니다.','과제 담당자','제안 결과 회신율'],\n  [[27,43,49],'일하는 환경과 존중','소그룹 면담에서 부담이나 존중을 해치는 업무 관행을 확인하고, 팀별로 한 가지 근무 원칙을 정해 4주간 적용합니다.','인사팀·팀장','합의한 근무 원칙 이행률'],\n  [[4,11,29],'평가와 승진 기준','평가·승진 기준과 사례를 사전에 공개하고, 평가자 간 점수 편차를 검토한 뒤 구성원에게 결과를 설명합니다.','인사팀·평가자','평가 결과 설명 면담 실시율'],\n  [[18],'보상 기준 설명','보상 결정 요소와 적용 사례를 설명하고, 개인별 보상 결과를 질문할 수 있는 면담 일정을 제공합니다.','보상 담당자','보상 설명 면담 완료율'],\n  [[23,28,33,37,42,51],'대우의 일관성','업무 기회와 인정이 배분된 최근 사례를 검토하고, 팀별 배정 기준과 예외 승인 사유를 기록합니다.','인사책임자·팀장','배정 근거가 기록된 사례 비율'],\n  [[45],'이의제기 절차','이의제기 접수처·검토자·답변 기한을 공개하고, 접수자에게 처리 단계를 개별 안내합니다.','인사책임자','기한 내 처리율'],\n  [[5,12,52],'일의 의미와 기여','팀의 산출물이 고객 또는 동료에게 준 변화를 월간 회고에 담고, 각자 맡은 일과 성과의 연결을 확인합니다.','팀장','기여 사례를 공유한 팀 수'],\n  [[17,24,38],'조직에 대한 자부심','고객·사회에 미친 변화를 보여주는 실제 사례를 선정하고, 기여한 구성원이 그 과정을 직접 공유합니다.','경영진·커뮤니케이션 담당자','구성원이 공유한 기여 사례 수'],\n  [[30,50],'근속 의향과 업무 경험','희망자를 대상으로 재직 면담을 진행해 계속 일하고 싶은 이유와 부담 요인을 듣고, 반복되는 과제 한 건을 개선합니다.','인사팀·팀장','재직 면담 후 개선 과제 완료율'],\n  [[1,13,31,39,53],'환대와 소속감','신규 입사자와 이동자에게 동료 파트너를 연결하고, 2주 뒤 적응을 도운 점과 불편했던 점을 확인합니다.','팀장·온보딩 담당자','2주 차 적응 면담 실시율'],\n  [[6,34,47],'협업과 상호 지원','협업이 어려웠던 사례를 양쪽 팀이 함께 검토하고 요청 창구·응답 시간·인수인계 기준을 합의합니다.','관련 팀장','합의한 시간 내 협업 요청 회신율'],\n  [[40,54],'긍정적인 팀 경험','구성원이 원하는 인정·축하 방식을 묻고, 회고 시간에 동료의 구체적인 도움을 공유하는 시간을 둡니다.','팀장','회고에서 공유된 동료 기여 사례 수']\n];\nfunction diagnose(rows,dim){\n  const measured=byDimension[dim].map(q=>({q,...measure(rows,[q])}));\n  const rank=measured.filter(x=>x.pct!==null).sort((a,b)=>a.pct-b.pct||a.avg-b.avg||a.q-b.q);\n  if(!rank.length)return null;\n  const weak=rank[0],strong=rank[rank.length-1];\n  const evidence=interventions.find(([ids])=>ids.includes(weak.q+1));\n  return {weak,strong,evidence,high:weak.pct>=75};\n}\n","'use strict';\nconst root=document.getElementById('app');\nconst demo=sampleRows();\n\nconst savedKey='public-demo-allhands.culture.v1';\nfunction read(key,fallback){try{return JSON.parse(localStorage.getItem(key))??fallback;}catch{return fallback;}}\nfunction persist(key,x){try{localStorage.setItem(key,JSON.stringify(x));return true;}catch{tell('저장 공간을 사용할 수 없습니다. 브라우저 저장 설정을 확인해 주세요.');return false;}}\nconst records=()=>read(savedKey,{local:[],google:[]});\nlet page='dashboard',source=(records().local.length+records().google.length)?'live':'demo',field=0,group='',dimFilter='all',sort='number',focusDim=0;\nlet staged=null,noticeTimer;\nconst draftKey=savedKey+'.draft';\nconst newDraft=()=>({id:crypto.randomUUID(),answers:Array(55).fill(null),meta:['','','',''],step:0});\nlet draft=read(draftKey,null)||newDraft(),submitted=false;\nconst escapeHTML=value=>String(value).replace(/[&\u003c>\"']/g,c=>({'&':'&amp;','\u003c':'&lt;','>':'&gt;','\"':'&quot;',\"'\":'&#39;'}[c]));\nconst fmt=n=>n===null?'—':n.toFixed(1)+'%';\nconst qid=q=>'Q'+String(q+1).padStart(2,'0');\nconst title=d=>dimensions[d]||'종합평가';\nfunction tell(s){const node=document.getElementById('status');node.textContent=s;clearTimeout(noticeTimer);noticeTimer=setTimeout(()=>node.textContent='',5000);}\nfunction allRows(){const r=records();return source==='demo'?demo:r.local.concat(r.google);}\nfunction rows(){return allRows().filter(x=>!group||x.meta[field]===group);}\nfunction options(values,active){return values.map(([v,l])=>'\u003coption value=\"'+escapeHTML(v)+'\" '+(String(v)===String(active)?'selected':'')+'>'+escapeHTML(l)+'\u003c/option>').join('');}\nfunction header(t,desc,controls=''){return '\u003cdiv class=\"heading\">\u003cdiv>\u003ch1>'+t+'\u003c/h1>\u003cp class=\"sub\">'+desc+'\u003c/p>\u003c/div>\u003cdiv class=\"actions\">'+controls+'\u003c/div>\u003c/div>';}\nfunction go(p){page=p;render();window.scrollTo(0,0);}\nfunction dataset(){return '\u003clabel class=\"meta\">데이터 \u003cselect id=\"source\">'+options([['demo','예시 데이터'],['live','내 응답 데이터']],source)+'\u003c/select>\u003c/label>';}\nfunction filters(){const gs=[...new Set(allRows().map(x=>x.meta[field]))].sort();return '\u003cdiv class=\"filters\">\u003clabel>분석 기준 \u003cselect id=\"field\">'+options(orgFields.map((s,i)=>[i,s]),field)+'\u003c/select>\u003c/label>\u003clabel>분석 대상 \u003cselect id=\"group\">'+options([['','전체 조직'],...gs.map(s=>[s,s])],group)+'\u003c/select>\u003c/label>\u003cspan class=\"meta\">'+(source==='demo'?'가상 응답으로 보는 분석 예시':'이 브라우저에 저장된 응답')+'\u003c/span>\u003c/div>';}\nfunction heat(n){if(n===null)return '#f1f3f6';return n>=80?'#c4e4d9':n>=65?'#dff0e9':n>=50?'#f3ecde':'#f5d9d2';}\nfunction dash(){\n const data=rows(),areas=byDimension.map(ix=>measure(data,ix)),score=measure(data,allCore),global=measure(data,[54]);\n const rank=dimensions.map((s,i)=>({s,i,p:areas[i].pct})).filter(a=>a.p!==null&&diagnose(data,a.i)).sort((a,b)=>b.p-a.p);\n const hero=(label,value,unit,desc)=>'\u003cdiv>\u003ch2>'+label+'\u003c/h2>\u003cstrong class=\"metric\">'+value+'\u003cem>'+unit+'\u003c/em>\u003c/strong>\u003cp>'+desc+'\u003c/p>\u003c/div>';\n const insight=(x,low)=>'\u003cdiv class=\"insight\">\u003cspan class=\"key '+(low?'low':'')+'\">'+(low?'우선 점검':'상대적 강점')+'\u003c/span>\u003ch3>'+x.s+' · '+fmt(x.p)+'\u003c/h3>\u003cp>'+escapeHTML(questions[(low?diagnose(data,x.i).weak:diagnose(data,x.i).strong).q][1])+'\u003c/p>\u003c/div>';\n const groupsList=[...new Set(allRows().map(r=>r.meta[field]))].sort().filter(s=>!group||group===s);\n return header('조직문화 진단 대시보드','구성원이 경험한 일터의 강점과 개선이 필요한 지점을 살펴봅니다.',dataset())+filters()+\n '\u003csection class=\"hero\">'+hero('조직문화 긍정률',score.pct===null?'—':score.pct.toFixed(1),score.pct===null?'':'%','5개 영역 · 54문항 유효응답 기준')+hero('일하기 좋은 일터',global.pct===null?'—':global.pct.toFixed(1),global.pct===null?'':'%','55번 종합평가 긍정률')+hero('응답 인원',data.length,'명',source==='demo'?'예시 응답':'제출 완료된 응답')+'\u003c/section>'+\n '\u003cdiv class=\"layout\">\u003csection class=\"card\">\u003cdiv class=\"panelHead\">\u003ch2>GWP 영역별 긍정률\u003c/h2>\u003cspan class=\"meta\">긍정 응답 4·5점\u003c/span>\u003c/div>\u003cdiv class=\"bars\">'+areas.map((a,i)=>'\u003cdiv class=\"barrow\">\u003cspan>'+dimensions[i]+'\u003c/span>\u003cdiv class=\"track\">\u003ci style=\"width:'+(a.pct??0)+'%;background:'+colors[i]+'\">\u003c/i>\u003c/div>\u003cb>'+fmt(a.pct)+'\u003c/b>\u003c/div>').join('')+'\u003c/div>\u003c/section>\u003csection class=\"card\">\u003cdiv class=\"panelHead\">\u003ch2>진단 요약\u003c/h2>\u003cbutton data-page=\"solutions\">개선안 보기\u003c/button>\u003c/div>'+(rank.length?insight(rank[0],false)+insight(rank[rank.length-1],true):'\u003cp class=\"empty\">유효 응답자 5명부터 강점과 개선 신호를 표시합니다.\u003c/p>')+'\u003c/section>\u003c/div>'+\n '\u003csection class=\"card\">\u003cdiv class=\"panelHead\">\u003ch2>'+orgFields[field]+'별 비교\u003c/h2>\u003cspan class=\"meta\">영역별 긍정률 (%)\u003c/span>\u003c/div>\u003cdiv class=\"tablewrap\">\u003ctable class=\"matrix\">\u003cthead>\u003ctr>\u003cth>'+orgFields[field]+'\u003c/th>\u003cth>응답 인원\u003c/th>'+dimensions.map(s=>'\u003cth>'+s+'\u003c/th>').join('')+'\u003c/tr>\u003c/thead>\u003ctbody>'+groupsList.map(g=>{const rr=data.filter(r=>r.meta[field]===g);return '\u003ctr>\u003ctd>'+escapeHTML(g)+'\u003c/td>\u003ctd>'+rr.length+'명\u003c/td>'+byDimension.map(ix=>{const a=measure(rr,ix);return '\u003ctd>\u003cspan class=\"cell\" style=\"background:'+heat(a.pct)+'\">'+fmt(a.pct)+'\u003c/span>\u003c/td>';}).join('')+'\u003c/tr>';}).join('')+'\u003c/tbody>\u003c/table>\u003c/div>\u003cp class=\"note\">긍정률은 유효응답 중 ‘그렇다’와 ‘매우 그렇다’의 비율입니다. ‘잘 모르겠다’는 분모에서 제외하며, 유효 응답자가 5명 미만인 값은 —로 표시합니다.\u003c/p>\u003c/section>';\n}\nfunction items(){\n const rr=rows();let list=questions.map(([d,s],q)=>({d,s,q,m:measure(rr,[q])})).filter(x=>dimFilter==='all'||String(x.d)===dimFilter);\n if(sort==='low')list.sort((a,b)=>(a.m.pct??101)-(b.m.pct??101));\n return header('문항 분석','긍정률과 응답 분포를 함께 보며 점수가 낮은 이유를 살펴봅니다.',dataset())+filters()+'\u003csection class=\"card\">\u003cdiv class=\"panelHead\">\u003ch2>문항별 결과\u003c/h2>\u003cdiv class=\"actions\">\u003cselect id=\"dimension\" aria-label=\"문항 영역\">'+options([['all','전체 영역'],...[...dimensions,'종합평가'].map((s,i)=>[i,s])],dimFilter)+'\u003c/select>\u003cselect id=\"sort\" aria-label=\"문항 정렬\">'+options([['number','원본 번호순'],['low','긍정률 낮은 순']],sort)+'\u003c/select>\u003c/div>\u003c/div>\u003cdiv class=\"tablewrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>번호\u003c/th>\u003cth>영역\u003c/th>\u003cth>진단 문항\u003c/th>\u003cth>긍정률\u003c/th>\u003cth>평균 / 5\u003c/th>\u003cth>응답 분포 (명)\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>'+list.map(({d,s,q,m})=>'\u003ctr>\u003ctd>'+qid(q)+'\u003c/td>\u003ctd class=\"num\">'+title(d)+'\u003c/td>\u003ctd class=\"itemtext\">'+s+'\u003c/td>\u003ctd class=\"num\">'+fmt(m.pct)+'\u003c/td>\u003ctd>'+ (m.avg===null?'—':m.avg.toFixed(2))+'\u003c/td>\u003ctd class=\"num\">'+(m.pct===null?'집계 보류':'\u003cdetails>\u003csummary>유효 '+m.valid+'명\u003c/summary>'+[1,2,3,4,5,0].map(n=>scale[n]+' '+m.bins[n]+'명').join('\u003cbr>')+'\u003c/details>')+'\u003c/td>\u003c/tr>').join('')+'\u003c/tbody>\u003c/table>\u003c/div>\u003c/section>';\n}\nfunction solutions(){\n const rr=rows(),ix=focusDim,a=measure(rr,byDimension[ix]),diagnosis=diagnose(rr,ix);\n let content='\u003cp class=\"empty\">이 영역에서 유효 응답자 5명 이상인 문항이 있어야 개선안을 제시할 수 있습니다.\u003c/p>';\n if(diagnosis){\n const {weak,strong,evidence,high}=diagnosis;const [ids,theme,action,owner,kpi]=evidence;\n const evidenceCard=(cl,label,x)=>'\u003carticle class=\"card\">\u003cspan class=\"key '+cl+'\">'+label+'\u003c/span>\u003ch2 style=\"margin-top:12px\">'+qid(x.q)+' · '+fmt(x.pct)+'\u003c/h2>\u003cp>'+questions[x.q][1]+'\u003c/p>\u003cp class=\"note\">긍정 '+(x.bins[4]+x.bins[5])+'명 / 유효 '+x.valid+'명 · 잘 모르겠다 '+x.bins[0]+'명\u003c/p>\u003c/article>';\n content='\u003cdiv class=\"dataGrid\">'+evidenceCard('','유지할 강점',strong)+evidenceCard('low',high?'유지 점검 문항':'우선 점검 문항',weak)+'\u003c/div>\u003carticle class=\"card\">\u003cdiv class=\"tagline\">'+dimensions[ix]+' · '+qid(weak.q)+'에 연결된 제안\u003c/div>\u003ch2>'+theme+'\u003c/h2>\u003cp class=\"sub\">'+(high?'이 영역은 모든 공개 문항의 긍정률이 75% 이상입니다. 현재 방식을 유지하며 아래 활동의 필요성을 확인하세요.':'해당 문항이 이 영역에서 상대적으로 낮습니다. 면담으로 배경을 확인한 뒤 아래 활동을 검토하세요.')+'\u003c/p>\u003cdiv class=\"help\">\u003ch3>실행 제안\u003c/h3>\u003cp>'+action+'\u003c/p>\u003c/div>\u003cdiv class=\"tablewrap\">\u003ctable>\u003ctbody>\u003ctr>\u003cth scope=\"row\">권장 담당\u003c/th>\u003ctd>'+owner+'\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">실행 지표\u003c/th>\u003ctd>'+kpi+'\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">효과 확인\u003c/th>\u003ctd>4주 뒤 실행 지표를 점검하고 다음 진단에서 '+qid(weak.q)+' 긍정률을 현재 '+fmt(weak.pct)+'와 비교합니다.\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003c/article>';\n }\n const base=measure(allRows(),byDimension[ix]);\n const gap=group&&base.pct!==null&&a.pct!==null?' · 전체 조직 대비 '+(a.pct>=base.pct?'+':'')+(a.pct-base.pct).toFixed(1)+'%p':'';\n const distribution=a.avg===null?'':`\u003carticle class=\"card\">\u003cdiv class=\"panelHead\">\u003ch2>영역 응답 분포\u003c/h2>\u003cspan class=\"meta\">평균 ${a.avg.toFixed(2)} / 5점\u003c/span>\u003c/div>\u003cdiv class=\"distrib\">${[['긍정',a.bins[4]+a.bins[5],'#377569'],['보통',a.bins[3],'#8f9caf'],['부정',a.bins[1]+a.bins[2],'#c77a61']].map(([label,n,c])=>`\u003cdiv class=\"barrow\">\u003cspan>${label}\u003c/span>\u003cdiv class=\"track\">\u003ci style=\"width:${100*n/a.valid}%;background:${c}\">\u003c/i>\u003c/div>\u003cb>${fmt(100*n/a.valid)}\u003c/b>\u003c/div>`).join('')}\u003c/div>\u003cp class=\"note\">유효 선택 ${a.valid}건 · 비점수 선택 ${a.bins[0]}건 · 응답 인원 ${rr.length}명\u003c/p>\u003c/article>`;\n return header('영역 진단과 개선안','영역을 선택하면 응답 근거와 실행할 수 있는 개선안을 함께 볼 수 있습니다.',dataset())+filters()+'\u003cdiv class=\"filters\">\u003clabel>진단 영역 \u003cselect id=\"focusDim\">'+options(dimensions.map((s,i)=>[i,s]),ix)+'\u003c/select>\u003c/label>\u003cspan class=\"pill\">영역 긍정률 '+fmt(a.pct)+gap+'\u003c/span>\u003cbutton id=\"printReport\">진단서 인쇄\u003c/button>\u003c/div>'+distribution+content+'\u003cp class=\"note\">문항을 GWP 5개 영역에 자체 분류했습니다. 동일 영역에서 긍정률이 낮은 문항을 먼저 살펴보고, 동률이면 평균 점수를 사용합니다. 점수만으로 원인을 확정할 수 없어 개선안은 검토용으로 제시합니다.\u003c/p>';\n}\nfunction survey(){\n if(submitted)return header('설문 제출 완료','이 브라우저의 내 응답 데이터에 반영했습니다.')+'\u003csection class=\"card\">\u003cbutton class=\"primary\" data-page=\"dashboard\">진단 결과 보기\u003c/button> \u003cbutton id=\"newSurvey\">새 응답 시작\u003c/button>\u003c/section>';\n const step=draft.step,start=step*11,total=draft.answers.filter(x=>x!==null).length;\n let body='';\n if(step\u003c5){\n body=questions.slice(start,start+11).map(([d,s],i)=>{const q=start+i;return '\u003cfieldset class=\"question\" id=\"q'+q+'\">\u003clegend>\u003cspan class=\"qid\">'+qid(q)+'\u003c/span>'+s+'\u003c/legend>\u003cdiv class=\"options\">'+[1,2,3,4,5,0].map(n=>'\u003clabel>\u003cinput type=\"radio\" name=\"q'+q+'\" value=\"'+n+'\" '+(draft.answers[q]===n?'checked':'')+'>\u003cspan>'+scale[n]+'\u003c/span>\u003c/label>').join('')+'\u003c/div>\u003c/fieldset>';}).join('');\n }else body='\u003ch2>응답자 특성\u003c/h2>\u003cp class=\"sub\">조직별 통계에 사용합니다. 항목을 비워두면 미응답으로 집계합니다.\u003c/p>'+orgFields.map((s,i)=>'\u003clabel class=\"field\">'+s+(i?'\u003cselect data-meta=\"'+i+'\">'+options([['','응답 안 함'],...groups[i].map(s=>[s,s])],draft.meta[i])+'\u003c/select>':'\u003cinput data-meta=\"0\" maxlength=\"60\" placeholder=\"예: 경영지원팀\" value=\"'+escapeHTML(draft.meta[0])+'\">')+'\u003c/label>').join('');\n return '\u003cdiv class=\"survey\">'+header('조직문화 설문','최근 일터에서 직접 경험한 내용을 기준으로 응답해 주세요.')+'\u003csection class=\"card\">\u003cdiv class=\"statline\">\u003cb>'+(step\u003c5?'조직문화 문항 '+(start+1)+'–'+(start+11):'소속 및 응답자 특성')+'\u003c/b>\u003cspan class=\"meta\" id=\"progressText\">'+total+' / 55문항 · '+(step+1)+' / 6단계\u003c/span>\u003c/div>\u003cdiv class=\"progressTrack\">\u003ci id=\"progress\" style=\"width:'+total/55*100+'%\">\u003c/i>\u003c/div>\u003cp class=\"note\">이 화면의 응답은 현재 브라우저에 저장됩니다. 여러 직원의 응답은 응답 관리에서 원본 구글폼으로 수집할 수 있습니다.\u003c/p>\u003c/section>\u003csection class=\"card\">'+body+'\u003cp id=\"surveyError\" role=\"alert\" class=\"problem\">\u003c/p>\u003cdiv class=\"bottom\">\u003cbutton id=\"prev\" '+(step===0?'disabled':'')+'>이전\u003c/button>\u003cbutton class=\"primary\" id=\"next\">'+(step===5?'응답 제출':'다음 단계')+'\u003c/button>\u003c/div>\u003c/section>\u003c/div>';\n}\nfunction management(){\n const r=records();return header('응답 관리','원본 구글폼에서 모은 응답을 가져오거나, 이 브라우저에서 설문을 작성하세요.')+'\u003cdiv class=\"dataGrid\">\u003csection class=\"card\">\u003cdiv class=\"tagline\">브라우저 저장\u003c/div>\u003ch2>프로그램에서 응답\u003c/h2>\u003cp>같은 기기에서 설문을 작성하고 결과를 확인합니다. 현재 이 브라우저에서 제출한 응답은 '+r.local.length+'건입니다.\u003c/p>\u003cbutton data-page=\"survey\">설문 참여\u003c/button>\u003c/section>\u003c/div>\u003csection class=\"card\">\u003cdiv class=\"panelHead\">\u003cdiv>\u003ch2>구글폼 응답 CSV 가져오기\u003c/h2>\u003cp class=\"sub\">구글폼의 응답 탭에서 CSV를 내려받아 선택하세요. ZIP 파일은 먼저 압축을 풀어 주세요.\u003c/p>\u003c/div>\u003cspan class=\"pill\">가져온 응답 '+r.google.length+'건\u003c/span>\u003c/div>\u003cinput type=\"file\" class=\"file\" id=\"csv\" aria-label=\"구글폼 응답 CSV\" accept=\".csv,text/csv\">\u003cp class=\"note\">원본 1~59번 문항을 번호로 연결합니다. 새 파일을 적용하면 기존에 가져온 응답 전체를 교체하며, 이 기기에서 직접 제출한 응답은 함께 집계됩니다.\u003c/p>\u003cdiv id=\"importResult\" aria-live=\"polite\">\u003c/div>\u003c/section>\u003csection class=\"card\">\u003ch2>집계 기준\u003c/h2>\u003cp class=\"sub\">1~54번은 5개 영역에 한 번씩 배정했습니다. 영역과 조직 전체의 긍정률은 해당 문항의 유효 선택 건수를 합산해 계산합니다. 55번 종합평가는 별도로 계산합니다.\u003c/p>\u003cp class=\"note\">원본 46번에 추가된 ‘옵션 7’은 점수 의미가 없어 CSV에서 ‘잘 모르겠다’와 함께 비점수 응답으로 집계합니다. 응답자 특성은 이 프로그램에서 선택 입력으로 운영합니다.\u003c/p>\u003c/section>';\n}\nfunction render(){\n const pages={dashboard:dash,items,solutions,survey,data:management};\n root.innerHTML=pages[page]();document.querySelectorAll('nav button').forEach(b=>{b.classList.toggle('active',b.dataset.page===page);if(b.dataset.page===page)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current');});\n}\nfunction changeStep(delta){draft.step+=delta;persist(draftKey,draft);render();window.scrollTo(0,0);}\ndocument.addEventListener('click',e=>{\n const b=e.target.closest('button');if(!b)return;\n if(b.dataset.page){go(b.dataset.page);return;}\n if(b.id==='printReport'){window.print();return;}\n if(b.id==='newSurvey'){draft=newDraft();submitted=false;go('survey');return;}\n if(b.id==='prev'&&draft.step>0){changeStep(-1);return;}\n if(b.id==='next'){\n  if(draft.step\u003c5){const start=draft.step*11;const missing=draft.answers.slice(start,start+11).indexOf(null);if(missing>=0){const el=document.getElementById('q'+(missing+start));document.getElementById('surveyError').textContent=qid(missing+start)+'에 응답해 주세요.';tell(qid(missing+start)+'에 응답해 주세요.');el.querySelector('input').focus();return;}changeStep(1);return;}\n  const r=records();if(!r.local.some(x=>x.id===draft.id))r.local.push({id:draft.id,answers:draft.answers,meta:draft.meta.map(s=>s.trim()||'미응답')});\n  if(!persist(savedKey,r))return;localStorage.removeItem(draftKey);submitted=true;source='live';group='';go('survey');return;\n }\n if(b.id==='applyImport'&&staged){const r=records();r.google=staged;if(!persist(savedKey,r))return;staged=null;source='live';group='';go('dashboard');tell('구글폼 응답을 반영했습니다.');}\n});\nroot.addEventListener('input',e=>{if(e.target.matches('[data-meta]')){draft.meta[Number(e.target.dataset.meta)]=e.target.value;persist(draftKey,draft);}});\nroot.addEventListener('change',async e=>{\n const n=e.target;\n if(n.name&&/^q\\d+$/.test(n.name)){draft.answers[Number(n.name.slice(1))]=Number(n.value);persist(draftKey,draft);const total=draft.answers.filter(x=>x!==null).length;document.getElementById('progressText').textContent=total+' / 55문항 · '+(draft.step+1)+' / 6단계';document.getElementById('progress').style.width=(total/55*100)+'%';document.getElementById('surveyError').textContent='';return;}\n if(n.id==='source'){source=n.value;group='';}else if(n.id==='field'){field=Number(n.value);group='';}else if(n.id==='group')group=n.value;else if(n.id==='dimension')dimFilter=n.value;else if(n.id==='sort')sort=n.value;else if(n.id==='focusDim')focusDim=Number(n.value);\n else if(n.id==='csv'){\n  const out=document.getElementById('importResult');staged=null;out.textContent='';if(!n.files[0])return;\n  try{const arr=importForm(await n.files[0].text());if(!out.isConnected)return;staged=arr;out.innerHTML='\u003cdiv class=\"help\">\u003cb>'+staged.length+'건 확인 완료\u003c/b> \u003cbutton class=\"primary\" id=\"applyImport\">이 데이터 적용\u003c/button>\u003c/div>';}catch(ex){out.textContent=ex.message;}return;\n }else return;\n render();\n});\nrender();\n"]}};

  pages.workforce={"styles":"#workforce-plan{max-width:1460px;margin:auto;padding:30px;font-size:15px}#workforce-plan *{box-sizing:border-box}#workforce-plan header,#workforce-plan .bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap}#workforce-plan header small{width:100%;color:#667991}#workforce-plan h1{font-size:28px;margin:0 auto 0 0}#workforce-plan h2{font-size:18px;margin-right:auto}#workforce-plan section:not(.tiles),#workforce-plan article{background:white;border:1px solid #dce4ed;border-radius:10px;padding:18px}#workforce-plan .tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:22px 0}#workforce-plan strong{display:block;font-size:23px;margin-top:8px}#workforce-plan p{color:#53667c;line-height:1.6}#workforce-plan input,#workforce-plan button{font:inherit;border:1px solid #cbd6e2;border-radius:6px;padding:7px 9px}#workforce-plan button{cursor:pointer;color:#264662;background:#f3f6fa}#workforce-plan button.primary{background:#233957;color:white}#workforce-plan .grid-scroll{overflow:auto}#workforce-plan table{width:100%;border-collapse:collapse;font-size:14px}#workforce-plan td,#workforce-plan th{padding:9px;border-bottom:1px solid #dce5ef;text-align:right;white-space:nowrap}#workforce-plan th:first-child{text-align:left}#workforce-plan thead{background:#f2f5fa}#workforce-plan dialog{width:min(580px,94vw);max-height:84vh;border:1px solid #bac9d8;border-radius:12px;color:#233957}#workforce-plan dialog::backdrop{background:#172a4855}#workforce-plan label{display:inline-block;margin:6px}#workforce-plan dialog input{max-width:140px}#workforce-plan [role=alert]{color:#9a2b35}","body":"\u003cmain id=\"workforce-plan\">\u003c/main>","scripts":["(function peoplePlan(){\n const root=document.querySelector(\"#workforce-plan\"),key=\"public-demo-allhands-people-workforce-plan-v1\";\n const money=n=>n.toLocaleString(\"ko-KR\")+\"원\",esc=s=>String(s).replace(/[&\u003c>\"']/g,c=>({\"&\":\"&amp;\",\"\u003c\":\"&lt;\",\">\":\"&gt;\",'\"':\"&quot;\",\"'\":\"&#39;\"})[c]);\n let year=new Date().getFullYear(),revision=localStorage.getItem(key),all=JSON.parse(revision||\"{}\");\n function project(row){\n  let head=row.start;return row.hires.map((hires,i)=>{head+=hires-row.exits[i];return {head,cost:head*row.pay};});\n }\n function draw(){\n  const rows=all[year]||[],months=Array.from({length:12},(_,i)=>i),projections=rows.map(project);\n  const head=projections.reduce((s,p)=>s+p[11].head,0),hires=rows.reduce((s,r)=>s+r.hires.reduce((a,b)=>a+b,0),0),cost=projections.reduce((s,p)=>s+p.reduce((a,b)=>a+b.cost,0),0);\n  const summary=[[\"연말 계획 인원\",head+\"명\"],[\"연간 채용 계획\",hires+\"명\"],[\"예상 연간 인건비\",money(cost)]];\n  root.innerHTML=`\u003cheader>\u003csmall>사업계획\u003c/small>\u003ch1>인력 및 인건비 계획\u003c/h1>\u003clabel>계획 연도 \u003cinput id=\"plan-year\" type=\"number\" min=\"2000\" max=\"2100\" value=\"${year}\">\u003c/label>\u003c/header>\u003csection class=\"tiles\">${summary.map(([label,v])=>`\u003carticle>${label}\u003cstrong>${v}\u003c/strong>\u003c/article>`).join(\"\")}\u003c/section>\u003csection>\u003cdiv class=\"bar\">\u003ch2>부서별 월간 계획\u003c/h2>\u003cbutton class=\"primary\" id=\"add-unit\">부서 계획 추가\u003c/button>\u003c/div>\u003cp>월말 인원은 전월 인원에 채용·퇴직 계획을 반영합니다. 예상 인건비는 월말 인원에 부서별 1인당 월 인건비를 곱해 산출합니다.\u003c/p>\u003cdiv class=\"grid-scroll\">\u003ctable>\u003cthead>\u003ctr>\u003cth>부서\u003c/th>\u003cth>기초 인원\u003c/th>${months.map(i=>`\u003cth>${i+1}월\u003c/th>`).join(\"\")}\u003cth>연간 인건비\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>${rows.map((r,j)=>`\u003ctr>\u003cth>\u003cbutton data-unit=\"${j}\">${esc(r.dept)}\u003c/button>\u003c/th>\u003ctd>${r.start}명\u003c/td>${projections[j].map(p=>`\u003ctd>${p.head}명\u003c/td>`).join(\"\")}\u003ctd>${money(projections[j].reduce((a,b)=>a+b.cost,0))}\u003c/td>\u003c/tr>`).join(\"\")||'\u003ctr>\u003ctd colspan=\"15\">등록된 부서 계획이 없습니다.\u003c/td>\u003c/tr>'}\u003c/tbody>\u003c/table>\u003c/div>\u003c/section>\u003cdialog>\u003cform method=\"dialog\">\u003ch2>부서 계획\u003c/h2>\u003cdiv class=\"fields\">\u003c/div>\u003cp role=\"alert\">\u003c/p>\u003cdiv class=\"bar\">\u003cbutton type=\"button\" id=\"close-unit\">취소\u003c/button>\u003cbutton class=\"primary\">저장\u003c/button>\u003c/div>\u003c/form>\u003c/dialog>`;\n  root.querySelector(\"#plan-year\").onchange=e=>{if(e.target.value&&e.target.checkValidity()){year=Number(e.target.value);draw();}};\n  root.querySelector(\"#add-unit\").onclick=()=>open(null);\n  root.querySelectorAll(\"[data-unit]\").forEach(b=>b.onclick=()=>open(Number(b.dataset.unit)));\n }\n function open(index){\n  const rows=all[year]||[],row=rows[index]||{dept:\"\",start:0,pay:0,hires:Array(12).fill(0),exits:Array(12).fill(0)};\n  const dialog=root.querySelector(\"dialog\"),form=dialog.querySelector(\"form\");\n  const input=(name,n,label,max=99999)=>`\u003cinput type=\"number\" name=\"${name}\" value=\"${n}\" required min=\"0\" max=\"${max}\" step=\"1\" aria-label=\"${label}\">`;\n  form.querySelector(\".fields\").innerHTML=`\u003clabel>부서명 \u003cinput name=\"dept\" maxlength=\"80\" required value=\"${esc(row.dept)}\">\u003c/label>\u003clabel>연초 기초 인원 ${input(\"start\",row.start,\"기초 인원\")}\u003c/label>\u003clabel>1인당 월 인건비 (원) ${input(\"pay\",row.pay,\"1인당 월 인건비\",999999999)}\u003c/label>\u003ctable>\u003cthead>\u003ctr>\u003cth>월\u003c/th>\u003cth>채용 인원\u003c/th>\u003cth>퇴직 인원\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>${row.hires.map((v,i)=>`\u003ctr>\u003cth>${i+1}월\u003c/th>\u003ctd>${input(\"h\"+i,v,(i+1)+\"월 채용\")}\u003c/td>\u003ctd>${input(\"e\"+i,row.exits[i],(i+1)+\"월 퇴직\")}\u003c/td>\u003c/tr>`).join(\"\")}\u003c/tbody>\u003c/table>`;\n  form.querySelector(\"[role=alert]\").textContent=\"\";form.querySelector(\"#close-unit\").onclick=()=>dialog.close();\n  form.onsubmit=e=>{\n   e.preventDefault();const f=new FormData(form),r={dept:f.get(\"dept\").trim(),start:+f.get(\"start\"),pay:+f.get(\"pay\"),hires:row.hires.map((_,i)=>+f.get(\"h\"+i)),exits:row.exits.map((_,i)=>+f.get(\"e\"+i))};\n   const err=form.querySelector(\"[role=alert]\");\n   if(!r.dept||rows.some((x,i)=>x.dept===r.dept&&i!==index)){err.textContent=\"중복되지 않는 부서명을 입력해 주세요.\";return;}\n   if(project(r).some(m=>m.head\u003c0)){err.textContent=\"월말 계획 인원이 음수가 되는 달이 있습니다. 퇴직 인원을 확인해 주세요.\";return;}\n   try{if(localStorage.getItem(key)!==revision)throw Error(\"다른 창에서 변경했습니다. 새로고침 후 다시 작성해 주세요.\");\n    const updated=rows.slice();updated[index??updated.length]=r;const next={...all,[year]:updated},data=JSON.stringify(next);localStorage.setItem(key,data);revision=data;all=next;dialog.close();draw();\n   }catch(error){err.textContent=error.message;}\n  };\n  dialog.showModal();\n }\n draw();\n})();\n"]};
  const compensationPage={"styles":"#pay-admin{margin:auto;max-width:1480px;padding:28px;font-size:15px;color:#203752}#pay-admin *{box-sizing:border-box}#pay-admin header,#pay-admin footer{display:flex;align-items:center;justify-content:space-between;gap:12px}#pay-admin header small{color:#576d87}#pay-admin h1{font-size:28px;margin:6px 0 16px}#pay-admin h2{font-size:18px;margin:0 0 14px}#pay-admin section{background:#fff;border:1px solid #dce4ed;border-radius:10px;padding:18px;margin:12px 0}#pay-admin .pay-scroll{overflow:auto}#pay-admin table{width:100%;border-collapse:collapse;font-size:14px}#pay-admin th,#pay-admin td{text-align:left;white-space:nowrap;border-bottom:1px solid #e3eaf0;padding:10px}#pay-admin th{background:#f0f5fa}#pay-admin button,#pay-admin input{font:inherit;border:1px solid #c6d3df;border-radius:6px;padding:7px 10px;color:inherit;background:#fff}#pay-admin button{cursor:pointer}#pay-admin section>button{margin-bottom:12px}#pay-admin button[type=submit]{background:#233957;color:white}#pay-admin a{color:#00697b}#pay-admin dialog{width:min(850px,94vw);max-height:85vh;border:1px solid #c3ccd8;border-radius:12px;padding:22px;color:inherit}#pay-admin dialog::backdrop{background:#172a4855}#pay-admin .fields>label{display:grid;gap:5px;margin:10px 0;max-width:380px}#pay-admin td input:not([type=checkbox]){max-width:145px}#pay-admin footer{justify-content:flex-end}#pay-admin [role=status]{color:#943340}@media(max-width:600px){#pay-admin{padding:16px}}","body":"\u003cmain id=\"pay-admin\">\u003c/main>","scripts":["(()=>{const byDate=(a,b)=>a.date.localeCompare(b.date);function position(person,date){\n let state={status:'입사 전',dept:'',rank:'',hired:'',last:''};\n for(const e of person.events.slice().sort(byDate)){\n  if(e.date>date)break;\n  if(e.type==='입사'){state={status:'근무',dept:e.dept,rank:e.rank,hired:e.date,last:''}}\n  if(e.type==='부서이동'){state.dept=e.dept;state.rank=e.rank||state.rank}\n  if(e.type==='휴직')state.status='휴직';\n  if(e.type==='복직')state.status='근무';\n  if(e.type==='퇴직'){state.status='퇴직';state.last=e.date}\n }\n return state;\n}\n(function wages(){\n const el=document.querySelector(\"#pay-admin\"),page=document.body.dataset.module;\n const today=new Intl.DateTimeFormat(\"sv-SE\",{timeZone:\"Asia/Seoul\"}).format(new Date());\n const titles={payGrades:\"직급별 현황\",payBands:\"Pay Band\",payModel:\"인사 시뮬레이션\"};\n let demo=sessionStorage.getItem(\"public-demo-people-comp-demo\")===\"on\";\n const sample=[[\"D01\",\"샘플 1\",\"생산관리팀\",\"사원\",36000000],[\"D02\",\"샘플 2\",\"품질보증팀\",\"사원\",39000000],[\"D03\",\"샘플 3\",\"설계팀\",\"대리\",45500000],[\"D04\",\"샘플 4\",\"생산관리팀\",\"대리\",48500000],[\"D05\",\"샘플 5\",\"설계팀\",\"과장\",57000000]];\n const sampleBands=[{grade:\"사원\",low:32000000,mid:37500000,high:43000000},{grade:\"대리\",low:40000000,mid:47000000,high:54000000},{grade:\"과장\",low:50000000,mid:57000000,high:65000000}];\n const esc=v=>String(v??\"\").replace(/[&\u003c>\"']/g,c=>({\"&\":\"&amp;\",\"\u003c\":\"&lt;\",\">\":\"&gt;\",'\"':\"&quot;\",\"'\":\"&#39;\"})[c]),won=v=>v==null?\"—\":Math.round(v).toLocaleString(\"ko-KR\")+\"원\";\n let data,people,key,snapshot;\n function load(){\n  key=\"public-demo-allhands.people.wages.v1\"+(demo?\".example\":\"\");snapshot=localStorage.getItem(key);data=snapshot?JSON.parse(snapshot):{grades:{},bands:demo?sampleBands.map(b=>({...b})):[],cases:[]};\n  if(demo){people=sample.map(([id,name,dept,grade,pay])=>({id,name,dept,grade:data.grades[id]||grade,pay}));return;}\n  const personnel=JSON.parse(localStorage.getItem(\"public-demo-allhands.people.personnel.v1\")||'{\"people\":[]}');\n  people=personnel.people.flatMap(p=>{\n   const job=position(p,today);if(![\"근무\",\"휴직\"].includes(job.status))return [];\n   const salary=p.logs.filter(l=>l.type===\"연봉\"&&l.date\u003c=today).sort((a,b)=>b.date.localeCompare(a.date))[0];\n   return [{id:p.id,name:p.name,dept:job.dept,grade:Object.hasOwn(data.grades,p.id)?data.grades[p.id]:\"\",pay:salary?Number(salary.amount):null}];\n  });\n }\n 39;\"})[c]);\n const decimal=n=>n.toLocaleString(\"ko-KR\",{maximumFractionDigits:1}),pc=(n,d)=>d?decimal(100*n/d)+\"%\":\"—\";\n let year=current,dept=\"\",sample=false;\n function example(){\n  const rows=[\n   [[\"입사\",\"-01-01\",\"생산관리팀\",-1],[\"부서이동\",\"-03-02\",\"품질보증팀\",0]],\n   [[\"입사\",\"-04-01\",\"생산관리팀\",-1],[\"퇴직\",\"-02-14\",\"\",0]],\n   [[\"입사\",\"-03-01\",\"품질보증팀\",-1],[\"퇴직\",\"-06-20\",\"\",0]],\n   [[\"입사\",\"-07-01\",\"생산관리팀\",-1],[\"휴직\",\"-02-10\",\"\",0],[\"복직\",\"-08-01\",\"\",0]],\n   [[\"입사\",\"-01-01\",\"경영지원팀\",-1],[\"퇴직\",\"-09-15\",\"\",0]],\n   [[\"입사\",\"-01-01\",\"경영지원팀\",0]],[[\"입사\",\"-03-15\",\"생산관리팀\",0]],\n   [[\"입사\",\"-05-01\",\"품질보증팀\",0]]\n  ];return rows.map(events=>({events:events.map(([type,suffix,dept,offset])=>({type,date:(current+offset)+suffix,dept}))}));\n }\n function metrics(people,start,end){\n  const days=end-start+1,groups=new Map();\n  function group(name){if(!groups.has(name))groups.set(name,{name,days:0,exits:0});return groups.get(name);}\n  for(const person of people){\n   let active=false,team=\"\",since=0;\n   function accrue(until){\n    const length=Math.max(0,Math.min(until,end+1)-Math.max(since,start));\n    if(active&&length)group(team).days+=length;\n   }\n   for(const e of [...person.events].sort((a,b)=>a.date.localeCompare(b.date))){\n    const at=dayNo(e.date);if(at>end)break;\n    if(e.type===\"입사\"){active=true;team=e.dept||\"부서 미지정\";since=at;}\n    if(e.type===\"부서이동\"&&active){accrue(at);team=e.dept||\"부서 미지정\";since=at;}\n    if(e.type===\"퇴직\"&&active){accrue(at);if(at>=start)group(team).exits++;active=false;}\n   }\n   accrue(end+1);\n  }\n  return [...groups.values()].map(g=>({...g,avg:g.days/days}));\n }\n function render(){\n  let people;\n  try{people=sample?example():JSON.parse(localStorage.getItem(storageKey)||'{\"people\":[]}').people;if(!Array.isArray(people))throw Error();}\n  catch{root.textContent=\"인사기록을 읽을 수 없습니다. 인사기록 화면에서 자료를 확인해 주세요.\";return;}\n  const minYear=Math.min(current,...people.flatMap(p=>p.events.filter(e=>e.type===\"입사\"&&e.date\u003c=today).map(e=>+e.date.slice(0,4))));\n  year=Math.min(current,Math.max(minYear,year));\n  const start=dayNo(year+\"-01-01\"),end=dayNo(year===current?today:year+\"-12-31\");\n  const groups=metrics(people,start,end).sort((a,b)=>a.name.localeCompare(b.name,\"ko\"));\n  if(dept&&!groups.some(g=>g.name===dept))dept=\"\";\n  const selected=g=>dept?g.filter(row=>row.name===dept):g;\n  function aggregate(g){return selected(g).reduce((a,b)=>({avg:a.avg+b.avg,exits:a.exits+b.exits}),{avg:0,exits:0});}\n  const total=aggregate(groups);\n  const months=Array.from({length:year===current?Number(today.slice(5,7)):12},(_,i)=>{\n   const first=Date.UTC(year,i,1)/day,last=Math.min(end,Date.UTC(year,i+1,1)/day-1);\n   return {month:i+1,...aggregate(metrics(people,first,last))};\n  });\n  const peak=Math.max(1,...months.map(m=>m.avg?100*m.exits/m.avg:0));\n  const kpi=(title,value)=>`\u003carticle>\u003cspan>${title}\u003c/span>\u003cstrong>${value}\u003c/strong>\u003c/article>`;\n  const table=(labels,rows)=>`\u003cdiv class=\"to-scroll\">\u003ctable>\u003cthead>\u003ctr>${labels.map(x=>`\u003cth>${x}\u003c/th>`).join(\"\")}\u003c/tr>\u003c/thead>\u003ctbody>${rows.map(r=>`\u003ctr>${r.map(c=>`\u003ctd>${c}\u003c/td>`).join(\"\")}\u003c/tr>`).join(\"\")||`\u003ctr>\u003ctd colspan=\"${labels.length}\">조회 기간의 인사 발령이 없습니다.\u003c/td>\u003c/tr>`}\u003c/tbody>\u003c/table>\u003c/div>`;\n  root.innerHTML=`\u003cheader>\u003ch1>이직률 관리\u003c/h1>\u003cbutton type=\"button\" id=\"to-example\">${sample?\"인사기록 보기\":\"예시 보기\"}\u003c/button>\u003c/header>\u003cdiv class=\"to-filter\">\u003clabel>연도 \u003cselect id=\"to-year\">${Array.from({length:current-minYear+1},(_,i)=>current-i).map(y=>`\u003coption ${year===y?\"selected\":\"\"}>${y}\u003c/option>`).join(\"\")}\u003c/select>\u003c/label>\u003clabel>부서 \u003cselect id=\"to-dept\">\u003coption value=\"\">전사\u003c/option>${groups.map(g=>`\u003coption ${dept===g.name?\"selected\":\"\"}>${esc(g.name)}\u003c/option>`).join(\"\")}\u003c/select>\u003c/label>\u003cspan>${sample?\"예시 데이터\":\"인사기록 기준\"} · ${year===current?esc(today):year+\"-12-31\"}까지\u003c/span>\u003c/div>\u003cdiv class=\"to-kpi\">${kpi(\"누적 이직률\",pc(total.exits,total.avg))}${kpi(\"퇴직 인원\",total.exits+\"명\")}${kpi(\"일평균 재직 인원\",decimal(total.avg)+\"명\")}\u003c/div>\u003csection>\u003ch2>월별 이직률\u003c/h2>${table([\"월\",\"퇴직 인원\",\"평균 재직 인원\",\"이직률\",\"월별 추이\"],months.map(m=>[m.month+\"월\",m.exits+\"명\",decimal(m.avg)+\"명\",pc(m.exits,m.avg),`\u003cdiv class=\"to-track\" aria-hidden=\"true\">\u003ci style=\"width:${m.avg?100*(100*m.exits/m.avg)/peak:0}%\">\u003c/i>\u003c/div>`]))}\u003c/section>\u003csection>\u003ch2>부서별 이직률\u003c/h2>${table([\"부서\",\"퇴직 인원\",\"평균 재직 인원\",\"누적 이직률\"],selected(groups).map(g=>[esc(g.name),g.exits+\"명\",decimal(g.avg)+\"명\",pc(g.exits,g.avg)]))}\u003c/section>\u003cp class=\"to-note\">이직률은 조회 기간의 퇴직 건수를 같은 기간의 일평균 재직 인원으로 나눈 백분율입니다. 휴직자는 재직 인원에 포함하며, 퇴직은 발령 직전 소속 부서에 집계합니다. 평균 재직 인원이 0명이면 이직률은 ‘—’로 표시합니다.\u003c/p>`;\n  root.querySelector(\"#to-year\").onchange=e=>{year=Number(e.target.value);render();};root.querySelector(\"#to-dept\").onchange=e=>{dept=e.target.value;render();};root.querySelector(\"#to-example\").onclick=()=>{sample=!sample;year=current;dept=\"\";render();};\n }\n window.addEventListener(\"storage\",e=>{if(!sample&&(e.key===storageKey||e.key===null))render();});render();\n})();\n"]};

  .brand-caption{color:#b6c7d7;font-size:13px;font-weight:600;line-height:18px;text-align:center}
  nav{display:flex;flex-direction:column;gap:3px;padding:0 14px 16px;overflow:auto}
  .nav-group{padding:12px 12px 3px;font-size:12px;color:#b6c7d7}
  nav a{position:relative;display:flex;align-items:center;justify-content:center;min-height:39px;padding:8px 34px;border-radius:8px;color:#cbd9e5;font-size:15px;line-height:1.5;font-weight:700;text-align:center;text-decoration:none}
  nav a:hover{background:#213e52;color:#fff}
  nav a[aria-current]{background:#e2f4f3;color:#005c66}
  nav svg{position:absolute;left:12px;width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
  .bottom{margin:auto 14px 0;border-top:1px solid #364c60;padding:16px 2px;color:#b6c7d7;font-size:13px}
  .menu-toggle,.shade{display:none}
  .top{height:60px;padding:0 clamp(18px,2.4vw,36px);display:flex;align-items:center;gap:12px;background:#fff;border-bottom:1px solid #e5eaf1;font-size:15px}
  .top b{font-weight:750}.top span{color:#66758a}.top i{height:14px;border-left:1px solid #ccd4df}
  :is(a,button):focus-visible{outline:2px solid #78d9dc;outline-offset:2px}
  @media(max-width:900px){
    .top{height:55px;padding:0 14px;background:#152a3e;color:white;font-size:14px}.top span,.top i{display:none}
    .menu-toggle{display:grid;place-items:center;width:38px;height:38px;border:0;background:transparent;color:white;border-radius:6px;font-size:23px;cursor:pointer}
    .rail{display:none;top:55px;max-width:calc(100vw - 32px)}
    .rail.open{display:flex}.shade.open{display:block;position:fixed;inset:55px 0 0;background:#0f223755;border:0;z-index:31}
  }
  </style><div class="rail" id="product-menu"><a class="logo" href="?module=${Object.keys(pages)[0]}" aria-label="all hands ${config.product} 첫 화면">${config.logo}<span class="brand-caption">all hands | ${config.title}</span></a>
  
  <nav aria-label="${config.title} 주 메뉴">${Object.entries(config.menu).map(([id,name])=>
    `${id==="workforce"?'<strong class="nav-group">사업계획</strong>':id==="payGrades"?'<strong class="nav-group">임금관리</strong>':""}<a href="?module=${id}" ${id===key?'aria-current="page"':''}><svg viewBox="0 0 24 24" aria-hidden="true">${iconPaths[id]}</svg>${name}</a>`).join('')}</nav>
  <div class="bottom">시범 화면 · 브라우저 저장</div></div>
  <div class="shade"></div><div class="top"><button class="menu-toggle" type="button" aria-label="메뉴" aria-controls="product-menu" aria-expanded="false">☰</button><b>all hands ${config.product}</b><i></i><span>${config.title}</span><i></i><b>${label}</b></div>`;
  const toggle=shadow.querySelector('.menu-toggle');
  const rail=shadow.querySelector('.rail');
  const shade=shadow.querySelector('.shade');
  function setMenu(open){
    rail.classList.toggle('open',open);
    shade.classList.toggle('open',open);
    toggle.setAttribute('aria-expanded',String(open));
    if(open)rail.querySelector('nav [aria-current]').focus();
  }
  toggle.onclick=()=>setMenu(!rail.classList.contains('open'));
  shade.onclick=()=>{setMenu(false);toggle.focus()};
  document.addEventListener('keydown',e=>{if(e.key==='Escape'&&rail.classList.contains('open')){setMenu(false);toggle.focus()}});
  matchMedia('(max-width:900px)').addEventListener('change',()=>setMenu(false));
  const content=document.createElement('template');
  content.innerHTML=page.body;
  document.body.append(content.content);
  for(const source of page.scripts){
    const script=document.createElement('script');
    script.textContent=source;
    document.body.append(script);
  }
})();
</script></body></html>
