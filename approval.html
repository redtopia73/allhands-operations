<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>올핸즈 검토 요청</title><style>body{margin:0;background:#f4f7fb;color:#172852;font-family:Arial,'Malgun Gothic',sans-serif}.wrap{max-width:780px;margin:40px auto;padding:0 18px}.card{background:#fff;border:1px solid #dce4f0;border-radius:16px;padding:28px;box-shadow:0 10px 32px #17285212}.eyebrow{font-size:12px;font-weight:800;color:#ff6257;letter-spacing:.06em}.status{display:inline-block;border-radius:99px;padding:7px 11px;background:#fff0ed;color:#d34f43;font-weight:800;font-size:13px}.rows{margin:22px 0;border-top:1px solid #e3e8f1}.row{display:flex;justify-content:space-between;gap:18px;padding:12px 0;border-bottom:1px solid #e3e8f1}.row span{color:#64718a}.total{font-size:22px;font-weight:900}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:16px}button{border:0;border-radius:9px;padding:12px 16px;font:inherit;font-weight:800;cursor:pointer;background:#1b2a57;color:#fff}button.secondary{background:#eef2fa;color:#172852}button.reject{background:#fff0ed;color:#c6483d}textarea,input{box-sizing:border-box;width:100%;border:1px solid #ccd6e5;border-radius:8px;padding:11px;font:inherit;margin-top:6px}.label{font-size:13px;font-weight:800;margin-top:16px;display:block}.history{margin-top:28px;padding-top:18px;border-top:1px solid #e3e8f1}.history li{margin:8px 0;color:#53627d;font-size:14px}.error{color:#c6483d;font-weight:700}.attachment-note{margin:10px 0 0;color:#64718a;font-size:13px;line-height:1.55}@media(max-width:520px){.wrap{margin:16px auto}.card{padding:20px}.row{display:block}.row b{display:block;margin-top:5px}}</style></head><body><main class="wrap"><section class="card" id="app">불러오는 중입니다.</section></main><script>(()=>{const app=document.getElementById('app'),token=new URLSearchParams(location.search).get('token')||'',esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),statusLabel={pending:'검토 대기',opened:'열람 완료',approved:'승인 완료',rejected:'반려','revision-requested':'수정 요청'};let current;const download=()=>{const copy=app.cloneNode(true);copy.querySelectorAll('button,.actions,.history,textarea').forEach(n=>n.remove());copy.querySelectorAll('input').forEach(f=>{const s=document.createElement('span');s.textContent=f.value||'-';f.replaceWith(s)});const h=copy.querySelector('h1');if(h)h.textContent='원청 청구서 검토본 · 내부결재 첨부용';const cover=document.createElement('div');cover.style.cssText='padding:10px 12px;margin-bottom:16px;border:1px solid #9aa8bd;background:#f5f7fb;font-size:10pt;font-weight:bold';cover.textContent='올핸즈 청구서 검토 문서 · 내부결재 첨부용';copy.prepend(cover);const d=current.document||{},styles='<style>body{font-family:"Malgun Gothic",Arial,sans-serif;color:#172852;padding:24px}.card{max-width:900px;margin:auto}.rows{border-top:1px solid #9aa8bd}.row{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #d7dfe9}.row span{color:#53627d}.total{font-size:17px;font-weight:bold}.eyebrow{font-size:10pt;color:#d34f43}.status{display:inline-block;padding:5px 8px;background:#fff0ed;color:#c6483d;font-weight:bold;border-radius:99px}</style>',html='<!doctype html><html><head><meta charset="utf-8">'+styles+'</head><body>'+copy.outerHTML+'</body></html>',blob=new Blob(['\ufeff',html],{type:'application/vnd.ms-excel;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a'),client=String(d.invoiceClient||'원청').replace(/[\\/:*?"<>|]/g,'_'),month=String(d.invoiceMonth||d.month||'청구월');a.href=url;a.download=`원청청구서_내부결재첨부_${client}_${month}.xls`;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)};const render=()=>{const d=current.document||{},rows=Array.isArray(d.rows)?d.rows:[],items=rows.map(x=>`<div class="row"><span>${esc(x.applicationId?'인력 '+x.applicationId:'정산 항목')}</span><b>${esc(x.subtotal||x.net||'-')}</b></div>`).join(''),done=['approved','rejected','revision-requested'].includes(current.status);app.innerHTML=`<div class="eyebrow">ALLHANDS REVIEW</div><h1>${current.documentType==='invoice'?'청구서':'급여정산'} 검토 요청</h1><span class="status">${statusLabel[current.status]||current.status}</span><p>${esc(current.recipientName)} 담당자님, 아래 내용을 확인하고 회신해 주세요. 별도 회원가입은 필요하지 않습니다.</p><div class="rows"><div class="row"><span>대상월</span><b>${esc(d.invoiceMonth||d.month||'-')}</b></div><div class="row"><span>거래처·현장</span><b>${esc(d.invoiceClient||'-')}</b></div>${items}<div class="row total"><span>총액</span><b>${esc(d.invoiceGrandTotal||'-')}</b></div></div><div class="actions"><button type="button" class="secondary" id="approvalAttachmentDownload">내부결재 첨부파일 다운로드</button></div><p class="attachment-note">원청 내부결재에 첨부할 수 있도록 청구서 검토 내용과 현재 상태를 엑셀 파일로 내려받습니다.</p>${done?'<p><b>회신이 완료되었습니다.</b> 동일한 링크로 재회신할 수 없습니다.</p>':`<label class="label">회신자 성함<input id="responderName" value="${esc(current.recipientName)}"></label><label class="label">의견 <small>(반려·수정 요청 시 필수)</small><textarea id="comment" rows="4" placeholder="확인 내용 또는 수정 요청 사항을 입력하세요."></textarea></label><div class="actions"><button data-decision="approved">승인</button><button class="secondary" data-decision="revision-requested">수정 요청</button><button class="reject" data-decision="rejected">반려</button></div>`}<div class="history"><b>검토 기록</b><ul>${(current.events||[]).map(e=>`<li>${esc(e.at||'').slice(0,16).replace('T',' ')} · ${esc(e.label||e.type)}${e.actor?' · '+esc(e.actor):''}${e.comment?' — '+esc(e.comment):''}</li>`).join('')}</ul></div>`;document.getElementById('approvalAttachmentDownload').onclick=download;app.querySelectorAll('button[data-decision]').forEach(b=>b.onclick=()=>reply(b.dataset.decision))};async function load(){const r=await fetch('/api/external-approval?token='+encodeURIComponent(token)),o=await r.json();if(!r.ok)throw new Error(o.error||'검토 요청을 불러오지 못했습니다.');current=o.approval;render()}async function reply(decision){const r=await fetch('/api/external-approval',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token,decision,responderName:document.getElementById('responderName').value,comment:document.getElementById('comment').value})}),o=await r.json();if(!r.ok)return alert(o.error||'처리하지 못했습니다.');alert(o.message);load()}load().catch(e=>{app.innerHTML='<p class="error">'+esc(e.message)+'</p>'})})();</script></body></html>
