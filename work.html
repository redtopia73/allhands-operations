ing:9px 0}.milestone small{display:block}","body":"\n\u003cmain>\u003cnav aria-label=\"역할별 화면\" id=\"nav\">\u003c/nav>\u003cdiv id=\"app\">\u003c/div>\u003cp class=\"status\" id=\"msg\" role=\"status\">\u003c/p>\u003c/main>\u003cdialog id=\"dlg\">\u003cdiv class=\"dlghead\">\u003ch2 id=\"dt\">\u003c/h2>\u003cbutton aria-label=\"닫기\" onclick=\"dlg.close()\">×\u003c/button>\u003c/div>\u003cdiv id=\"dc\">\u003c/div>\u003c/dialog>\n","scripts":["\n'use strict';\nconst $=s=>document.querySelector(s), app=$('#app'), dlg=$('#dlg');\nconst esc=v=>String(v??'').replace(/[&\u003c>\"']/g,c=>({'&':'&amp;','\u003c':'&lt;','>':'&gt;','\"':'&quot;',\"'\":'&#39;'}[c]));\nconst labels=['경영진 종합보고','팀장 주간보고','팀원 내 업무'], teams=['채용운영팀','기업영업팀','운영지원팀'];\nconst members=[['직원 O','직원 Q'],['직원 R','직원 T'],['직원 U','직원 S']];\nconst ks=[\n{n:'현장 인력 채용',o:'직원 O',t:0,goal:240,base:196,u:'명',def:'출근이 확인된 신규 인원 수'},\n{n:'고객사 채용 의뢰 충족률',o:'직원 Q',t:0,goal:95,base:184,den:200,u:'%',def:'충원 인원 ÷ 의뢰 인원 × 100'},\n{n:'신규 고객사 계약',o:'직원 R',t:1,goal:36,base:29,u:'건',def:'신규 고객사와 체결한 계약 건수'},\n{n:'운영 매뉴얼 개정',o:'직원 U',t:2,goal:12,base:8,u:'건',def:'최종 검토를 마친 매뉴얼 개정 건수'}];\nconst task=(id,t,o,k,n,plan,result,next,q=0,den=0,status='진행 중',due='2026-11-23')=>({id,t,o,k,n,plan,result,next,q,den,status,due,help:'',feedback:''});\nconst seed=[task(1,0,'직원 O',0,'물류센터 신규 채용','5명 출근 확정','주간조 4명 출근','야간조 후보 2명 면접',4),task(2,0,'직원 Q',1,'고객사 충원 현황 점검','의뢰 5명 충원','5명 중 4명 충원','야간조 1명 추가 모집',4,5),task(3,0,'직원 Q',-1,'야간조 모집 채널 확대','추가 채널 견적 확인','광고 견적 10만 원 수령','승인 후 월요일 집행'),task(4,1,'직원 R',2,'신규 물류 고객사 계약','계약 2건 체결','2개사 계약 체결','운영팀에 인수인계',2,0,'완료'),task(5,1,'직원 T',-1,'주요 고객사 재계약 협의','단가 조정안 발송','고객사 1차 의견 수령','화요일 재협의'),task(6,2,'직원 U',3,'입사 안내 매뉴얼 개정','1건 최종 검토','현장 검토 후 개정 완료','개정본 현장 배포',1,0,'검토 요청'),task(7,2,'직원 S',-1,'현장 문의 채널 통합','문의 유형 분류','상위 문의 5종 정리','담당자 지정 및 안내')];\nconst key='public-demo-allhands.weekly.design.v1', clone=x=>JSON.parse(JSON.stringify(x));\nfunction initial(){const notes=[{summary:'신규 4명이 출근했고, 야간조 1명은 추가 모집 중입니다.',ask:'야간조 채용광고비 10만 원 집행 승인',by:'2026-11-23'},{summary:'신규 고객사 2곳과 계약을 체결했습니다.',ask:'',by:''},{summary:'입사 안내 매뉴얼 개정을 마쳤습니다.',ask:'',by:''}];const s={tasks:clone(seed),notes,reports:[null,null,null]};for(let t of [0,1])s.reports[t]=snapshot(s,t);return s}\nfunction snapshot(s,t){return clone({tasks:s.tasks.filter(x=>x.t===t),note:s.notes[t],kpis:ks.map((k,i)=>({...k,i})).filter(k=>k.t===t)})}\nlet state;try{state=JSON.parse(localStorage.getItem(key))||initial()}catch{state=initial()}\nlet role=0,team=2,member=members[2][0],detail=null;\nfunction save(){try{localStorage.setItem(key,JSON.stringify(state));return true}catch{return false}}\nfunction changed(m){const ok=save();dlg.close();render();$('#msg').textContent=m+(ok?'':' · 현재 창에서만 유지됩니다.')}\nfunction roleTo(i){role=i;detail=null;render()}function setTeam(t){team=Number(t);member=members[team][0];render()}\nfunction tag(t,style='neutral'){return '\u003cspan class=\"pill '+style+'\">'+esc(t)+'\u003c/span>'}\nfunction btn(label,act,cl='btn'){return '\u003cbutton class=\"'+cl+'\" onclick=\"'+act+'\">'+esc(label)+'\u003c/button>'}\nfunction opts(arr,v){return arr.map((n,i)=>'\u003coption value=\"'+i+'\" '+(i===v?'selected':'')+'>'+esc(n)+'\u003c/option>').join('')}\nfunction pop(title,body){$('#dt').textContent=title;$('#dc').innerHTML=body;if(!dlg.open)dlg.showModal()}\nfunction table(head,rows){return '\u003cdiv class=\"wrap\">\u003ctable>\u003cthead>\u003ctr>'+head.map(x=>'\u003cth>'+x+'\u003c/th>').join('')+'\u003c/tr>\u003c/thead>\u003ctbody>'+rows+'\u003c/tbody>\u003c/table>\u003c/div>'}\nfunction box(label,title,aside,body){return '\u003csection class=\"box\">\u003cdiv class=\"sectionhead\">\u003cdiv>\u003cdiv class=\"eyebrow\">'+label+'\u003c/div>\u003ch2>'+title+'\u003c/h2>\u003c/div>'+aside+'\u003c/div>'+body+'\u003c/section>'}\nfunction empty(m){return '\u003cdiv class=\"empty\">'+esc(m)+'\u003c/div>'}\nfunction data(){if(role===0){let list=detail===null?state.reports.filter(Boolean):[state.reports[detail]];return {tasks:list.flatMap(r=>r.tasks),kpis:list.flatMap(r=>r.kpis)}}let r=snapshot(state,team);if(role===2){r.tasks=r.tasks.filter(x=>x.o===member);r.kpis=r.kpis.filter(k=>k.o===member||r.tasks.some(x=>x.k===k.i))}return r}\nfunction stat(k,tasks){let hits=tasks.filter(x=>x.k===k.i),q=hits.reduce((s,x)=>s+x.q,0),den=hits.reduce((s,x)=>s+x.den,0),rate=k.u==='%',total=rate?(k.base+q)/(k.den+den)*100:k.base+q;\nreturn {hits,q,den,total,previous:rate?(k.base/k.den*100).toFixed(1)+'%':k.base+k.u,week:rate?(den?(q/den*100).toFixed(1)+'%':'—'):q+k.u,display:(rate?total.toFixed(1):total)+k.u,ratio:Math.round(total/k.goal*100)}}\nfunction kpiBox(d){const rows=d.kpis.map(k=>{const s=stat(k,role===2?state.tasks:d.tasks);return '\u003ctr>\u003ctd>'+btn(k.n,'openKpi('+k.i+')','link')+'\u003csmall>'+teams[k.t]+' · '+esc(k.o)+'\u003c/small>\u003c/td>\u003ctd class=\"num\">'+k.goal+k.u+'\u003c/td>\u003ctd class=\"num\">'+s.previous+'\u003c/td>\u003ctd class=\"num\">'+s.week+'\u003c/td>\u003ctd class=\"num\">\u003cb>'+s.display+'\u003c/b>\u003c/td>\u003ctd class=\"num\">'+s.ratio+'%\u003cdiv class=\"meter\">\u003ci style=\"width:'+Math.min(s.ratio,100)+'%\">\u003c/i>\u003c/div>\u003c/td>\u003c/tr>'}).join('');\nreturn box('연간 성과','연초 합의 KPI','\u003csmall>2026년 합의 기준\u003c/small>',rows?table(['성과지표 · 담당자','연간 목표','전주 누계','금주 실적','현재 누계','목표 달성률'],rows):empty('이 담당자에게 배정된 KPI가 없습니다.'))}\nfunction openKpi(i){const d=data(),k=d.kpis.find(k=>k.i===i),s=stat(k,role===2?state.tasks:d.tasks);pop(k.n,'\u003cp>'+esc(k.def)+'\u003c/p>\u003cp class=\"muted\">연간 목표 '+k.goal+k.u+' · 현재 누계 '+s.display+' · 목표 달성률 '+s.ratio+'%\u003c/p>'+(k.u==='%'?'\u003cp class=\"muted\">전주 '+k.base+'/'+k.den+'명, 금주 '+s.q+'/'+s.den+'명. 누계 충족률은 두 기간의 인원을 합산해 계산합니다.\u003c/p>':'')+'\u003ch3 style=\"margin-top:18px\">금주 실적에 반영된 업무\u003c/h3>'+ (s.hits.map(x=>'\u003cdiv class=\"history\">'+(role===2&&x.o!==member?esc(x.n):btn(x.n,'openTask('+x.id+')','link'))+'\u003cp>'+esc(x.result)+' · '+(k.u==='%'?x.q+'/'+x.den+'명':x.q+k.u)+'\u003c/p>\u003c/div>').join('')||empty('금주 연결 업무가 없습니다.')))}\nfunction taskRows(xs){return xs.map(x=>'\u003ctr>\u003ctd>'+btn(x.n,'openTask('+x.id+')','link')+'\u003csmall>'+esc(x.o)+' · '+teams[x.t]+'\u003c/small>\u003c/td>\u003ctd>'+esc(x.plan||'—')+'\u003c/td>\u003ctd>'+esc(x.result||'—')+'\u003c/td>\u003ctd>'+esc(x.next||'—')+'\u003c/td>\u003ctd>'+tag(x.status,x.status==='완료'?'':'neutral')+(x.help?' '+tag('지원 요청','warm'):'')+'\u003c/td>\u003c/tr>').join('')}\nfunction workBox(xs,kpi=false){let rows=taskRows(xs.filter(x=>kpi?x.k>=0:x.k\u003c0));return box(kpi?'실적 근거':'주간 현황',kpi?'KPI 연계 업무':'그 밖의 중요업무','',rows?table(['업무 · 담당자','금주 계획','금주 실적','차주 계획','상태'],rows):empty('등록된 업무가 없습니다.'))}\nfunction note(r){return '\u003cp class=\"pad\">'+esc(r.note.summary||'작성된 요약이 없습니다.')+'\u003c/p>'+(r.note.ask?'\u003cdiv class=\"note\">\u003cb>경영진 결정 요청\u003c/b>\u003cp>'+esc(r.note.ask)+'\u003c/p>\u003csmall>결정 기한 '+esc(r.note.by||'미정')+'\u003c/small>\u003c/div>':'')}\nfunction openReport(t){detail=t;render();window.scrollTo(0,0)}\nconst monthlyStaff = {\n  september: [\n    { opening: 56, joined: 3, left: 2 },\n    { opening: 25, joined: 2, left: 1 },\n    { opening: 17, joined: 1, left: 1 }\n  ],\n  october: [\n    { opening: 57, joined: 4, left: 1 },\n    { opening: 26, joined: 2, left: 1 },\n    { opening: 17, joined: 0, left: 0 }\n  ]\n};\nfunction staffTotals(rows) {\n  let opening = 0, joined = 0, left = 0;\n  for (const row of rows) {\n    opening += row.opening;\n    joined += row.joined;\n    left += row.left;\n  }\n  const closing = opening + joined - left;\n  const average = (opening + closing) / 2;\n  return { opening, joined, left, closing, turnover: average ? left / average * 100 : null };\n}\nfunction rateText(rate) {\n  return rate === null ? '—' : rate.toFixed(2) + '%';\n}\nfunction staffBox() {\n  const now = staffTotals(monthlyStaff.october);\n  const prior = staffTotals(monthlyStaff.september);\n  const metrics = [\n    ['월말 재직 인원', 'closing'], ['월간 입사', 'joined'], ['월간 퇴사', 'left'], ['월간 퇴사율', 'turnover']\n  ];\n  const cards = metrics.map(([label, key]) => {\n    const rate = key === 'turnover';\n    const value = rate ? rateText(now[key]) : now[key] + '명';\n    let delta = '비교 불가';\n    if (now[key] !== null && prior[key] !== null) {\n      const diff = now[key] - prior[key];\n      const amount = rate ? Math.abs(diff).toFixed(2) + '%p' : Math.abs(diff) + '명';\n      delta = diff === 0 ? '변동 없음' : amount + (diff > 0 ? ' 증가' : ' 감소');\n    }\n    return '\u003cdiv class=\"staff-card\">\u003cspan>' + label + '\u003c/span>\u003cstrong>' + value + '\u003c/strong>\u003csmall>전월 대비 ' + delta + '\u003c/small>\u003c/div>';\n  }).join('');\n  const rows = [...monthlyStaff.october.map((row, i) => [teams[i], staffTotals([row])]), ['전사 합계', now]];\n  const body = rows.map(([label, s]) => '\u003ctr>\u003ctd>' + label + '\u003c/td>' + [s.opening, s.joined, s.left, s.closing].map(v => '\u003ctd class=\"num\">' + v + '명\u003c/td>').join('') + '\u003ctd class=\"num\">' + rateText(s.turnover) + '\u003c/td>\u003c/tr>').join('');\n  const drilldown = '\u003cdetails class=\"staff-detail\">\u003csummary>팀별 인력현황 · 산정 기준\u003c/summary>' + table(['조직','월초 재직','입사','퇴사','월말 재직','퇴사율'], body) + '\u003cp class=\"muted pad\">월간 퇴사율 = 해당 월 퇴사자 수 ÷ 월평균 재직 인원 × 100. 월평균 재직 인원은 월초와 월말 재직 인원의 평균입니다. 전사 퇴사율은 전체 인원을 합산해 계산합니다.\u003c/p>\u003c/details>';\n  return box('월간 인사 지표', '전사 인력현황', '\u003csmall>2026년 10월 마감 · 9월 대비 · 예시\u003c/small>', '\u003cdiv class=\"staff-grid\">' + cards + '\u003c/div>' + drilldown);\n}\nconst projectRegister = [\n  {\n    title: '물류센터 신규 현장 가동', owner: '채용운영팀 · 직원 O', due: '11월 30일',\n    status: '지연', issue: '야간조 1명 미충원으로 시범 가동이 2일 지연됐습니다.',\n    action: '11월 23일까지 추가 채용광고비 10만 원 승인 요청',\n    steps: [['현장 운영 조건 확정',20,true,'11.06'],['인력 모집·선발',30,true,'11.13'],['주간조 교육 완료',20,true,'11.18'],['야간조 확보·시범 가동',20,false,'11.23'],['정식 가동',10,false,'11.30']]\n  },\n  {\n    title: '올핸잡 기업회원 접수 개 order-left:3px solid #bcc7d8}.readonly .meta{margin:8px 0}.readbody{margin:8px 0}.note{font-size:.94rem;color:var(--muted);margin-top:6px}dialog{border:0;border-radius:15px;padding:25px;max-width:460px;width:90%;box-shadow:0 14px 70px #15243e33}dialog::backdrop{background:#192a4266}#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#192e4f;color:white;border-radius:8px;padding:12px 20px;display:none;z-index:5}.skip{position:absolute;left:-999px}.skip:focus{left:12px;top:10px;background:white;z-index:10}\n@media(max-width:960px){#layout{grid-template-columns:190px minmax(0,1fr)}aside{padding:22px 10px}.hero{padding:22px;min-height:145px}th,td{padding:12px 8px}.suborgs{grid-template-columns:repeat(auto-fit,minmax(min(135px,100%),1fr))}.sub{padding:12px;gap:7px}.tileicon{width:29px;height:31px}.sub small{font-size:.77rem}}\n@media(max-width:720px){body>header{height:58px;padding:0 16px}#layout{display:block}aside{padding:10px 15px;border-right:0;border-bottom:1px solid var(--line)}.sideTitle{margin:0 0 6px}.sideTitle button{padding:1px 7px}nav{display:flex;overflow:auto;gap:4px}.treebtn{width:auto;white-space:nowrap;padding:8px!important;border:1px solid var(--line)}.treebtn:first-child{margin:0}.branch{display:none}main{padding:18px 14px 50px}.hero{min-height:130px}.hero .copy{max-width:70%}.shelf{right:5%}.book{width:25px}.suborgs{grid-template-columns:1fr}.sub{min-height:0}.sub small{display:inline;margin-left:10px}.sectionhead{margin-top:19px}.list{margin-top:18px}.listhead,.tools{padding-left:12px;padding-right:12px}.formgrid{grid-template-columns:1fr;gap:0}.panel,.step{padding:16px}.headline{flex-wrap:wrap}table{min-width:540px}.crumb{margin-bottom:12px}.hero p{font-size:.86rem}}\n\n","body":"\u003ca hidden=\"\" href=\"#\" id=\"brand\">\u003c/a>\u003ca class=\"skip\" href=\"#main\">본문으로\u003c/a>\u003cdiv id=\"layout\">\u003caside>\u003cdiv class=\"sideTitle\">조직 보관함 \u003cbutton aria-label=\"조직 추가\" id=\"addOrg\" title=\"조직 추가\">＋\u003c/button>\u003c/div>\u003cnav aria-label=\"조직 선택\" id=\"tree\">\u003c/nav>\u003c/aside>\u003cmain id=\"main\">\u003cp>보관함을 불러오는 중입니다.\u003c/p>\u003c/main>\u003c/div>\u003cdialog id=\"modal\">\u003c/dialog>\u003cdiv id=\"toast\" role=\"status\">\u003c/div>","scripts":["const callLocal=(()=>{const orgs=[\n{id:'hr',name:'HR사업본부',parent:'root'},\n{id:'recruit',name:'채용운영팀',parent:'hr'},\n{id:'partner',name:'기업지원팀',parent:'hr'},\n{id:'platform',name:'플랫폼사업본부',parent:'root'},\n{id:'service',name:'서비스운영팀',parent:'platform'},\n{id:'support',name:'경영지원본부',parent:'root'},\n{id:'people',name:'인사총무팀',parent:'support'}\n];\nconst rows=[\n['job','올핸잡 채용공고 등록','recruit','검토 완료',['구인업체의 공고를 접수한다.','근무지, 근무시간, 급여를 확인한다.','누락된 조건은 업체에 문의한다.','올핸잡에 공고를 등록한다.','게시된 링크를 열어 내용을 확인한다.']],\n['request','기업 채용의뢰 접수','partner','검토 요청',['기업의 채용의뢰를 접수한다.','직무와 채용 일정을 확인한다.','채용운영팀에 의뢰 내용을 전달한다.']],\n['new','신규 입사자 온보딩','people','검토 완료',['입사 일정을 확인한다.','첫날 안내와 준비물 목록을 발송한다.','입사 당일 준비물을 확인한다.']],\n['review','게시 공고 점검','service','작성 중',['게시 중인 공고 목록을 확인한다.','마감된 공고를 정리한다.']],\n['candidate','지원자 면접 일정 안내','recruit','작성 중',['면접 가능 일정을 확인한다.','면접 장소와 시간을 지원자에게 안내한다.']]\n];\nconst seeds=rows.map(([id,title,org,status,lines],i)=>({id,title,org,status,sample:true,raw:lines.join('\\n'),updated:'2026-11-'+String(20-i).padStart(2,'0')+'T01:00:00Z',steps:lines.map((line,j)=>({title:line.replace(/한다[.]$/,'하기'),body:line,check:id==='job'&&j===4?'게시된 링크에서 근무조건이 의뢰 내용과 일치한다.':'',flag:false,image:''}))}));\nconst summary=({id,title,org,status,updated,sample,steps})=>({id,title,org,status,updated,sample,count:steps.length});\n\n\nconst json=(body,status=200)=>Response.json(body,{status,headers:{'Cache-Control':'no-store'}});\nconst statuses=['작성 중','검토 요청','검토 완료'];\nconst enc=o=>btoa(Array.from(new TextEncoder().encode(JSON.stringify(o)),c=>String.fromCharCode(c)).join(''));\nconst dec=s=>JSON.parse(new TextDecoder().decode(Uint8Array.from(atob(s),c=>c.charCodeAt(0))));\nasync function records(bucket,prefix){\n const all=[]; let cursor;\n do{\n  const page=await bucket.list({prefix,cursor,include:['customMetadata']});\n  for(const object of page.objects)all.push(dec(object.customMetadata.info));\n  cursor=page.truncated?page.cursor:undefined;\n }while(cursor);\n return all;\n}\nconst service={async fetch(req,env){\n const url=new URL(req.url),path=url.pathname,store=env.BUCKET;\n if(path==='/'&&req.method==='GET')return new Response(PAGE,{headers:{'Content-Type':'text/html; charset=utf-8'}});\n if(!path.startsWith('/api/'))return new Response('Not found',{status:404});\n if(req.method!=='GET'&&req.headers.get('origin')&&req.headers.get('origin')!==url.origin)return json({},403);\n try{\n  if(path==='/api/list'&&req.method==='GET'){\n   const [extra,stored]=await Promise.all([records(store,'org/'),records(store,'doc/')]);\n   const merged=new Map(seeds.map(x=>[x.id,summary(x)]));stored.forEach(x=>merged.set(x.id,x));\n   return json({orgs:[...orgs,...extra],docs:[...merged.values()]});\n  }\n  const validOrg=async id=>orgs.some(o=>o.id===id)||(/^[a-z0-9-]{1,50}$/.test(id)&&!!await store.head('org/'+id));\n  if(path==='/api/org'&&req.method==='POST'){\n   const {name,parent}=await req.json();\n   if(typeof name!=='string'||!name.trim()||name.trim().length>40||(parent!=='root'&&!await validOrg(parent)))return json({error:'조직명과 상위 조직을 확인해 주세요.'},400);\n   const normalized=name.trim().normalize('NFC'); if(orgs.some(o=>o.parent===parent&&o.name===normalized))return json({error:'같은 이름의 조직이 있습니다.'},409);\n   const hash=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(parent+'/'+normalized));\n   const id=Array.from(new Uint8Array(hash).slice(0,14),v=>v.toString(16).padStart(2,'0')).join('');\n   const org={id,name:normalized,parent};\n   const saved=await store.put('org/'+id,JSON.stringify(org),{onlyIf:{etagDoesNotMatch:'*'},customMetadata:{info:enc(org)}});\n   return saved?json(org):json({error:'같은 이름의 조직이 있습니다.'},409);\n  }\n  const m=path.match(/^\\/api\\/doc\\/([a-z0-9-]{1,50})$/);if(!m)return json({},404);\n  const id=m[1],key='doc/'+id;\n  if(req.method==='GET'){\n   const obj=await store.get(key);if(obj)return json({doc:await obj.json(),rev:obj.etag});\n   const seed=seeds.find(d=>d.id===id);return seed?json({doc:seed,rev:''}):json({},404);\n  }\n  if(req.method!=='PUT')return json({},405);\n  const payload=await req.text();if(payload.length>9000000)return json({error:'첨부 이미지를 줄여 주세요.'},413);\n  const {doc,rev}=JSON.parse(payload);\n  if(doc.id!==id||typeof doc.title!=='string'||!doc.title.trim()||doc.title.length>100||!await validOrg(doc.org)||!statuses.includes(doc.status)||!Array.isArray(doc.steps)||!doc.steps.length||doc.steps.length>100||doc.steps.some(s=>!s.title?.trim()||(s.image&&!/^data:image\\/(?:png|webp|jpeg);base64,/.test(s.image))))return json({error:'소속 조직과 제목, 단계 내용을 확인해 주세요.'},400);\n  doc.sample=false;doc.updated=new Date().toISOString();\n  const obj=await store.put(key,JSON.stringify(doc),{onlyIf:rev?{etagMatches:rev}:{etagDoesNotMatch:'*'},customMetadata:{info:enc(summary(doc))}});\n  return obj?json({doc,rev:obj.etag}):json({error:'다른 화면에서 먼저 저장했습니다. 현재 내용을 복사한 뒤 다시 열어 주세요.'},409);\n }catch(err){return json({error:'데이터를 불러오거나 저장하지 못했습니다. 잠시 후 다시 시도해 주세요.'},500);}\n}};\n\n\n\nconst database=new Promise((resolve,reject)=>{const req=indexedDB.open('public-demo-allhands-manual-archive-1',1);req.onupgradeneeded=()=>req.result.createObjectStore('records');req.onerror=()=>reject(req.error);req.onsuccess=()=>resolve(req.result)});\nasync function transact(mode,run){const db=await database;return new Promise((resolve,reject)=>{const tx=db.transaction('records',mode),table=tx.objectStore('records');let result;run(table,value=>result=value);tx.oncomplete=()=>resolve(result);tx.onerror=()=>reject(tx.error);tx.onabort=()=>reject(tx.error)})}\nconst localBucket={\n async list({prefix}){return transact('readonly',(table,done)=>{const objects=[];const req=table.openCursor(IDBKeyRange.bound(prefix,prefix+'\\uffff'));req.onsuccess=()=>{const c=req.result;if(c){objects.push({customMetadata:c.value.customMetadata});c.continue()}else done({objects,truncated:false})}})},\n async head(key){return transact('readonly',(table,done)=>{const r=table.get(key);r.onsuccess=()=>done(r.result)})},\n async get(key){const r=await this.head(key);return r?{etag:r.etag,json:async()=>JSON.parse(r.value)}:null},\n async put(key,value,{onlyIf,customMetadata}){return transact('readwrite',(table,done)=>{const r=table.get(key);r.onsuccess=()=>{const old=r.result;if((onlyIf.etagDoesNotMatch==='*'&&old)||(onlyIf.etagMatches&&old?.etag!==onlyIf.etagMatches)){done(null);return}const etag=crypto.randomUUID();table.put({etag,value,customMetadata},key);done({etag})}})}\n};\nreturn async (url,options)=>service.fetch(new Request('https://manual.local'+url,options),{BUCKET:localBucket});})();\nconst $=s=>document.querySelector(s);\nconst main=$('#main'),tree=$('#tree'),modal=$('#modal');\nlet orgs=[],docs=[],org='root',view='list',draft=null,rev='',dirty=false,query='',filter='',busy=false,routeToken=0;\nconst labels=['작성 중','검토 요청','검토 완료'];\nconst esc=v=>String(v??'').replace(/[&\u003c>\"']/g,c=>({'&':'&amp;','\u003c':'&lt;','>':'&gt;','\"':'&quot;',\"'\":'&#39;'}[c]));\nconst title=id=>id==='root'?'전체 조직':orgs.find(o=>o.id===id)?.name||'미지정';\nfunction lineage(id){const ids=[];while(id&&id!=='root'&&!ids.includes(id)){ids.unshift(id);id=orgs.find(o=>o.id===id)?.parent}return ids}\nconst belongs=(child,parent)=>parent==='root'||lineage(child).includes(parent);\nconst count=id=>docs.filter(d=>belongs(d.org,id)).length;\nconst path=id=>lineage(id).map(title).join(' › ');\nconst badge=s=>'\u003cspan class=\"status s'+labels.indexOf(s)+'\">'+esc(s)+'\u003c/span>';\nlet toastTimer;\nfunction toast(s){const t=$('#toast');t.textContent=s;t.style.display='block';clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.style.display='none',3100)}\nasync function api(url,method='GET',body){const r=await callLocal('/api/'+ ent 50%,#39506a 50%) right 15px center/5px 5px no-repeat;padding-right:30px}textarea{resize:vertical;min-height:72px}dialog{border:0;border-radius:13px;padding:0;width:min(610px,94vw);max-height:88vh;color:inherit;box-shadow:0 30px 80px #14223d40}dialog::backdrop{background:#13243c75}#modalBody{padding:24px}#modalBody>.line{margin-bottom:18px}.close{font-size:1.3rem;padding:0 10px}.end{justify-content:flex-end}.empty{padding:28px;text-align:center;color:#5d6c7e}.section{margin:18px 0 8px}.detail{display:grid;grid-template-columns:125px 1fr;gap:7px 12px;margin:12px 0}.detail dt{font-size:.9rem;color:#55697d}.detail dd{margin:0;white-space:pre-line;overflow-wrap:anywhere}.note{background:#f4f7fa;padding:12px 15px;border-radius:7px;white-space:pre-line}.qa{border-left:3px solid #95acbf;padding:5px 12px;margin:12px 0;white-space:pre-wrap}.split{display:grid;grid-template-columns:minmax(0,3fr) minmax(210px,1fr);gap:18px;padding:18px}.calendar{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-top:1px solid #d9e1ea;border-left:1px solid #d9e1ea}.calendar>*{border:0;border-bottom:1px solid #d9e1ea;border-right:1px solid #d9e1ea;border-radius:0;padding:6px}.dow{text-align:center;background:#f5f7fa;color:#50647a;font-size:.88rem}.day{min-height:84px;text-align:left;display:flex;align-items:flex-start;flex-direction:column;gap:3px}.day.sel{box-shadow:inset 0 0 0 2px #477aa0}.event{font-size:.78rem;background:#ecf2f7;border-radius:3px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:1px 3px}.side{border-left:1px solid #dce3ea;padding-left:14px}.side button{display:block;margin:5px 0}.sample{font-size:.86rem;color:#596b7b}.actions,.countline{flex-wrap:wrap}footer{border-top:1px solid #dce2e9;max-width:1300px;margin:0 auto;padding:18px 2vw;color:#596a7a;font-weight:700}footer span{font-size:.82rem;font-weight:400;margin-left:10px}#toast:not(:empty){position:fixed;bottom:22px;left:50%;transform:translateX(-50%);color:white;background:#132844;padding:10px 18px;border-radius:7px;z-index:9}button:disabled{opacity:.5;cursor:default}.workitem+.workitem{border-top:1px solid #d9e1ea;margin-top:15px;padding-top:15px}@media(max-width:760px){main{padding:24px 14px}header{padding:0 16px}.workspace{display:none}nav{gap:16px;padding:0 14px}nav button{font-size:.88rem}.cards{gap:7px}.metric{display:block;padding:8px}.metric span,.metric b{display:block}.metric span{font-size:.82rem}.heading{align-items:flex-start;flex-wrap:wrap}.split,.row2{grid-template-columns:1fr}.side{border:0;padding:0}.day{min-height:48px}.event{display:none}.day.has:after{content:\"\";border-radius:50%;width:6px;height:6px;background:#3d729b}.sheet,.bar{padding:14px}.detail{grid-template-columns:85px 1fr}td,th{white-space:nowrap;padding:11px 12px}.bar{gap:10px}.split{padding:8px}}\n","body":"\n\n\u003cnav aria-label=\"주 메뉴\" id=\"nav\">\u003c/nav>\u003cmain id=\"main\">\u003c/main>\u003cdialog id=\"modal\">\u003cdiv id=\"modalBody\">\u003c/div>\u003c/dialog>\u003cdiv id=\"toast\" role=\"status\">\u003c/div>\u003cfooter>all hands \u003cspan>채용운영팀 시범 공간 · 이 브라우저에 저장됩니다\u003c/span>\u003c/footer>","scripts":["const callLocal=(()=>{const orgs=[\n{id:'hr',name:'HR사업본부',parent:'root'},\n{id:'recruit',name:'채용운영팀',parent:'hr'},\n{id:'partner',name:'기업지원팀',parent:'hr'},\n{id:'platform',name:'플랫폼사업본부',parent:'root'},\n{id:'service',name:'서비스운영팀',parent:'platform'},\n{id:'support',name:'경영지원본부',parent:'root'},\n{id:'people',name:'인사총무팀',parent:'support'}\n];\nconst rows=[\n['job','올핸잡 채용공고 등록','recruit','검토 완료',['구인업체의 공고를 접수한다.','근무지, 근무시간, 급여를 확인한다.','누락된 조건은 업체에 문의한다.','올핸잡에 공고를 등록한다.','게시된 링크를 열어 내용을 확인한다.']],\n['request','기업 채용의뢰 접수','partner','검토 요청',['기업의 채용의뢰를 접수한다.','직무와 채용 일정을 확인한다.','채용운영팀에 의뢰 내용을 전달한다.']],\n['new','신규 입사자 온보딩','people','검토 완료',['입사 일정을 확인한다.','첫날 안내와 준비물 목록을 발송한다.','입사 당일 준비물을 확인한다.']],\n['review','게시 공고 점검','service','작성 중',['게시 중인 공고 목록을 확인한다.','마감된 공고를 정리한다.']],\n['candidate','지원자 면접 일정 안내','recruit','작성 중',['면접 가능 일정을 확인한다.','면접 장소와 시간을 지원자에게 안내한다.']]\n];\nconst seeds=rows.map(([id,title,org,status,lines],i)=>({id,title,org,status,sample:true,raw:lines.join('\\n'),updated:'2026-11-'+String(20-i).padStart(2,'0')+'T01:00:00Z',steps:lines.map((line,j)=>({title:line.replace(/한다[.]$/,'하기'),body:line,check:id==='job'&&j===4?'게시된 링크에서 근무조건이 의뢰 내용과 일치한다.':'',flag:false,image:''}))}));\nconst summary=({id,title,org,status,updated,sample,steps})=>({id,title,org,status,updated,sample,count:steps.length});\n\n\nconst json=(body,status=200)=>Response.json(body,{status,headers:{'Cache-Control':'no-store'}});\nconst statuses=['작성 중','검토 요청','검토 완료'];\nconst enc=o=>btoa(Array.from(new TextEncoder().encode(JSON.stringify(o)),c=>String.fromCharCode(c)).join(''));\nconst dec=s=>JSON.parse(new TextDecoder().decode(Uint8Array.from(atob(s),c=>c.charCodeAt(0))));\nasync function records(bucket,prefix){\n const all=[]; let cursor;\n do{\n  const page=await bucket.list({prefix,cursor,include:['customMetadata']});\n  for(const object of page.objects)all.push(dec(object.customMetadata.info));\n  cursor=page.truncated?page.cursor:undefined;\n }while(cursor);\n return all;\n}\nconst service={async fetch(req,env){\n const url=new URL(req.url),path=url.pathname,store=env.BUCKET;\n if(path==='/'&&req.method==='GET')return new Response(PAGE,{headers:{'Content-Type':'text/html; charset=utf-8'}});\n if(!path.startsWith('/api/'))return new Response('Not found',{status:404});\n if(req.method!=='GET'&&req.headers.get('origin')&&req.headers.get('origin')!==url.origin)return json({},403);\n try{\n  if(path==='/api/list'&&req.method==='GET'){\n   const [extra,stored]=await Promise.all([records(store,'org/'),records(store,'doc/')]);\n   const merged=new Map(seeds.map(x=>[x.id,summary(x)]));stored.forEach(x=>merged.set(x.id,x));\n   return json({orgs:[...orgs,...extra],docs:[...merged.values()]});\n  }\n  const validOrg=async id=>orgs.some(o=>o.id===id)||(/^[a-z0-9-]{1,50}$/.test(id)&&!!await store.head('org/'+id));\n  if(path==='/api/org'&&req.method==='POST'){\n   const {name,parent}=await req.json();\n   if(typeof name!=='string'||!name.trim()||name.trim().length>40||(parent!=='root'&&!await validOrg(parent)))return json({error:'조직명과 상위 조직을 확인해 주세요.'},400);\n   const normalized=name.trim().normalize('NFC'); if(orgs.some(o=>o.parent===parent&&o.name===normalized))return json({error:'같은 이름의 조직이 있습니다.'},409);\n   const hash=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(parent+'/'+normalized));\n   const id=Array.from(new Uint8Array(hash).slice(0,14),v=>v.toString(16).padStart(2,'0')).join('');\n   const org={id,name:normalized,parent};\n   const saved=await store.put('org/'+id,JSON.stringify(org),{onlyIf:{etagDoesNotMatch:'*'},customMetadata:{info:enc(org)}});\n   return saved?json(org):json({error:'같은 이름의 조직이 있습니다.'},409);\n  }\n  const m=path.match(/^\\/api\\/doc\\/([a-z0-9-]{1,50})$/);if(!m)return json({},404);\n  const id=m[1],key='doc/'+id;\n  if(req.method==='GET'){\n   const obj=await store.get(key);if(obj)return json({doc:await obj.json(),rev:obj.etag});\n   const seed=seeds.find(d=>d.id===id);return seed?json({doc:seed,rev:''}):json({},404);\n  }\n  if(req.method!=='PUT')return json({},405);\n  const payload=await req.text();if(payload.length>9000000)return json({error:'첨부 이미지를 줄여 주세요.'},413);\n  const {doc,rev}=JSON.parse(payload);\n  if(doc.id!==id||typeof doc.title!=='string'||!doc.title.trim()||doc.title.length>100||!await validOrg(doc.org)||!statuses.includes(doc.status)||!Array.isArray(doc.steps)||!doc.steps.length||doc.steps.length>100||doc.steps.some(s=>!s.title?.trim()||(s.image&&!/^data:image\\/(?:png|webp|jpeg);base64,/.test(s.image))))return json({error:'소속 조직과 제목, 단계 내용을 확인해 주세요.'},400);\n  doc.sample=false;doc.updated=new Date().toISOString();\n  const obj=await store.put(key,JSON.stringify(doc),{onlyIf:rev?{etagMatches:rev}:{etagDoesNotMatch:'*'},customMetadata:{info:enc(summary(doc))}});\n  return obj?json({doc,rev:obj.etag}):json({erro 3cb>질문 · '+esc(doc.to)+'\u003c/b>\u003cp>'+esc(q.q)+'\u003c/p>'+(q.a?'\u003cb>답변 · '+esc(doc.from)+'\u003c/b>\u003cp>'+esc(q.a)+'\u003c/p>':button(\"인계자로 답변 작성\",\"answer\",q.id))+'\u003c/div>').join(\"\");\n return '\u003carticle class=\"workitem\">\u003cdiv class=\"line\">\u003ch3>'+esc(it.name)+'\u003c/h3>\u003cdiv class=\"actions\">'+badge(it.accepted?\"인수 확인됨\":\"인수 대기\",it.accepted)+badge(it.done?\"업무 완료\":\"업무 진행 중\",it.done)+'\u003c/div>\u003c/div>'+detail+'\u003ch3>질문과 답변 · '+it.qa.length+'건\u003c/h3>'+qa+(pending?'\u003cp class=\"sample\">답변 대기 '+pending+'건\u003c/p>':\"\")+'\u003cdiv class=\"actions section\">'+(leader?\"\":button(\"질문 작성\",\"ask\",it.id)+(it.accepted?\"\":button(\"인수 확인\",\"accept\",it.id,\"primary\"))+(it.done?\"\":button(\"업무 완료 처리\",\"done\",it.id)))+'\u003c/div>\u003c/article>'\n}\nlet receiver=\"*\";\nfunction documents(leader){\n const docs=db.docs.filter(d=>leader||receiver===\"*\"||d.to===receiver),items=docs.flatMap(d=>d.items),pending=items.flatMap(i=>i.qa).filter(q=>!q.a).length;\n const summary=leader?'\u003cdiv class=\"cards\">'+[[\"전체 항목\",items.length],[\"인수 대기\",items.filter(i=>!i.accepted).length],[\"답변 대기\",pending],[\"업무 완료\",items.filter(i=>i.done).length]].map(([l,n],i)=>'\u003cdiv class=\"metric p'+i+'\">\u003cspan>'+l+'\u003c/span>\u003cb>'+n+'\u003c/b>\u003c/div>').join(\"\")+'\u003c/div>':\"\";\n return heading(pages[leader?3:2],leader?\"인계서별 인수 여부와 업무 진행 상황, 미답변 질문을 확인하세요.\":\"항목별로 질문을 남기고 인수 확인과 실제 업무 완료를 각각 기록하세요.\",leader?\"\":select(\"인수자 보기\",\"receiver\",[[\"*\",\"전체 인수자\"],...Array.from(new Set(db.docs.map(d=>d.to))).map(n=>[n,n])],receiver))+summary+docs.map(d=>'\u003csection class=\"sheet\">\u003cdiv class=\"line\">\u003ch2>'+esc(d.title)+'\u003c/h2>\u003cspan class=\"sample\">'+esc(d.date)+'\u003c/span>\u003c/div>\u003cp class=\"muted\">인계자 '+esc(d.from)+' · 인수자 '+esc(d.to)+'\u003c/p>\u003chr style=\"border:0;border-top:1px solid #dde4eb;margin:16px 0\">'+d.items.map(it=>itemCard(d,it,leader)).join(\"\")+'\u003c/section>').join(\"\")\n}\nfunction render(){ $(\"nav\").innerHTML=pages.map((p,i)=>button(p,\"page\",i,i===page?\"on\":\"\")).join(\"\");$(\"main\").innerHTML=page===0?overview():page===1?draftEditor():documents(page===3)}\nfunction allItems(){return db.docs.flatMap(d=>d.items)}\ndocument.addEventListener(\"click\",e=>{\n const b=e.target.closest(\"[data-act]\");if(!b)return;\n const {act,id}=b.dataset;\n if(act===\"close\")return $(\"modal\").close();\n if(act===\"task\")return taskEditor(id);\n if(act===\"pick\")return picker();\n if(act===\"ask\"||act===\"answer\"){const title=act===\"ask\"?\"인수자 질문 작성\":\"인계자 답변 작성\";return modal(title,'\u003cform id=\"qaForm\" class=\"stack\" data-mode=\"'+act+'\" data-id=\"'+id+'\">'+field(act===\"ask\"?\"질문 내용\":\"답변 내용\",\"message\",\"\",\"area\",true)+'\u003cbutton class=\"primary\">등록\u003c/button>\u003c/form>')}\n if(act===\"page\"){captureDraft();page=Number(id)}\n if(act===\"view\")view=id;\n if(act===\"filter\")filter=filter===Number(id)?-1:Number(id);\n if(act===\"month\"){month=new Date(month.getFullYear(),month.getMonth()+Number(id),1);selected=dateKey(month)}\n if(act===\"today\"){month=new Date(today.getFullYear(),today.getMonth(),1);selected=dateKey(today)}\n if(act===\"day\")selected=id;\n if(act===\"remove\"){captureDraft();draft.items=draft.items.filter(it=>it.id!==id);saveDraft()}\n if(act===\"add\"){const t=db.tasks.find(x=>x.id===id);if(draft.items.some(x=>x.source===id))return;draft.items.push({...t,id:uid(),source:t.id,current:\"\",next:\"\",due:\"\",qa:[],accepted:false,done:false});saveDraft();render();picker();return}\n if(act===\"accept\"||act===\"done\"){const it=allItems().find(x=>x.id===id);it[act===\"accept\"?\"accepted\":\"done\"]=true;if(persist())notice(act===\"accept\"?\"인수를 확인했습니다.\":\"업무를 완료했습니다.\")}\n render()\n});\ndocument.addEventListener(\"input\",e=>{if(e.target.closest(\"#draftForm\"))captureDraft()});\ndocument.addEventListener(\"change\",e=>{\n const el=e.target,f=el.form;\n if(f?.id===\"taskForm\"&&el.name===\"p\")$(\"rules\").innerHTML=ruleFields(Number(el.value),\"\");\n if(f?.id===\"taskForm\"&&el.name===\"manual\"&&el.value!==\"\"){const m=manuals[Number(el.value)];f.elements.steps.value=m[1];f.elements.ref.value=m[2];if(!f.elements.name.value)f.elements.name.value=m[0]}\n if(el.dataset.load&&el.value!==\"\"){captureDraft();const it=draft.items.find(x=>x.id===el.dataset.load),m=manuals[Number(el.value)];it.steps=m[1];it.ref=m[2];saveDraft();render();notice(\"매뉴얼을 불러왔습니다.\")}\n if(el.name===\"receiver\"){receiver=el.value;render()}\n});\ndocument.addEventListener(\"submit\",e=>{\n e.preventDefault();const f=e.target,v=Object.fromEntries(new FormData(f));\n if(f.id===\"taskForm\"){if(!v.name.trim())return notice(\"업무명을 입력해 주세요.\");let rule=v.rule||\"\";\n if(Number(v.p)===3&&(v.m||v.d)){if(!v.m||!v.d||Number(v.d)>new Date(2028,Number(v.m),0).getDate())return notice(\"유효한 월과 일을 선택해 주세요.\");rule=v.m.padStart(2,\"0\")+\"-\"+v.d.padStart(2,\"0\")}\n const t={id:f.dataset.id||uid(),name:v.name.trim(),p:Number(v.p),rule,time:v.time,steps:v.steps.trim(),ref:v.ref.trim()};\n const ix=db.tasks.findIndex(x=>x.id===t.id);if(ix\u003c0)db.tasks.push(t);else db.tasks[ix]=t;if(!persist())return;$(\"modal\").close();notice(\"업무를 저장했습니다.\")}\n if(f.id===\"draftForm\"){captureDraft();if(!draft.items.length)return notice(\"인계할 업무를 한 개 이상 선택해 주세요.\");if(![draft.title,draft.from,draft.to,...draft.items.map(i=>i.next)].every(v=>v.trim()))return notice(\"제목, 이름, 다음 행동을 입력해 주세요.\");db.docs.unshift({...structuredClone(draft),id:uid()});if(!persist())return;receiver=draft.to;draft=newDraft();saveDraft();page=2;notice(\"인계서를 전달했습니다.\")}\n if(f.id===\"qaForm\"){const message=v.message.trim();if(!message)return notice(\"내용을 입력해 주세요.\");if(f.dataset.mode===\"ask\"){allItems().find(it=>it.id===f.dataset.id).qa.push({id:uid(),q:message,a:\"\"})}else{allItems().flatMap(it=>it.qa).find(q=>q.id===f.dataset.id).a=message}if(!persist())return;$(\"modal\").close();notice(\"등록했습니다.\")}\n render()\n});\nrender();\n\n        async function includeWorkManuals() {\n          const listing = await (await callLocal('/api/list')).json();\n          const docs = await Promise.all(listing.docs.map(async item =>\n            (await (await callLocal('/api/doc/' + encodeURIComponent(item.id))).json()).doc));\n          for (const doc of docs.filter(Boolean)) {\n            const steps = doc.steps.map((step, i) =>\n              (i + 1) + '. ' + step.title + (step.body ? '\\n' + step.body : '')).join('\\n');\n            manuals.push([doc.title, steps, 'WORK 업무매뉴얼 / ' + doc.title]);\n          }\n          for (const select of document.querySelectorAll('select[name=manual],select[data-load]')) {\n            const start = select.options.length - 1;\n            manuals.slice(start).forEach((m,i)=>select.add(new Option(m[0], start+i)));\n          }\n        }\n        includeWorkManuals().catch(()=>notice('조직 보관함을 열 수 없습니다. 기본 매뉴얼을 표시합니다.'));\n        "]}};

  pages.teamTasks={"styles":"#team-tasks{margin:auto;max-width:1640px;padding:30px;font-size:15px}#team-tasks *{box-sizing:border-box}#team-tasks header,#team-tasks .task-filters,#team-tasks footer{display:flex;align-items:center;gap:10px;flex-wrap:wrap}#team-tasks h1{font-size:28px;margin-right:auto}#team-tasks section{border:1px solid #dae3ee;border-radius:10px;background:white}#team-tasks .task-filters{padding:16px}#team-tasks .task-filters b{margin-left:auto}#team-tasks input,#team-tasks select,#team-tasks button,#team-tasks textarea{font:inherit;color:inherit;background:white;border:1px solid #c7d4e1;border-radius:6px;padding:7px 10px}#team-tasks button{cursor:pointer}#team-tasks .primary{background:#233957;color:white}#team-tasks .scroll{overflow:auto}#team-tasks table{width:100%;border-collapse:collapse;font-size:14px}#team-tasks th,#team-tasks td{text-align:left;vertical-align:top;border-bottom:1px solid #e1e8ee;padding:12px 9px;white-space:nowrap}#team-tasks thead{background:#eef3f8}#team-tasks td.narr{min-width:115px;white-space:pre-line;overflow-wrap:anywhere}#team-tasks td.narr:nth-child(3){min-width:195px}#team-tasks small{display:block;color:#246777}#team-tasks .textlink{border:0;color:#006e80;padding:0;font-weight:700;text-decoration:underline}#team-tasks dialog{width:min(650px,94vw);max-height:84vh;border:1px solid #c3ccd8;border-radius:12px;padding:22px;color:inherit}#team-tasks dialog::backdrop{background:#172a4855}#team-tasks .task-fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}#team-tasks .task-fields label{display:grid;gap:4px}#team-tasks .wide{grid-column:1/-1}#team-tasks textarea{min-height:60px}#team-tasks footer{justify-content:flex-end}#team-tasks [role=alert]{color:#9a2b35}@media(max-width:580px){#team-tasks{padding:12px}#team-tasks .task-fields{grid-template-columns:1fr}}","body":"\u003cmain id=\"team-tasks\">\u003c/main>","scripts":["(function teamTasks(){\n const el=document.getElementById(\"team-tasks\"),storage=\"public-demo-allhands-work-team-tasks-v1\",fmt=d=>d?d.replaceAll(\"-\",\".\"):\"—\";\n const esc=v=>String(v??\"\").replace(/[&\u003c>\"']/g,c=>({\"&\":\"&amp;\",\"\u003c\":\"&lt;\",\">\":\"&gt;\",'\"':\"&quot;\",\"'\":\"&#39;\"})[c]);\n const fields=[[\"start\",\"시작일\",\"date\"],[\"type\",\"업무구분\",\"text\"],[\"detail\",\"업무 세부 내용\",\"textarea\"],[\"plan\",\"진행 계획·지시사항\",\"textarea\"],[\"owner\",\"담당\",\"text\"],[\"end\",\"종료일\",\"date\"],[\"status\",\"진행상태\",\"select\"],[\"memo\",\"메모\",\"textarea\"],[\"volume\",\"업무량\",\"number\"],[\"difficulty\",\"난이도\",\"number\"],[\"timing\",\"적시성\",\"number\"],[\"quality\",\"완성도\",\"number\"]];\n const statuses=[\"예정\",\"진행중\",\"보류\",\"완료\"];\n const demo=[{start:\"2026-01-02\",type:\"연말정산\",detail:\"준비서류 발급 안내\\n접수된 자료 확인\",plan:\"문의가 많은 항목을 안내문에 반영\",owner:\"인사담당\",status:\"진행중\"},{start:\"2026-01-13\",type:\"조직개편\",detail:\"조직도 작성\\n조직개편 시행 안내문 작성\",plan:\"시행문 공지\",owner:\"기획담당\",status:\"예정\"},{start:\"2025-12-21\",type:\"인사평가\",detail:\"인사평가 결과 통계 작성\",plan:\"월말 결과 보고\",owner:\"평가담당\",end:\"2025-12-30\",status:\"완료\",memo:\"보완 의견 반영\",volume:3,difficulty:3,timing:9,quality:8}];\n let snapshot=localStorage.getItem(storage),records=JSON.parse(snapshot||\"[]\"),example=false,owner=\"\",status=\"\";\n function draw(){\n  const all=example?demo:records,display=all.filter(r=>(!owner||r.owner===owner)&&(!status||r.status===status));\n  const opts=(list,value)=>list.map(v=>`\u003coption ${value===v?\"selected\":\"\"}>${esc(v)}\u003c/option>`).join(\"\");\n  const body=display.map(r=>`\u003ctr>\u003ctd>${fmt(r.start)}\u003c/td>\u003cth scope=\"row\">${example?esc(r.type):`\u003cbutton class=\"textlink\" data-edit=\"${esc(r.id)}\">${esc(r.type)}\u003c/button>`}\u003c/th>\u003ctd class=\"narr\">${esc(r.detail)}\u003c/td>\u003ctd class=\"narr\">${esc(r.plan)||\"—\"}\u003c/td>\u003ctd>${esc(r.owner)}\u003c/td>\u003ctd>${fmt(r.end)}\u003csmall>${esc(r.status)}\u003c/small>\u003c/td>\u003ctd class=\"narr\">${esc(r.memo)||\"—\"}\u003c/td>${[\"volume\",\"difficulty\",\"timing\",\"quality\"].map(k=>`\u003ctd>${esc(r[k]??\"\")||\"—\"}\u003c/td>`).join(\"\")}\u003c/tr>`).join(\"\");\n  el.innerHTML=`\u003cheader>\u003ch1>팀원업무관리\u003c/h1>\u003cbutton id=\"examples\">${example?\"등록 업무 보기\":\"작성 예시 보기\"}\u003c/button>\u003cbutton class=\"primary\" id=\"newtask\">업무 등록\u003c/button>\u003c/header>\u003csection>\u003cdiv class=\"task-filters\">\u003clabel>담당 \u003cselect id=\"by-owner\">\u003coption value=\"\">전체 담당자\u003c/option>${opts([...new Set(all.map(r=>r.owner))].sort(),owner)}\u003c/select>\u003c/label>\u003clabel>진행상태 \u003cselect id=\"by-status\">\u003coption value=\"\">전체 상태\u003c/option>${opts(statuses,status)}\u003c/select>\u003c/label>\u003cb>${example?\"작성 예시 · \":\"\"}${display.length}건\u003c/b>\u003c/div>\u003cdiv class=\"scroll\">\u003ctable>\u003cthead>\u003ctr>${[\"시작일\",\"업무구분\",\"업무 세부 내용\",\"진행 계획·지시사항\",\"담당\",\"종료일 · 상태\",\"메모\",\"업무량\",\"난이도\",\"적시성\",\"완성도\"].map(k=>`\u003cth scope=\"col\">${k}\u003c/th>`).join(\"\")}\u003c/tr>\u003c/thead>\u003ctbody>${body||'\u003ctr>\u003ctd colspan=\"11\">표시할 업무가 없습니다.\u003c/td>\u003c/tr>'}\u003c/tbody>\u003c/table>\u003c/div>\u003c/section>\u003cdialog>\u003cform>\u003ch2>\u003c/h2>\u003cdiv class=\"task-fields\">\u003c/div>\u003cp role=\"alert\">\u003c/p>\u003cfooter>\u003cbutton type=\"button\" id=\"cancel-task\">취소\u003c/button>\u003cbutton class=\"primary\">저장\u003c/button>\u003c/footer>\u003c/form>\u003c/dialog>`;\n  el.querySelector(\"#examples\").onclick=()=>{example=!example;owner=status=\"\";draw();};\n  el.querySelector(\"#newtask\").onclick=()=>edit(null);\n  for(const [id,update] of [[\"by-owner\",v=>owner=v],[\"by-status\",v=>status=v]])el.querySelector(\"#\"+id).onchange=e=>{update(e.target.value);draw();};\n  el.querySelectorAll(\"[data-edit]\").forEach(b=>b.onclick=()=>edit(records.find(r=>r.id===b.dataset.edit)));\n }\n function edit(old){\n  const dlg=el.querySelector(\"dialog\"),f=dlg.querySelector(\"form\");f.querySelector(\"h2\").textContent=old?\"업무 수정\":\"업무 등록\";\n  f.querySelector(\".task-fields\").innerHTML=fields.map(([key,label,type])=>{\n   const val=esc(old?.[key]),required=[\"start\",\"type\",\"detail\",\"owner\"].includes(key)?\"required\":\"\";\n   return `\u003clabel class=\"${type===\"textarea\"?\"wide\":\"\"}\">${label}${type===\"textarea\"?`\u003ctextarea name=\"${key}\" ${required}>${val}\u003c/textarea>`:type===\"select\"?`\u003cselect name=\"${key}\">${statuses.map(s=>`\u003coption ${old?.status===s?\"selected\":\"\"}>${s}\u003c/option>`).join(\"\")}\u003c/select>`:`\u003cinput name=\"${key}\" type=\"${type}\" value=\"${val}\" ${required} ${type===\"number\"?'min=\"0\" step=\"any\"':''}>`}\u003c/label>`;\n  }).join(\"\");\n  f.querySelector(\"#cancel-task\").onclick=()=>dlg.close();f.onsubmit=e=>{\n   e.preventDefault();const row=Object.fromEntries([...new FormData(f)].map(([k,v])=>[k,v.trim()]));\n   const err=f.querySelector(\"[role=alert]\");\n   if(!row.type||!row.owner||!row.detail){err.textContent=\"업무구분과 세부 내용, 담당자를 입력해 주세요.\";return;}\n   if(row.end&&row.end\u003crow.start){err.textContent=\"종료일은 시작일 이후로 입력해 주세요.\";return;}\n   try{if(localStorage.getItem(storage)!==snapshot)throw Error(\"다른 창에서 업무가 변경되었습니다. 새로고침 후 다시 작성해 주세요.\");\n    row.id=old?.id||crypto.randomUUID();const next=old?records.map(r=>r.id===old.id?row:r):[...records,row],str=JSON.stringify(next);localStorage.setItem(storage,str);records=next;snapshot=str;example=false;owner=status=\"\";dlg.close();draw();\n   }catch(error){err.textContent=error.message;}\n  };dlg.showModal();\n }\n draw();\n})();\n"]};
  const params=new URLSearchParams(location.search);

  :host{font-family:Inter,"Malgun Gothic",sans-serif;color:#1b2941}
  *{box-sizing:border-box}

  </style><div class="rail" id="product-menu"><a class="logo" href="?module=${Object.keys(pages)[0]}" aria-label="all hands ${config.product} 첫 화면">${config.logo}<span class="brand-caption">all hands | ${config.title}</span></a>
