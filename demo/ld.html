function assessmentPairs(){

 return [...new Set([...official,...self].map(r=>r.skill))].map(skill=>({skill,official:official.find(r=>r.skill===skill),self:self.find(r=>r.skill===skill)}));

function recommendedSlots(){
 const pairs=assessmentPairs(),records=learningRecords(learner),path=assignedPath(learner);
 return openSlots().flatMap(s=>{
  const c=course(s.course);
  if(!c||records.some(e=>session(e.session).course===c.id&&e.status==="수료"))return [];
  const pair=pairs.find(p=>p.skill===c.skill),why=[];
  for(const [label,r] of [["역량평가",pair?.official],["자기평가",pair?.self]]){
   if(r&&+r.current<+r.target&&+c.level>+r.current&&+c.level<=+r.target)why.push(label+" "+r.current+" → 목표 "+r.target);
  }
  if(path?.steps.some(t=>t.course===c.id&&t.required))why.push("경력경로 필수");
  return why.length?[{s,c,why}]:[];
 });
}

function creditCheck(p){
 const completed=db.enroll.filter(e=>e.person===p.person&&e.status==="수료"&&Number(e.completed?.slice(0,4))===p.year);
 const planned=p.items.map(i=>session(i.session)).filter(Boolean);
 const goals=db.goals.filter(g=>g.person===p.person&&Number(g.year)===p.year);
 const buckets=[...new Set([...goals.map(g=>g.area),...completed.map(e=>course(session(e.session).course).area),...planned.map(s=>course(s.course).area)])];
 return buckets.map(area=>{
  const g=goals.find(x=>x.area===area),actual=sum(completed.filter(e=>course(session(e.session).course).area===area),earned);
  const expected=sum(planned.filter(s=>course(s.course).area===area&&learnerEnrollment(p.person,s.id)?.status!=="수료"),s=>course(s.course).credit);
  return {area,target:g?Number(g.target):null,actual,expected,gap:g?Math.max(0,Number(g.target)-actual-expected):null};
 });
}
function planIssues(p){

}
