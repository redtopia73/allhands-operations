<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>개인 운영관리 | 올핸잡</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f7fc;color:#172852;font:15px "Nanum Gothic",system-ui,sans-serif}.top{height:56px;padding:0 max(30px,calc((100% - 1320px)/2));background:#fff;border-bottom:1px solid #e1e6ee;display:flex;justify-content:space-between;align-items:center}.brand{font-weight:900}.brand:before{content:"";display:inline-block;width:20px;height:20px;margin-right:9px;vertical-align:-4px;border-radius:7px;background:linear-gradient(135deg,#ff6c61,#ffc0ad)}.brand b{color:#ff5e4e}.back{color:#51617c;text-decoration:none;font-size:13px;font-weight:850}.hero{position:relative;overflow:hidden;display:flex;justify-content:space-between;gap:28px;align-items:center;max-width:1320px;margin:24px auto 0;padding:30px 42px;border-radius:18px;background:linear-gradient(115deg,#0d3467,#07576d 54%,#1d9c9b);color:#fff;box-shadow:0 16px 34px rgba(16,48,94,.16)}.hero:before{content:"";position:absolute;width:330px;height:330px;right:-75px;top:-180px;border:1px solid #ffffff33;border-radius:50%}.hero-copy,.hero-mark{position:relative;z-index:1}.hero .eyebrow{display:inline-block;margin-bottom:10px;padding:7px 10px;border:1px solid #ffffff99;border-radius:99px;font-size:11px;font-weight:850;letter-spacing:.06em}.hero h1{margin:0;font-size:32px;line-height:1.2;letter-spacing:-.06em}.hero p{margin:9px 0 0;color:#ffffffdd;font-size:13px}.hero-mark{min-width:260px;text-align:center}.hero-mark span{display:block;margin-bottom:8px;font-size:16px;font-weight:850}.hero-mark strong{display:block;font-size:38px;line-height:.94}.layout{display:grid;grid-template-columns:200px minmax(0,1fr);max-width:1320px;margin:auto;min-height:calc(100vh - 265px)}.side-nav{padding:24px 14px;background:#fff;border-right:1px solid #e1e7f0}.side-label{margin:0 10px 12px;color:#6f7d94;font-size:10px;font-weight:900;letter-spacing:.1em}.side-label:before{content:"";display:inline-block;width:8px;height:8px;margin-right:7px;border-radius:50%;background:#ff7166}.tabs{display:grid;gap:5px}.tabs button{width:100%;border:0;border-left:3px solid transparent;border-radius:8px;background:transparent;color:#526481;padding:11px 12px;text-align:left;font:inherit;font-size:14px;font-weight:850;cursor:pointer}.tabs button.active{border-left-color:#ff695d;background:#f2f5fd;color:#172852}.workspace{padding:40px 32px 62px}.workspace-head{padding-bottom:22px;border-bottom:1px solid #dde5f0}.eyebrow{color:#ff5e4e;font-size:11px;font-weight:900;letter-spacing:.1em}.workspace-head h2{position:relative;margin:5px 0 7px;font-size:30px;letter-spacing:-.06em}.workspace-head h2:after{display:none}.workspace-head p,.muted{margin:0;color:#687791;line-height:1.65}.grid{display:grid;gap:15px;margin-top:22px}.card{background:#fff;border:1px solid #e0e6ef;border-radius:14px;padding:22px;box-shadow:0 8px 22px #1836650a}.card h2{margin:5px 0 9px;font-size:19px}.tools{display:flex;justify-content:space-between;gap:12px;margin:14px 0}.tools input,.form select{border:1px solid #d5deeb;border-radius:8px;padding:9px;font:inherit}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.weekday{text-align:center;color:#79869a;font-size:12px;font-weight:850;padding:6px}.day{border:1px solid #dfe6ee;border-radius:9px;padding:8px;min-height:130px}.day select,.day input{display:block;width:100%;margin-top:5px;border:1px solid #d7dfe9;border-radius:6px;padding:5px;font:12px inherit}.hours{display:grid;grid-template-columns:1fr 1fr;gap:4px}.hours label{font-size:10px;color:#738097;font-weight:850}.primary{border:0;border-radius:8px;background:#172852;color:#fff;padding:11px 15px;font:inherit;font-weight:850;cursor:pointer}.facts{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid #e1e6ef;border-radius:10px;overflow:hidden}.facts div{padding:12px;border-right:1px solid #e1e6ef}.facts span{display:block;color:#77849a;font-size:11px;font-weight:850;margin-bottom:6px}.notice{padding:16px;border:1px dashed #ced8e7;border-radius:10px;color:#64718a;line-height:1.7}.form{display:grid;gap:10px;max-width:720px}.form textarea{min-height:120px;padding:10px;border:1px solid #d7dfe9;border-radius:8px;font:inherit}.request-item{border-top:1px solid #e6eaf1;padding:14px 0}.status{display:inline-block;padding:4px 8px;border-radius:99px;background:#fff3d7;color:#9a6500;font-size:12px;font-weight:850}.status.approved{background:#e5f6ec;color:#16734d}.status.rejected{background:#ffe7e5;color:#b52a2a}@media(max-width:1360px){.hero{margin-left:16px;margin-right:16px}}@media(max-width:760px){.top{padding:0 16px}.hero{margin-top:14px;padding:24px;display:block}.hero h1{font-size:25px}.hero-mark{margin-top:20px;text-align:left}.hero-mark strong{font-size:31px}.layout{grid-template-columns:1fr}.side-nav{padding:14px 16px;border-right:0;border-bottom:1px solid #e1e7f0}.side-label{display:none}.tabs{display:flex;overflow:auto}.tabs button{width:auto;white-space:nowrap;border-left:0;border-bottom:3px solid transparent}.tabs button.active{border-left:0;border-bottom-color:#ff695d}.workspace{padding:26px 16px 48px}.calendar{grid-template-columns:repeat(2,1fr)}.weekday{display:none}.facts{grid-template-columns:repeat(2,1fr)}}</style>
<style>
  /* 기업용 운영관리 배너와 동일한 서체·여백·장식 기준 */
  .hero,.hero *{font-family:"IBM Plex Sans KR","Noto Sans KR",system-ui,sans-serif!important}

  .hero:before,.hero:after{content:"";position:absolute;border:1px solid rgba(255,255,255,.15);border-radius:50%;pointer-events:none}
  .hero:before{width:330px;height:330px;right:-75px;top:-180px}

</style>

<body><header class="top"><div class="brand">all hands <b>개인 운영관리</b></div><a class="back" href="https://allhands-job.vercel.app">올핸잡으로 돌아가기</a></header><section class="hero"><div class="hero-copy"><div class="eyebrow">ALLHANDS JOB</div><h1>올핸잡 현장운영 통합관리</h1><p>배치된 현장의 근태 입력부터 급여 확인, 각종 신청까지 한곳에서 관리합니다.</p></div><div class="hero-mark"><span>ALLHANDS JOB</span><strong>운영관리<br>시스템</strong></div></section><div class="layout"><aside class="side-nav"><div class="side-label">MY OPERATIONS</div><nav class="tabs"><button class="active" data-tab="attendance">근태 입력</button><button data-tab="payroll">급여 확인</button><button data-tab="certificate">증명서 신청</button><button data-tab="request">근태 신청</button><button data-tab="contract" id="contractTab" disabled>근로계약서</button><button data-tab="notice">공지사항</button></nav></aside><main class="workspace"><div class="workspace-head"><div class="eyebrow">WORKER GROUPWARE</div><h2 id="pageTitle">근태 입력</h2><p id="pageIntro">배치된 현장의 근태를 입력하고 담당자 확인을 요청합니다.</p></div><section id="app" class="grid"><div class="notice">정보를 불러오는 중입니다.</div></section></main></div><script>const app=document.getElementById('app'),tabs=document.querySelector('.tabs'),title=document.getElementById('pageTitle'),intro=document.getElementById('pageIntro'),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),monthLabel=m=>{const [y,n]=m.split('-');return `${y}년 ${Number(n)}월`},copy={attendance:['근태 입력','배치된 현장의 근태를 입력하고 담당자 확인을 요청합니다.'],payroll:['급여 확인','운영담당자가 확정한 월별 급여 내역을 확인합니다.'],certificate:['증명서 신청','필요한 증명서 종류를 선택해 신청합니다.'],request:['근태 신청','근태 관련 요청 유형을 선택해 담당자에게 전달합니다.'],notice:['공지사항','배치된 업체에서 등록한 현장 공지를 확인합니다.']};let data={items:[],notices:[],requests:[]},tab='attendance',month=new Date().toISOString().slice(0,7);
const operation=i=>i.employer_note?.operation||{},records=i=>Object.fromEntries((i.employer_note?.workerAttendance||[]).filter(r=>String(r.workDate||'').startsWith(month+'-')).map(r=>[r.workDate,r])),companyName=i=>String(i.client_name||i.job_data?.clientName||i.job_data?.customerName||i.job_data?.client||i.company_data?.companyName||i.company_data?.company||i.company_data?.name||i.job_title||'거래처 미지정');
function attendance(i){const y=+month.slice(0,4),m=+month.slice(5),count=new Date(y,m,0).getDate(),first=new Date(y,m-1,1).getDay(),map=records(i),cells=[...Array(first).fill('<div></div>')];for(let d=1;d<=count;d++){const date=`${month}-${String(d).padStart(2,'0')}`,r=map[date]||{},status=r.attendance||'휴무',normal=r.normalHours??(status==='출근'?8:0),over=r.overtimeHours??0;cells.push(`<div class="day" data-day="${d}"><b>${d}일</b><select><option ${status==='출근'?'selected':''}>출근</option><option ${status==='지각'?'selected':''}>지각</option><option ${status==='결근'?'selected':''}>결근</option><option ${status==='휴무'?'selected':''}>휴무</option></select><div class="hours"><label>정상<input data-normal type="number" min="0" max="24" value="${normal}"></label><label>연장<input data-over type="number" min="0" max="16" value="${over}"></label></div></div>`)}return `<article class="card" data-attendance="${i.id}"><h2>${esc(i.job_title)}</h2><p class="muted">근태 입력값은 담당자가 확인 후 최종 반영합니다.</p><div class="tools"><b>${monthLabel(month)} 근태</b><input type="month" value="${month}" data-month></div><div class="calendar">${['일','월','화','수','목','금','토'].map(v=>`<div class="weekday">${v}</div>`).join('')}${cells.join('')}</div><p><button class="primary" data-save="${i.id}">근태 저장</button></p></article>`}function payroll(i){const o=operation(i),s=o.payrollSummary||{},ok=o.payrollConfirmed&&o.payrollConfirmedMonth===month;return `<article class="card"><h2>${esc(i.job_title)}</h2>${ok?`<div class="facts"><div><span>정상근로</span><b>${esc(s.normalHours)}시간</b></div><div><span>연장근로</span><b>${esc(s.overtimeHours)}시간</b></div><div><span>총지급액</span><b>${esc(s.grossPay)}</b></div><div><span>실지급액</span><b>${esc(s.netPay)}</b></div></div>`:`<div class="notice">${monthLabel(month)} 급여 확정 전입니다. 운영담당자가 급여를 확정하면 표시됩니다.</div>`}</article>`}function requestForm(kind){const choices=kind==='certificate'?['재직증명서','경력증명서']:['연차','반차','조퇴','지각 사유서'];return `<article class="card"><h2>${kind==='certificate'?'증명서 신청':'근태 신청'}</h2><p class="muted">신청 후 기업 담당자의 전자결재에서 승인 또는 반려됩니다.</p><form class="form" data-request="${kind}"><select name="applicationId">${data.items.map(i=>`<option value="${i.id}">${esc(i.job_title)}</option>`).join('')}</select><select name="requestType">${choices.map(v=>`<option>${v}</option>`).join('')}</select><textarea name="content" placeholder="신청 사유 또는 전달할 내용을 입력하세요." required></textarea><button class="primary">결재 신청하기</button></form><div>${data.requests.filter(r=>r.kind===kind).map(r=>`<article class="request-item"><span class="status ${r.status==='승인'?'approved':r.status==='반려'?'rejected':''}">${esc(r.status||'결재 대기')}</span><b> ${esc(r.requestType||'신청')}</b><p class="muted">${esc(r.content||'')} · ${esc(String(r.requestedAt||'').slice(0,10))}</p></article>`).join('')||''}</div></article>`}function render(){tabs.querySelectorAll('button').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));title.textContent=copy[tab][0];intro.textContent=copy[tab][1];if(!data.items.length){app.innerHTML='<div class="notice">운영관리 사용 업체에 배치가 완료된 근무 정보가 없습니다.</div>';return}if(tab==='attendance')app.innerHTML=data.items.map(attendance).join('');else if(tab==='payroll')app.innerHTML=data.items.map(payroll).join('');else if(tab==='notice')app.innerHTML=`<article class="card"><h2>업체 공지사항</h2>${data.notices.length?data.notices.map(n=>`<article class="request-item"><h3>${esc(n.title)}</h3><div class="muted">${esc(String(n.createdAt||'').slice(0,10))}</div><p>${esc(n.content)}</p></article>`).join(''):'<div class="notice">등록된 공지사항이 없습니다.</div>'}</article>`;else app.innerHTML=requestForm(tab)}
async function load(){const r=await fetch('/api/worker-portal'),d=await r.json();if(!r.ok){app.innerHTML=`<div class="notice">${esc(d.error||'접근 권한이 없습니다.')}</div>`;return}data={...d,items:(d.items||[]).map(item=>({...item,job_title:companyName(item)}))};render()}
tabs.onclick=e=>{const b=e.target.closest('[data-tab]');if(b){tab=b.dataset.tab;render()}};app.onchange=e=>{if(e.target.matches('[data-month]')){month=e.target.value;render()}};app.onclick=async e=>{const b=e.target.closest('[data-save]');if(!b)return;const card=b.closest('[data-attendance]'),rows=[...card.querySelectorAll('.day[data-day]')].map(d=>({workDate:`${month}-${String(d.dataset.day).padStart(2,'0')}`,attendance:d.querySelector('select').value,normalHours:d.querySelector('[data-normal]').value,overtimeHours:d.querySelector('[data-over]').value}));b.disabled=true;const r=await fetch('/api/worker-portal',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'attendance-month',applicationId:+b.dataset.save,month,records:rows})}),d=await r.json();alert(r.ok?d.message:(d.error||'저장하지 못했습니다.'));load()};app.onsubmit=async e=>{const f=e.target.closest('[data-request]');if(!f)return;e.preventDefault();const fd=new FormData(f),r=await fetch('/api/worker-portal',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'request',kind:f.dataset.request,applicationId:+fd.get('applicationId'),requestType:fd.get('requestType'),content:fd.get('content')})}),d=await r.json();alert(r.ok?d.message:(d.error||'신청하지 못했습니다.'));if(r.ok)load()};const contractTab=document.getElementById('contractTab'),baseRender=render,baseLoad=load;render=()=>{if(tab!=="contract")return baseRender();tabs.querySelectorAll("button").forEach(b=>b.classList.toggle("active",b.dataset.tab===tab));title.textContent="근로계약서";intro.textContent="기업 담당자가 요청한 근로계약 내용을 확인하고 전자서명합니다.";const contracts=(data.contracts||[]),item=contracts.find(v=>v.status==="서명 요청")||contracts[0];if(!item){app.innerHTML='<div class="notice">기업 담당자의 근로계약서 작성 요청이 도착하면 이 메뉴에서 확인할 수 있습니다.</div>';return}app.innerHTML=`<article class="card"><h2>표준근로계약서</h2><p class="muted">아래 근로조건을 확인한 뒤 본인 서명을 완료해 주세요.</p><div class="facts"><div><span>계약기간</span><b>${esc(item.period||'-')}</b></div><div><span>근무장소·업무</span><b>${esc(item.workplace||'-')}</b></div><div><span>소정근로시간</span><b>${esc(item.hours||'-')}</b></div><div><span>근무일·휴일</span><b>${esc(item.holiday||'-')}</b></div><div><span>임금 구성·계산</span><b>${esc(item.wage||'-')}</b></div><div><span>지급일·방법</span><b>${esc(item.payday||'-')}</b></div><div><span>연차 유급휴가</span><b>${esc(item.leave||'-')}</b></div><div><span>기타 약정</span><b>${esc(item.other||'-')}</b></div></div>${item.status==='서명 요청'?`<p><label><input type="checkbox" id="contractAgree"> 계약 내용을 확인했고 동의합니다.</label></p><input id="contractSignature" placeholder="본인 성명을 입력해 서명"><p><button class="primary" data-contract-sign="${item.id}">전자서명 완료</button></p>`:`<div class="notice">${esc(item.status||'처리 완료')} · ${esc(String(item.signedAt||'').slice(0,10))}</div>`}</article>`};load=async()=>{await baseLoad();contractTab.disabled=!(data.contracts||[]).some(item=>item.status==='서명 요청')};app.addEventListener('click',async event=>{const button=event.target.closest('[data-contract-sign]');if(!button)return;const signature=document.getElementById('contractSignature')?.value?.trim();if(!document.getElementById('contractAgree')?.checked)return alert('계약 내용 동의에 체크해 주세요.');if(!signature)return alert('본인 성명을 입력해 주세요.');const response=await fetch('/api/worker-portal',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'contract-sign',documentId:Number(button.dataset.contractSign),signature})}),out=await response.json();alert(response.ok?out.message:(out.error||'서명하지 못했습니다.'));if(response.ok)load()});;load()</script></body></html>
