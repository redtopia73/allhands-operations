<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>개인 운영관리 | 올핸잡</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f7fb;color:#172852;font:15px "Nanum Gothic",system-ui,sans-serif}.top{padding:18px max(20px,calc((100% - 1100px)/2));background:#fff;border-bottom:1px solid #e1e6ee;display:flex;justify-content:space-between;align-items:center}.brand{font-weight:900}.brand b{color:#ff5e4e}.back{color:#51617c;text-decoration:none;font-size:13px;font-weight:800}.wrap{max-width:1100px;margin:auto;padding:34px 20px}.eyebrow{color:#ff5e4e;font-size:12px;font-weight:900;letter-spacing:.08em}h1{margin:7px 0;font-size:30px}.intro{color:#65738b;line-height:1.65}.tabs{display:flex;gap:8px;overflow:auto;margin:25px 0 18px}.tabs button{white-space:nowrap;border:1px solid #d8e0eb;border-radius:10px;background:#fff;color:#60708a;padding:11px 14px;font:inherit;font-weight:850;cursor:pointer}.tabs button.active{background:#172852;color:#fff;border-color:#172852}.grid{display:grid;gap:15px}.card{background:#fff;border:1px solid #e0e6ef;border-radius:14px;padding:19px}.card h2{margin:5px 0 9px;font-size:19px}.muted{color:#64718a;line-height:1.65}.tools{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:14px 0}.tools input{border:1px solid #d5deeb;border-radius:8px;padding:9px;font:inherit}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.weekday{text-align:center;color:#79869a;font-size:12px;font-weight:850;padding:6px}.day{border:1px solid #dfe6ee;border-radius:9px;padding:8px;min-height:130px}.day select,.day input{display:block;width:100%;margin-top:5px;border:1px solid #d7dfe9;border-radius:6px;padding:5px;font:12px inherit}.hours{display:grid;grid-template-columns:1fr 1fr;gap:4px}.hours label{font-size:10px;color:#738097;font-weight:850}.primary{border:0;border-radius:8px;background:#172852;color:#fff;padding:11px 15px;font:inherit;font-weight:850;cursor:pointer}.facts{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid #e1e6ef;border-radius:10px;overflow:hidden}.facts div{padding:12px;border-right:1px solid #e1e6ef}.facts span{display:block;color:#77849a;font-size:11px;font-weight:850;margin-bottom:6px}.notice{padding:16px;border:1px dashed #ced8e7;border-radius:10px;color:#64718a;line-height:1.7}.form{display:grid;gap:10px;max-width:720px}.form textarea{min-height:120px;padding:10px;border:1px solid #d7dfe9;border-radius:8px;font:inherit}.notice-item{border-top:1px solid #e6eaf1;padding:14px 0}.notice-item:first-child{border-top:0}.notice-item h3{margin:0 0 5px}@media(max-width:700px){.calendar{grid-template-columns:repeat(2,1fr)}.weekday{display:none}.facts{grid-template-columns:repeat(2,1fr)}.wrap{padding:25px 14px}}</style></head><body><header class="top"><div class="brand">all hands <b>개인 운영관리</b></div><a class="back" href="https://allhands-job.vercel.app">올핸잡으로 돌아가기</a></header><main class="wrap"><div class="eyebrow">WORKER GROUPWARE</div><h1>내 현장 운영관리</h1><p class="intro">배치된 현장의 근태, 급여, 증명서와 신청 내역을 한곳에서 관리합니다.</p><div class="tabs"><button class="active" data-tab="attendance">근태 입력</button><button data-tab="payroll">급여 확인</button><button data-tab="certificate">증명서 신청</button><button data-tab="request">근태 신청</button><button data-tab="notice">공지사항</button></div><section id="app" class="grid"><div class="notice">정보를 불러오는 중입니다.</div></section></main><script>const app=document.getElementById('app'),tabs=document.querySelector('.tabs'),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),monthLabel=m=>{const [y,n]=m.split('-');return `${y}년 ${Number(n)}월`};let data={items:[],notices:[]},tab='attendance',month=new Date().toISOString().slice(0,7);const operation=i=>i.employer_note?.operation||{},records=i=>Object.fromEntries((i.employer_note?.workerAttendance||[]).filter(r=>String(r.workDate||'').startsWith(month+'-')).map(r=>[r.workDate,r]));function attendance(i){const y=+month.slice(0,4),m=+month.slice(5),count=new Date(y,m,0).getDate(),first=new Date(y,m-1,1).getDay(),map=records(i),cells=[...Array(first).fill('<div></div>')];for(let d=1;d<=count;d++){const date=`${month}-${String(d).padStart(2,'0')}`,r=map[date]||{},status=r.attendance||'휴무',normal=r.normalHours??(status==='출근'?8:0),over=r.overtimeHours??0;cells.push(`<div class="day" data-day="${d}"><b>${d}일</b><select><option ${status==='출근'?'selected':''}>출근</option><option ${status==='지각'?'selected':''}>지각</option><option ${status==='결근'?'selected':''}>결근</option><option ${status==='휴무'?'selected':''}>휴무</option></select><div class="hours"><label>정상<input data-normal type="number" min="0" max="24" value="${normal}"></label><label>연장<input data-over type="number" min="0" max="16" value="${over}"></label></div></div>`)}return `<article class="card" data-attendance="${i.id}"><h2>${esc(i.job_title)}</h2><p class="muted">근태 입력값은 담당자가 확인 후 최종 반영합니다.</p><div class="tools"><b>${monthLabel(month)} 근태</b><input type="month" value="${month}" data-month></div><div class="calendar">${['일','월','화','수','목','금','토'].map(v=>`<div class="weekday">${v}</div>`).join('')}${cells.join('')}</div><p><button class="primary" data-save="${i.id}">근태 저장</button></p></article>`}function payroll(i){const o=operation(i),s=o.payrollSummary||{},ok=o.payrollConfirmed&&o.payrollConfirmedMonth===month;return `<article class="card"><h2>${esc(i.job_title)}</h2>${ok?`<div class="facts"><div><span>정상근로</span><b>${esc(s.normalHours)}시간</b></div><div><span>연장근로</span><b>${esc(s.overtimeHours)}시간</b></div><div><span>총지급액</span><b>${esc(s.grossPay)}</b></div><div><span>실지급액</span><b>${esc(s.netPay)}</b></div></div>`:`<div class="notice">${monthLabel(month)} 급여 확정 전입니다. 운영담당자가 급여를 확정하면 표시됩니다.</div>`}</article>`}function form(kind){return `<article class="card"><h2>${kind==='certificate'?'증명서 신청':'근태 신청'}</h2><p class="muted">배치된 업체 담당자에게 신청 내용이 전달됩니다.</p><form class="form" data-request="${kind}"><select name="applicationId">${data.items.map(i=>`<option value="${i.id}">${esc(i.job_title)}</option>`).join('')}</select><textarea name="content" placeholder="신청 내용을 입력하세요." required></textarea><button class="primary">신청하기</button></form></article>`}function render(){tabs.querySelectorAll('button').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));if(!data.items.length){app.innerHTML='<div class="notice">운영관리 사용 업체에 배치가 완료된 근무 정보가 없습니다.</div>';return}if(tab==='attendance')app.innerHTML=data.items.map(attendance).join('');else if(tab==='payroll')app.innerHTML=data.items.map(payroll).join('');else if(tab==='notice')app.innerHTML=`<article class="card"><h2>업체 공지사항</h2>${data.notices.length?data.notices.map(n=>`<article class="notice-item"><h3>${esc(n.title)}</h3><div class="muted">${esc(String(n.createdAt||'').slice(0,10))}</div><p>${esc(n.content)}</p></article>`).join(''):'<div class="notice">등록된 공지사항이 없습니다.</div>'}</article>`;else app.innerHTML=form(tab)}async function load(){const r=await fetch('/api/worker-portal'),d=await r.json();if(!r.ok){app.innerHTML=`<div class="notice">${esc(d.error||'접근 권한이 없습니다.')}</div>`;return}data=d;render()}tabs.onclick=e=>{const b=e.target.closest('[data-tab]');if(b){tab=b.dataset.tab;render()}};app.onchange=e=>{if(e.target.matches('[data-month]')){month=e.target.value;render()}};app.onclick=async e=>{const b=e.target.closest('[data-save]');if(!b)return;const card=b.closest('[data-attendance]'),records=[...card.querySelectorAll('.day[data-day]')].map(d=>({workDate:`${month}-${String(d.dataset.day).padStart(2,'0')}`,attendance:d.querySelector('select').value,normalHours:d.querySelector('[data-normal]').value,overtimeHours:d.querySelector('[data-over]').value}));b.disabled=true;const r=await fetch('/api/worker-portal',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'attendance-month',applicationId:+b.dataset.save,month,records})}),d=await r.json();alert(r.ok?d.message:(d.error||'저장하지 못했습니다.'));load()};app.onsubmit=async e=>{const f=e.target.closest('[data-request]');if(!f)return;e.preventDefault();const fd=new FormData(f),r=await fetch('/api/worker-portal',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'request',kind:f.dataset.request,applicationId:+fd.get('applicationId'),content:fd.get('content')})}),d=await r.json();alert(r.ok?d.message:(d.error||'신청하지 못했습니다.'));if(r.ok)f.reset()};load()</script></body></html>
